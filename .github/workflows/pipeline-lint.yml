name: pipeline-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run custom hook tests
        env:
          IN_SCOPE_TS: workers/bug-webhook/fixture.ts
          IN_SCOPE_TS_BAD: workers/bug-webhook/bad-fixture.ts
          IN_SCOPE_WF: .github/workflows/bug-fixture.yml
          IN_SCOPE_MD: .github/workflows/bug-fixture.md
        run: bash Scripts/lint/tests/run-tests.sh
      # PIPE-LINT v1: scope to the LAST commit on the branch only. Existing
      # codebase is dirty by design (see story "Out of scope": no retro
      # cleanup). Each new commit must be clean; long-lived feature branches
      # aren't penalized for accumulated pre-existing violations. A separate
      # cleanup story will lift this to --all-files later.
      - name: Install pre-commit
        run: pip install pre-commit==4.6.0
      - name: Run pre-commit on last commit
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base ref; skipping (initial push)."
            exit 0
          fi
          # On a feature-branch PR with accumulated history, only audit files
          # changed by the most recent commit. Going-forward enforcement.
          pre-commit run --from-ref HEAD~1 --to-ref HEAD --show-diff-on-failure

      # zizmor runs separately because the pre-commit hook audits the whole
      # repo regardless of file filters. Scoped to last-commit workflow files.
      - name: Compute changed workflow files
        id: changed-wf
        run: |
          files=$(git diff --name-only --diff-filter=AM HEAD~1...HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Install zizmor
        if: steps.changed-wf.outputs.files != ''
        run: pipx install zizmor==1.17.0
      - name: zizmor (changed workflows only)
        if: steps.changed-wf.outputs.files != ''
        env:
          FILES: ${{ steps.changed-wf.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          zizmor --persona=regular --no-online-audits --min-severity=medium $FILES
