name: Bug Analysis
run-name: "Triage #${{ github.event.client_payload.issue_number || inputs.issue_number }}"

on:
  repository_dispatch:
    types: [analyze]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (from private repo)'
        required: true
        type: string

jobs:
  analyze:
    concurrency:
      group: bug-analysis-${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Validate payload
        run: |
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi
          echo "ISSUE_NUMBER=$ISSUE" >> "$GITHUB_ENV"
          echo "Validated issue_number: $ISSUE"

      - name: Check if already triaged
        id: check
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Check if issue already has sdk-routed label (triage already ran)
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo RaufGlasgow/Sorting-History --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q "^sdk-routed$"; then
            echo "Issue #$ISSUE_NUMBER already has sdk-routed label, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$ISSUE_NUMBER needs triage, proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout public repo (automation scripts + SDK)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Checkout private repo (game source for codebase reading)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: game-repo

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        run: npm ci

      - name: Build SDK TypeScript
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        run: npm run build

      - name: Run SDK triage
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: node dist/orchestrator.js triage --issue "$ISSUE_NUMBER"
        timeout-minutes: 5

      # C11: Send branded failure notification on triage crash
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$RESEND_API_KEY" ] && [ -n "$OWNER_EMAIL" ]; then
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"SortingHistory Pipeline <bugs@sortinghistory.com>\",
                \"to\": [\"$OWNER_EMAIL\"],
                \"subject\": \"Pipeline Failed: Triage crashed for issue #${ISSUE}\",
                \"html\": \"<div style='font-family:sans-serif;max-width:600px;margin:0 auto;'><div style='background:#b91c1c;padding:24px;text-align:center;border-radius:12px 12px 0 0;'><h1 style='color:#fff;margin:0;font-size:20px;'>Triage Pipeline Crashed</h1></div><div style='padding:24px;background:#fff;border:1px solid #e5e1d8;'><p>Bug triage for <strong>issue #${ISSUE}</strong> failed.</p><p><a href='${RUN_URL}'>View workflow run</a></p><p style='color:#888;font-size:12px;'>This is likely an API billing error or infrastructure issue.</p></div></div>\"
              }" || echo "Email send failed (non-fatal)"
          else
            echo "WARNING: RESEND_API_KEY or OWNER_EMAIL not configured — cannot send failure email"
          fi
