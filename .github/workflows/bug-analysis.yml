name: Bug Analysis
run-name: "Triage #${{ github.event.client_payload.issue_number || inputs.issue_number }}"

on:
  repository_dispatch:
    types: [analyze]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (from private repo)'
        required: true
        type: string
      correction_notes:
        description: 'Owner correction notes for re-triage context'
        required: false
        default: ''

jobs:
  analyze:
    concurrency:
      group: bug-analysis-${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate payload
        run: |
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi
          echo "ISSUE_NUMBER=$ISSUE" >> "$GITHUB_ENV"
          echo "Validated issue_number: $ISSUE"

      # PIPE-A1 (2026-05-01): Audit trail comment so duplicate dispatches
      # are visible in the issue history, not just in workflow logs.
      - name: Audit trail (collapsible)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          <details><summary>[triage] workflow=${WORKFLOW_NAME} run=${RUN_ID}</summary>

          - Run URL: ${RUN_URL}
          - Event: ${{ github.event_name }}
          - Repo: ${{ github.repository }}
          </details>
          EOF
          )
          echo "$BODY" | gh issue comment "$ISSUE_NUMBER" --repo RaufGlasgow/Sorting-History --body-file - || true

      - name: Check if already triaged
        id: check
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Allow re-triage when correction notes are provided
          CORRECTION_NOTES="${{ github.event.client_payload.correction_notes || github.event.inputs.correction_notes }}"
          if [ -n "$CORRECTION_NOTES" ]; then
            echo "Correction notes provided — allowing re-triage despite sdk-routed/sdk-triage-in-progress labels"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PIPE-A1: skip if EITHER sdk-routed (already done) OR
          # sdk-triage-in-progress (claim held by an active run) is present.
          # The concurrency group prevents stale `sdk-triage-in-progress`
          # from blocking legitimate retries — concurrent dispatches wait
          # until the holding run finishes; the failure handler removes
          # the in-progress label so retry-stuck.yml can re-dispatch cleanly.
          LABELS=$(gh issue view "$ISSUE_NUMBER" --repo RaufGlasgow/Sorting-History --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q "^sdk-routed$"; then
            echo "Issue #$ISSUE_NUMBER already has sdk-routed label, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "^sdk-triage-in-progress$"; then
            echo "Issue #$ISSUE_NUMBER already has sdk-triage-in-progress label, skipping (claim held)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$ISSUE_NUMBER needs triage, proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # PIPE-A1: claim-then-work. Add `sdk-triage-in-progress` BEFORE the
      # SDK call so concurrent dispatches see the claim and skip. On
      # success, the post-success step removes it (sdk-routed is added
      # by the orchestrator). On failure, the if: failure() handler at
      # the bottom of the job removes it and adds triage-failed.
      - name: Claim triage (add sdk-triage-in-progress label)
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh label create "sdk-triage-in-progress" \
            --repo "RaufGlasgow/Sorting-History" \
            --color "fbca04" \
            --description "Triage claim held by an active SDK run" 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --repo "RaufGlasgow/Sorting-History" \
            --add-label "sdk-triage-in-progress"
          echo "Claimed triage for issue #$ISSUE_NUMBER"

      # Clean stale triage labels on startup (moved here from auto-retry per architect review)
      - name: Clean stale labels on startup
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          for LABEL in triage-failed needs-triage; do
            gh api "repos/RaufGlasgow/Sorting-History/issues/${ISSUE_NUMBER}/labels/${LABEL}" \
              --method DELETE 2>&1 || true
          done
          echo "Cleaned stale triage labels for issue #${ISSUE_NUMBER}"

      - name: Checkout public repo (automation scripts + SDK)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Checkout private repo (game source for codebase reading)
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: game-repo

      - name: Setup Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        run: npm ci

      - name: Build SDK TypeScript
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        run: npm run build

      - name: Extract correction notes
        if: steps.check.outputs.skip != 'true'
        run: |
          # Story 3.11: Extract correction_notes from dispatch payload or workflow_dispatch input
          CORRECTION_NOTES="${{ github.event.client_payload.correction_notes || github.event.inputs.correction_notes }}"
          echo "CORRECTION_NOTES=$CORRECTION_NOTES" >> "$GITHUB_ENV"
          if [ -n "$CORRECTION_NOTES" ]; then
            echo "Correction notes present — will pass to triage CLI"
          else
            echo "No correction notes — normal triage"
          fi

      - name: Run SDK triage
        if: steps.check.outputs.skip != 'true'
        working-directory: Scripts/sdk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          # Story 3.11: Pass correction notes to triage CLI if present
          if [ -n "$CORRECTION_NOTES" ]; then
            node dist/orchestrator.js triage --issue "$ISSUE_NUMBER" --correction-notes "$CORRECTION_NOTES"
          else
            node dist/orchestrator.js triage --issue "$ISSUE_NUMBER"
          fi
        timeout-minutes: 5

      - name: Remove needs-triage label after successful triage
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo RaufGlasgow/Sorting-History \
            --remove-label "needs-triage" 2>/dev/null || true
          echo "Removed needs-triage label from issue #$ISSUE_NUMBER"

      # PIPE-A1: release the in-progress claim on success. The orchestrator
      # adds `sdk-routed` itself; this step just cleans up the claim label.
      - name: Release triage claim on success
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo RaufGlasgow/Sorting-History \
            --remove-label "sdk-triage-in-progress" 2>/dev/null || true
          echo "Released sdk-triage-in-progress claim on issue #$ISSUE_NUMBER"

      # Story 3.9: Flag issues with no contact email after triage
      - name: Flag no-email issues
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          # Check if issue has needs-human-review label
          HAS_NHR=$(gh issue view "$ISSUE" --repo RaufGlasgow/Sorting-History --json labels --jq '[.labels[].name] | if index("needs-human-review") then "yes" else "no" end' 2>/dev/null || echo "no")
          if [ "$HAS_NHR" = "yes" ]; then
            # Check issue body for contact email
            ISSUE_BODY=$(gh issue view "$ISSUE" --repo RaufGlasgow/Sorting-History --json body --jq '.body // ""' 2>/dev/null || echo "")
            if ! echo "$ISSUE_BODY" | grep -q '\*\*Contact Email:\*\*'; then
              echo "Issue #$ISSUE has needs-human-review but no contact email — posting note"
              gh issue comment "$ISSUE" --repo RaufGlasgow/Sorting-History --body "> **Note:** No contact email on this issue — reporter cannot be followed up. Use **Fix Locally** to resolve, or **Reject** if insufficient info."
            else
              echo "Issue #$ISSUE has contact email — no action needed"
            fi
          else
            echo "Issue #$ISSUE is not needs-human-review — skipping no-email check"
          fi

      # BA-008.1 AC3a+AC5: Branded failure email with jq-safe JSON
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_URL="https://github.com/RaufGlasgow/Sorting-History/issues/${ISSUE}"

          if [ -z "$RESEND_API_KEY" ] || [ -z "$OWNER_EMAIL" ]; then
            echo "WARNING: RESEND_API_KEY or OWNER_EMAIL not configured — cannot send failure email"
            exit 0
          fi

          # Build retry button if AUTH_TOKEN available
          RETRY_BUTTON=""
          if [ -n "$AUTH_TOKEN" ]; then
            ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$AUTH_TOKEN'))")
            RETRY_URL="https://sortinghistory.com/api/pipeline/redo?issue=${ISSUE}&amp;token=${ENCODED_TOKEN}"
            RETRY_BUTTON="<a href=\"${RETRY_URL}\" style=\"display:inline-block;padding:14px 24px;background:#22863a;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;\">Retry Triage</a>"
          fi

          # Write branded HTML to file (avoids JSON escaping issues)
          cat > /tmp/triage-failure-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#b91c1c;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#7f1d1d;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Pipeline Error</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">Triage Pipeline Crashed</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #b91c1c;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#b91c1c;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">What Happened</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">Bug triage for <strong>issue #${ISSUE}</strong> crashed before it could finish classifying the bug.</p>
              </div>
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fefce8;border-left:4px solid #ca8a04;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#ca8a04;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Likely Cause</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">This is usually caused by an API billing error (Anthropic credits depleted) or a transient infrastructure issue. Check your <a href="https://console.anthropic.com/settings/billing" style="color:#2563eb;">Anthropic billing dashboard</a>.</p>
              </div>
              <div style="padding:14px 16px;background:#f0f7ff;border:2px solid #93c5fd;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#1e40af;font-size:14px;">What to do: Check API credits, then retry triage. If credits are fine, check the workflow log for errors.</p>
              </div>
              <div style="text-align:center;">
                ${RETRY_BUTTON}
                <a href="${ISSUE_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View Issue</a>
              </div>
              <p style="text-align:center;margin-top:12px;"><a href="${RUN_URL}" style="color:#8B6914;font-size:13px;text-decoration:none;">View workflow log &rarr;</a></p>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0 0 12px 0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
              <p style="margin:0;font-size:13px;color:#888888;text-align:center;">
                <a href="https://sortinghistory.com" style="color:#8B6914;text-decoration:none;">Website</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://x.com/SortingHistory" style="color:#8B6914;text-decoration:none;">X/Twitter</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://instagram.com/sortinghistory" style="color:#8B6914;text-decoration:none;">Instagram</a>
              </p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Triage failure alert</p>
            </div>
          </div>
          EMAILEOF

          # Build JSON safely using jq --rawfile
          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Pipeline Failed: Triage crashed for issue #${ISSUE}" \
            --rawfile html /tmp/triage-failure-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Email send failed (non-fatal)"

      - name: Label triage failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            # PIPE-A1: release the in-progress claim so retry-stuck can
            # re-dispatch this issue cleanly.
            gh issue edit "$ISSUE_NUMBER" --repo "RaufGlasgow/Sorting-History" \
              --remove-label "sdk-triage-in-progress" 2>/dev/null || true

            # Create the label if it doesn't exist (idempotent), then apply it
            gh label create "triage-failed" --repo "RaufGlasgow/Sorting-History" \
              --color "dc2626" --description "Triage pipeline failed" 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --repo "RaufGlasgow/Sorting-History" \
              --add-label "triage-failed"
            echo "Released sdk-triage-in-progress and added triage-failed for issue #$ISSUE_NUMBER"
          fi

      # ── Story 3.6a: Pipeline Outcome Logging ──
      - name: Log pipeline outcome
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ISSUE="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          if [ -z "$ISSUE" ] || ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "No valid issue number — skipping outcome log"
            exit 0
          fi

          # Determine outcome from job status
          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" = "success" ]; then
            OUTCOME="success"
            ERROR_DETAIL="null"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            OUTCOME="runner_crash"
            ERROR_DETAIL="\"Job was cancelled\""
          else
            OUTCOME="model_crash"
            ERROR_DETAIL="\"Triage workflow failed — check workflow log\""
          fi

          # Fetch classification and severity from issue labels (set by triage)
          LABELS=$(gh issue view "$ISSUE" --repo RaufGlasgow/Sorting-History --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          CLASSIFICATION="null"
          SEVERITY="null"
          for LABEL in $LABELS; do
            case "$LABEL" in
              content_error|translation_error|crash_bug|ui_bug|logic_bug|gameplay_bug|performance_bug|feature_request|duplicate|not_a_bug)
                CLASSIFICATION="\"$LABEL\""
                ;;
              P0|P1|P2|P3)
                SEVERITY="\"$LABEL\""
                ;;
            esac
          done

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build JSON with jq for safe escaping
          JSON_LINE=$(jq -n -c \
            --argjson issue_number "$ISSUE" \
            --arg timestamp "$TIMESTAMP" \
            --arg stage "triage" \
            --argjson classification "$CLASSIFICATION" \
            --argjson severity "$SEVERITY" \
            --argjson confidence null \
            --argjson model null \
            --argjson turns_used null \
            --argjson max_turns null \
            --argjson cost_usd null \
            --arg outcome "$OUTCOME" \
            --argjson attempt_number 1 \
            --argjson error_detail "$ERROR_DETAIL" \
            '{
              issue_number: $issue_number,
              timestamp: $timestamp,
              stage: $stage,
              classification: $classification,
              severity: $severity,
              confidence: $confidence,
              model: $model,
              turns_used: $turns_used,
              max_turns: $max_turns,
              cost_usd: $cost_usd,
              outcome: $outcome,
              attempt_number: $attempt_number,
              error_detail: $error_detail
            }')

          echo "Logging outcome: $JSON_LINE"
          echo "$JSON_LINE" >> pipeline-outcomes.jsonl

          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add pipeline-outcomes.jsonl
          git commit -m "log: triage outcome for #$ISSUE"

          # Retry push with rebase for concurrent append handling
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed, retrying with rebase (attempt $i)..."
            git pull --rebase origin main || true
          done
