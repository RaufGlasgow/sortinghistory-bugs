# 3x daily — pipeline has never completed a successful merge cycle.
# Keep frequent until end-to-end flow is proven.

name: Pipeline Digest

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 AM Lisbon (winter UTC+0)
    - cron: '0 14 * * *'   # 2:00 PM Lisbon
    - cron: '0 18 * * *'   # 6:00 PM Lisbon
  workflow_dispatch: {}    # Manual trigger for testing

concurrency:
  group: pipeline-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        run: cd Scripts/sdk && npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts 2>/dev/null || echo "No package.json — tsx available globally"

      - name: Read routing log for confidence data (BA-011 Story 3.3)
        id: confidence
        run: |
          # Read today's routing log via the SDK CLI
          # Falls back gracefully if no log exists (source=label_fallback)
          CONFIDENCE_JSON=$(npx tsx Scripts/sdk/lib/digest-confidence-cli.ts 2>/dev/null || echo '{"source":"label_fallback","needs_attention":[],"normal":[],"all":[]}')
          echo "confidence_json=${CONFIDENCE_JSON}" >> "$GITHUB_OUTPUT"

          # Extract needs-attention count for subject line
          ATTENTION_COUNT=$(echo "$CONFIDENCE_JSON" | jq '.needs_attention | length' 2>/dev/null || true)
          [ -z "$ATTENTION_COUNT" ] && ATTENTION_COUNT=0
          echo "attention_count=${ATTENTION_COUNT}" >> "$GITHUB_OUTPUT"

          # Build needs-attention HTML section via jq
          # Only render if there are flagged issues
          if [ "$ATTENTION_COUNT" -gt 0 ]; then
            ATTENTION_HTML="<div style=\"margin-bottom:20px;padding:16px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;\">"
            ATTENTION_HTML="${ATTENTION_HTML}<h3 style=\"margin:0 0 12px 0;font-size:16px;color:#991b1b;\">Classification Review Needed</h3>"
            ATTENTION_HTML="${ATTENTION_HTML}<p style=\"margin:0 0 12px 0;font-size:13px;color:#991b1b;\">These bugs were flagged during triage &mdash; review classifications before acting.</p>"

            # Build a card per flagged issue
            for i in $(seq 0 $((ATTENTION_COUNT - 1))); do
              ISSUE_NUM=$(echo "$CONFIDENCE_JSON" | jq -r ".needs_attention[$i].issue")
              DISPLAY=$(echo "$CONFIDENCE_JSON" | jq -r ".needs_attention[$i].display")
              FLAG_REASON=$(echo "$CONFIDENCE_JSON" | jq -r ".needs_attention[$i].flag_reason")
              ISSUE_URL="https://github.com/RaufGlasgow/Sorting-History/issues/${ISSUE_NUM}"

              ATTENTION_HTML="${ATTENTION_HTML}<div style=\"margin-bottom:8px;padding:8px 12px;background:#fff;border-radius:4px;border-left:3px solid #dc2626;\">"
              ATTENTION_HTML="${ATTENTION_HTML}<a href=\"${ISSUE_URL}\" style=\"color:#1d4ed8;font-weight:bold;text-decoration:none;\">#${ISSUE_NUM}</a>"
              ATTENTION_HTML="${ATTENTION_HTML} &mdash; <code style=\"background:#f3f4f6;padding:2px 6px;border-radius:3px;font-size:13px;\">${DISPLAY}</code>"
              if [ -n "$FLAG_REASON" ] && [ "$FLAG_REASON" != "" ]; then
                ATTENTION_HTML="${ATTENTION_HTML}<br><span style=\"font-size:12px;color:#dc2626;\">${FLAG_REASON}</span>"
              fi
              ATTENTION_HTML="${ATTENTION_HTML}</div>"
            done

            ATTENTION_HTML="${ATTENTION_HTML}</div>"
          else
            ATTENTION_HTML=""
          fi

          # Write to file (too large for GITHUB_OUTPUT in some cases)
          echo "$ATTENTION_HTML" > /tmp/attention_section.html
          echo "Confidence data loaded: source=$(echo "$CONFIDENCE_JSON" | jq -r '.source'), attention=${ATTENTION_COUNT}"

      - name: Query issues needing review
        id: query
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Single query: all open issues with from-app label. No filtering.
          # Close the issue when done — that's the only way it leaves the digest.
          ALL_NUMBERS=$(gh api "repos/RaufGlasgow/Sorting-History/issues?labels=from-app&state=open&per_page=100" --jq '.[].number' 2>/dev/null || echo "")
          ALL_NUMBERS=$(echo "$ALL_NUMBERS" | grep -v '^$' | sort -un || true)

          if [ -z "$ALL_NUMBERS" ]; then
            echo "No open from-app issues found."
            echo "issue_count=0" >> "$GITHUB_OUTPUT"
            echo "issue_list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(echo "$ALL_NUMBERS" | wc -l | tr -d ' ')
          echo "Found ${COUNT} open from-app issues."
          echo "issue_count=${COUNT}" >> "$GITHUB_OUTPUT"

          # Store issue numbers as space-separated list
          ISSUE_LIST=$(echo "$ALL_NUMBERS" | tr '\n' ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "issue_list=${ISSUE_LIST}" >> "$GITHUB_OUTPUT"

      - name: Query open pipeline PRs
        id: query_prs
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Get all open, non-draft PRs with fix/bug-* or fix/sdk-bug-* branch pattern
          gh api "repos/RaufGlasgow/Sorting-History/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.head.ref | (startswith("fix/bug-") or startswith("fix/sdk-bug-"))) | select(.draft == false) | {number, title, head_ref: .head.ref, body, html_url}]' > /tmp/prs.json

          PR_COUNT=$(jq length /tmp/prs.json)
          echo "pr_count=$PR_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $PR_COUNT open pipeline PRs"

      - name: Check reward code pool status (BA-012.2 AC7)
        id: reward_pool
        run: |
          # Query the Worker endpoint for code pool status
          POOL_JSON=$(curl -sf "https://sortinghistory.com/api/reward-code/status" 2>/dev/null || echo '{"remaining":0,"total":0,"low":false,"empty":false}')
          POOL_LOW=$(echo "$POOL_JSON" | jq -r '.low // false')
          POOL_EMPTY=$(echo "$POOL_JSON" | jq -r '.empty // false')
          POOL_REMAINING=$(echo "$POOL_JSON" | jq -r '.remaining // 0')
          POOL_TOTAL=$(echo "$POOL_JSON" | jq -r '.total // 0')

          echo "pool_low=${POOL_LOW}" >> "$GITHUB_OUTPUT"
          echo "pool_empty=${POOL_EMPTY}" >> "$GITHUB_OUTPUT"
          echo "pool_remaining=${POOL_REMAINING}" >> "$GITHUB_OUTPUT"
          echo "pool_total=${POOL_TOTAL}" >> "$GITHUB_OUTPUT"

          if [ "$POOL_LOW" = "true" ]; then
            echo "WARNING: Offer code pool running low — ${POOL_REMAINING} of ${POOL_TOTAL} codes remaining"
          fi

      # BA-007.6: Query pipeline health — stuck issues, run counts, cost estimate
      - name: Query pipeline health
        id: pipeline_health
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          PRIVATE_REPO="RaufGlasgow/Sorting-History"
          BUGS_REPO="RaufGlasgow/sortinghistory-bugs"

          # AC1: Query issues with attention-needed labels
          STUCK_ISSUES=""
          STUCK_COUNT=0
          for LABEL in dispatch-pending needs-manual-fix fix-failed triage-failed translation-fix-failed; do
            ISSUES=$(gh api "repos/${PRIVATE_REPO}/issues?labels=${LABEL}&state=open&per_page=100" \
              --jq '.[] | "\(.number)|\(.title)|\(.html_url)"' 2>/dev/null || echo "")
            if [ -n "$ISSUES" ]; then
              STUCK_ISSUES="${STUCK_ISSUES}${ISSUES}\n"
            fi
          done

          # Deduplicate by issue number (an issue can have multiple labels)
          STUCK_ISSUES=$(printf '%b' "$STUCK_ISSUES" | sort -t'|' -k1 -un | grep -v '^$' || true)
          STUCK_COUNT=$(echo "$STUCK_ISSUES" | grep -c '.' 2>/dev/null || true)
          [ -z "$STUCK_COUNT" ] && STUCK_COUNT=0

          echo "stuck_count=${STUCK_COUNT}" >> "$GITHUB_OUTPUT"
          printf '%s' "$STUCK_ISSUES" > /tmp/stuck_issues.txt
          echo "Found ${STUCK_COUNT} stuck/failed issues"

          # AC2: Count pipeline runs in last 7 days
          SEVEN_DAYS_AGO=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u -v-7d '+%Y-%m-%dT%H:%M:%SZ')

          TRIAGE_RUNS=$(gh api "repos/${BUGS_REPO}/actions/workflows/bug-analysis.yml/runs?created=%3E${SEVEN_DAYS_AGO}&per_page=100" \
            --jq '.total_count' 2>/dev/null || true)
          [ -z "$TRIAGE_RUNS" ] && TRIAGE_RUNS=0
          FIX_RUNS=$(gh api "repos/${BUGS_REPO}/actions/workflows/sdk-bug-fix.yml/runs?created=%3E${SEVEN_DAYS_AGO}&per_page=100" \
            --jq '.total_count' 2>/dev/null || true)
          [ -z "$FIX_RUNS" ] && FIX_RUNS=0

          echo "triage_runs_7d=${TRIAGE_RUNS}" >> "$GITHUB_OUTPUT"
          echo "fix_runs_7d=${FIX_RUNS}" >> "$GITHUB_OUTPUT"
          echo "Pipeline runs (7d): ${TRIAGE_RUNS} triage, ${FIX_RUNS} fix"

          # AC4: Monthly cost approximation — only count completed runs (exclude skipped/cancelled)
          # Rough cost heuristic: $7/fix run (SDK + compile), $5/translation run (SDK only, no compile)
          # TODO: Refine based on actual Anthropic billing data after 1 month of operation
          MONTH_START=$(date -u '+%Y-%m-01T00:00:00Z')
          FIX_RUNS_MONTH=$(gh api "repos/${BUGS_REPO}/actions/workflows/sdk-bug-fix.yml/runs?created=%3E${MONTH_START}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")] | length' 2>/dev/null || echo "0")
          [ -z "$FIX_RUNS_MONTH" ] && FIX_RUNS_MONTH=0

          TRANSLATION_RUNS_MONTH=$(gh api "repos/${BUGS_REPO}/actions/workflows/sdk-translation-pipeline.yml/runs?created=%3E${MONTH_START}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")] | length' 2>/dev/null || echo "0")
          [ -z "$TRANSLATION_RUNS_MONTH" ] && TRANSLATION_RUNS_MONTH=0

          ESTIMATED_COST=$(( (FIX_RUNS_MONTH * 7) + (TRANSLATION_RUNS_MONTH * 5) ))

          echo "fix_runs_month=${FIX_RUNS_MONTH}" >> "$GITHUB_OUTPUT"
          echo "translation_runs_month=${TRANSLATION_RUNS_MONTH}" >> "$GITHUB_OUTPUT"
          echo "estimated_cost=${ESTIMATED_COST}" >> "$GITHUB_OUTPUT"
          echo "Month cost estimate: ${FIX_RUNS_MONTH} fix x \$7 + ${TRANSLATION_RUNS_MONTH} translation x \$5 = \$${ESTIMATED_COST} (budget: \$30)"

      - name: Generate health metrics HTML (Story 3.6 AC1)
        id: health
        run: |
          # Run health-metrics CLI to build System Health HTML from workflow state files.
          # Falls back to empty string if no state files or CLI fails.
          HEALTH_HTML=$(npx tsx Scripts/sdk/lib/health-metrics-cli.ts 2>/dev/null || echo "")
          if [ -n "$HEALTH_HTML" ]; then
            echo "$HEALTH_HTML" > /tmp/health_section.html
            echo "has_health=true" >> "$GITHUB_OUTPUT"
            echo "Health metrics HTML generated ($(echo "$HEALTH_HTML" | wc -c | tr -d ' ') bytes)"
          else
            echo "" > /tmp/health_section.html
            echo "has_health=false" >> "$GITHUB_OUTPUT"
            echo "No health metrics data available"
          fi

      - name: Build digest email
        id: build
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          ISSUE_LIST: ${{ steps.query.outputs.issue_list }}
          ISSUE_COUNT: ${{ steps.query.outputs.issue_count }}
          PR_COUNT: ${{ steps.query_prs.outputs.pr_count }}
          CONFIDENCE_JSON: ${{ steps.confidence.outputs.confidence_json }}
          POOL_LOW: ${{ steps.reward_pool.outputs.pool_low }}
          POOL_EMPTY: ${{ steps.reward_pool.outputs.pool_empty }}
          POOL_REMAINING: ${{ steps.reward_pool.outputs.pool_remaining }}
          POOL_TOTAL: ${{ steps.reward_pool.outputs.pool_total }}
          STUCK_COUNT: ${{ steps.pipeline_health.outputs.stuck_count }}
          TRIAGE_RUNS_7D: ${{ steps.pipeline_health.outputs.triage_runs_7d }}
          FIX_RUNS_7D: ${{ steps.pipeline_health.outputs.fix_runs_7d }}
          FIX_RUNS_MONTH: ${{ steps.pipeline_health.outputs.fix_runs_month }}
          TRANSLATION_RUNS_MONTH: ${{ steps.pipeline_health.outputs.translation_runs_month }}
          ESTIMATED_COST: ${{ steps.pipeline_health.outputs.estimated_cost }}
        run: |
          # Function to escape HTML entities
          html_escape() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          # BA-011 Story 3.3: Lookup confidence data for an issue from routing log
          # Returns "classification (NN%)" or empty string if not found
          get_confidence_display() {
            local issue_num="$1"
            if [ -z "$CONFIDENCE_JSON" ]; then
              echo ""
              return
            fi
            local display
            display=$(echo "$CONFIDENCE_JSON" | jq -r --argjson num "$issue_num" '.all[] | select(.issue == $num) | .display' 2>/dev/null || echo "")
            echo "$display"
          }

          # =============================================
          # Section 1: Bugs Awaiting Review
          # =============================================
          BUG_CARDS=""
          ANALYZED_COUNT=0
          PENDING_COUNT=0
          PENDING_NUMS=""

          if [ -n "$ISSUE_LIST" ] && [ "$ISSUE_COUNT" != "0" ]; then
            for NUM in $ISSUE_LIST; do
              echo "Processing issue #${NUM}..."

              # Fetch issue details
              ISSUE_JSON=$(gh api "repos/RaufGlasgow/Sorting-History/issues/${NUM}" 2>/dev/null || echo "{}")
              TITLE=$(echo "$ISSUE_JSON" | jq -r '.title // "Unknown"')
              CREATED_AT=$(echo "$ISSUE_JSON" | jq -r '.created_at // ""')
              ISSUE_URL=$(echo "$ISSUE_JSON" | jq -r '.html_url // ""')
              BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')

              # Extract "Actual behavior" from bug report body
              ACTUAL_BEHAVIOR=$(echo "$BODY" | awk '/^\*\*Actual behavior:\*\*/{found=1; next} /^\*\*/{found=0} found && NF{print}' | head -10 | tr '\n' ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [ -z "$ACTUAL_BEHAVIOR" ]; then
                ACTUAL_BEHAVIOR=""
              fi

              # Extract severity and type from issue labels
              SEVERITY=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name | select(startswith("P"))] | first // "Unknown"')
              TYPE=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name | select(. != "from-app" and . != "needs-human-review" and . != "needs-triage" and . != "needs-review" and (startswith("P") | not))] | first // "Unknown"')

              # BA-011 Story 3.3: Overlay confidence from routing log
              CONF_DISPLAY=$(get_confidence_display "$NUM")
              if [ -n "$CONF_DISPLAY" ]; then
                TYPE="$CONF_DISPLAY"
              fi

              # Format date as "Mon DD"
              if [ -n "$CREATED_AT" ] && [ "$CREATED_AT" != "null" ]; then
                FILED_DATE=$(date -d "$CREATED_AT" '+%b %d' 2>/dev/null || echo "$CREATED_AT" | cut -c1-10)
              else
                FILED_DATE="Unknown"
              fi

              # Fetch comments (newest first)
              COMMENTS_JSON=$(gh api "repos/RaufGlasgow/Sorting-History/issues/${NUM}/comments?sort=created&direction=desc&per_page=50" 2>/dev/null || echo "[]")

              # Find the most recent comment containing "## AI Bug Analysis"
              ANALYSIS_COMMENT=$(echo "$COMMENTS_JSON" | jq -r '[.[] | select(.body | (contains("## AI Bug Analysis") or contains("## Triage Classification")))] | first | .body // ""')

              ANALYSIS_TEXT=""
              FIX_TEXT=""
              COMMENT_SEVERITY=""
              COMMENT_TYPE=""

              if [ -z "$ANALYSIS_COMMENT" ]; then
                # Check if this issue has triage-failed label — if so, skip it entirely
                HAS_TRIAGE_FAILED=$(echo "$ISSUE_JSON" | jq -r '[.labels[].name] | if index("triage-failed") then "yes" else "no" end')
                if [ "$HAS_TRIAGE_FAILED" = "yes" ]; then
                  echo "Skipping issue #${NUM} — triage-failed (will not be retried)."
                  continue
                fi
                PENDING_COUNT=$((PENDING_COUNT + 1))
                PENDING_NUMS="${PENDING_NUMS} #${NUM}"
                echo "Skipping issue #${NUM} — no AI analysis yet."
                continue
              else
                # Extract severity from comment (line starting with **Severity:**)
                COMMENT_SEVERITY=$(echo "$ANALYSIS_COMMENT" | grep -oP '^\*\*Severity:\*\*\s*\K.*' | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                if [ -z "$COMMENT_SEVERITY" ]; then
                  COMMENT_SEVERITY=$(echo "$ANALYSIS_COMMENT" | grep -oP '\|\s*Severity\s*\|\s*`\K[^`]+' | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                fi
                COMMENT_TYPE=$(echo "$ANALYSIS_COMMENT" | grep -oP '^\*\*Type:\*\*\s*\K.*' | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                if [ -z "$COMMENT_TYPE" ]; then
                  COMMENT_TYPE=$(echo "$ANALYSIS_COMMENT" | grep -oP '\|\s*Classification\s*\|\s*`\K[^`]+' | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                fi

                # Extract ### Analysis section (text between ### Analysis and next ###)
                ANALYSIS_TEXT=$(echo "$ANALYSIS_COMMENT" | awk '/^### Analysis/{found=1; next} /^###/{found=0} found{print}' | tr '\n' ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                if [ -z "$ANALYSIS_TEXT" ]; then
                  ANALYSIS_TEXT=$(echo "$ANALYSIS_COMMENT" | grep -oP '^\*\*Reasoning:\*\*\s*\K.*' | head -1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                fi

                if [ -z "$ANALYSIS_TEXT" ]; then
                  ANALYSIS_TEXT="See analysis on GitHub: ${ISSUE_URL}"
                else
                  # Truncate to 2000 chars (500 was too short — clipped analysis mid-sentence)
                  if [ ${#ANALYSIS_TEXT} -gt 2000 ]; then
                    ANALYSIS_TEXT="${ANALYSIS_TEXT:0:2000}..."
                  fi
                fi

                # Extract recommended fix: full text between ### Suggested Fix and next ### heading
                FIX_TEXT=$(echo "$ANALYSIS_COMMENT" | awk '/^### Suggested Fix/{found=1; next} /^###/{found=0} found{print}' | tr '\n' ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

                if [ -z "$FIX_TEXT" ]; then
                  FIX_TEXT="See analysis on GitHub: ${ISSUE_URL}"
                fi
              fi

              # Use comment severity/type if available, fall back to label
              if [ -n "$COMMENT_SEVERITY" ] && [ "$COMMENT_SEVERITY" != "" ]; then
                SEVERITY="$COMMENT_SEVERITY"
              fi
              if [ -n "$COMMENT_TYPE" ] && [ "$COMMENT_TYPE" != "" ]; then
                TYPE="$COMMENT_TYPE"
              fi

              # HTML-escape all user-generated content
              SAFE_TITLE=$(html_escape "$TITLE")
              SAFE_SEVERITY=$(html_escape "$SEVERITY")
              SAFE_TYPE=$(html_escape "$TYPE")
              SAFE_ANALYSIS=$(html_escape "$ANALYSIS_TEXT")
              SAFE_FIX=$(html_escape "$FIX_TEXT")
              SAFE_DATE=$(html_escape "$FILED_DATE")
              SAFE_ACTUAL=$(html_escape "$ACTUAL_BEHAVIOR")

              # Build action URLs
              APPROVE_URL="https://sortinghistory.com/api/pipeline/approve?issue=${NUM}&token=${AUTH_TOKEN}"
              REJECT_URL="https://sortinghistory.com/api/pipeline/reject?issue=${NUM}&token=${AUTH_TOKEN}"
              REWORK_URL="https://sortinghistory.com/api/pipeline/rework?issue=${NUM}&token=${AUTH_TOKEN}"
              INFO_URL="https://sortinghistory.com/api/pipeline/comment?issue=${NUM}&token=${AUTH_TOKEN}"

              # Build card HTML
              CARD="<div style=\"border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px;background:#fafafa;\">"
              CARD="${CARD}<h3 style=\"margin:0 0 8px 0;font-size:16px;color:#1a1a1a;white-space:normal;overflow-wrap:break-word;word-wrap:break-word;\">BUG #${NUM} &mdash; ${SAFE_TITLE}</h3>"
              if [ -n "$SAFE_ACTUAL" ]; then
                CARD="${CARD}<p style=\"margin:0 0 10px 0;font-size:14px;color:#333;line-height:1.4;font-style:italic;\">&ldquo;${SAFE_ACTUAL}&rdquo;</p>"
              fi
              CARD="${CARD}<p style=\"margin:0 0 8px 0;font-size:13px;color:#666;\">Severity: ${SAFE_SEVERITY} | Type: ${SAFE_TYPE} | Filed: ${SAFE_DATE}</p>"
              CARD="${CARD}<p style=\"margin:0 0 4px 0;font-size:13px;font-weight:bold;color:#333;\">ANALYSIS:</p>"
              CARD="${CARD}<p style=\"margin:0 0 12px 0;font-size:14px;color:#1a1a1a;line-height:1.4;\">${SAFE_ANALYSIS}</p>"

              if [ "$COMMENT_TYPE" = "needs_human_review" ] || [ "$TYPE" = "needs_human_review" ]; then
                CARD="${CARD}<p style=\"margin:0 0 16px 0;font-size:14px;color:#8B6914;line-height:1.4;font-style:italic;\">This issue requires your classification before the pipeline can proceed.</p>"
              elif [ -n "$FIX_TEXT" ]; then
                CARD="${CARD}<p style=\"margin:0 0 4px 0;font-size:13px;font-weight:bold;color:#333;\">RECOMMENDED FIX:</p>"
                CARD="${CARD}<p style=\"margin:0 0 16px 0;font-size:14px;color:#1a1a1a;line-height:1.4;\">${SAFE_FIX}</p>"
              fi

              # Action buttons — large tap targets (min 44px height, generous padding)
              CARD="${CARD}<div style=\"display:flex;gap:8px;flex-wrap:wrap;\">"
              if [ "$COMMENT_TYPE" != "needs_human_review" ] && [ "$TYPE" != "needs_human_review" ]; then
                CARD="${CARD}<a href=\"${APPROVE_URL}\" style=\"display:inline-block;padding:12px 24px;min-height:44px;min-width:44px;background:#22863a;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:bold;text-align:center;line-height:20px;\">Approve Fix</a>"
              fi
              CARD="${CARD}<a href=\"${REJECT_URL}\" style=\"display:inline-block;padding:12px 24px;min-height:44px;min-width:44px;background:#cb2431;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:bold;text-align:center;line-height:20px;\">Reject</a>"
              CARD="${CARD}<a href=\"${REWORK_URL}\" style=\"display:inline-block;padding:12px 24px;min-height:44px;min-width:44px;background:#d97706;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:bold;text-align:center;line-height:20px;\">Rework</a>"
              CARD="${CARD}<a href=\"${INFO_URL}\" style=\"display:inline-block;padding:12px 24px;min-height:44px;min-width:44px;background:#0366d6;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:bold;text-align:center;line-height:20px;\">Need More Info</a>"
              CARD="${CARD}</div></div>"

              BUG_CARDS="${BUG_CARDS}${CARD}"
              ANALYZED_COUNT=$((ANALYZED_COUNT + 1))
            done
          fi

          # =============================================
          # Section 2: PRs Ready for Review
          # (merged from daily-fix-digest.yml — BA-010.8 AC2)
          # =============================================
          PR_CARDS=""
          ACTUAL_PR_COUNT=0

          if [ "$PR_COUNT" != "0" ]; then
            for i in $(seq 0 $((PR_COUNT - 1))); do
              PR_NUM=$(jq -r ".[$i].number" /tmp/prs.json)
              PR_TITLE=$(jq -r ".[$i].title" /tmp/prs.json)
              PR_BRANCH=$(jq -r ".[$i].head_ref" /tmp/prs.json)
              PR_BODY=$(jq -r ".[$i].body // \"\"" /tmp/prs.json)
              PR_URL=$(jq -r ".[$i].html_url" /tmp/prs.json)

              # Extract issue number from branch name fix/bug-{N} or fix/sdk-bug-{N}
              ISSUE_NUM=""
              if echo "$PR_BRANCH" | grep -qE '^fix/(sdk-)?bug-[0-9]+'; then
                ISSUE_NUM=$(echo "$PR_BRANCH" | sed 's/fix\/\(sdk-\)\?bug-//')
              fi

              # Fetch issue title and body if we have an issue number
              ISSUE_TITLE=""
              ISSUE_BODY_RAW=""
              if [ -n "$ISSUE_NUM" ]; then
                ISSUE_TITLE=$(gh api "repos/RaufGlasgow/Sorting-History/issues/$ISSUE_NUM" --jq '.title' 2>/dev/null || echo "")
                ISSUE_BODY_RAW=$(gh api "repos/RaufGlasgow/Sorting-History/issues/$ISSUE_NUM" --jq '.body // ""' 2>/dev/null || echo "")
              fi

              # Strip images, tables, device info, screenshots from issue body for email display
              ISSUE_DESC=""
              if [ -n "$ISSUE_BODY_RAW" ]; then
                ISSUE_DESC=$(printf '%s' "$ISSUE_BODY_RAW" \
                  | sed 's/!\[.*\](data:image\/[^)]*)/[screenshot]/g' \
                  | sed '/^|.*|$/d' \
                  | sed '/^---$/d' \
                  | sed '/^## Device Info/,/^##/{/^## Device Info/d;/^##/!d;}' \
                  | sed '/^## Screenshot/,/^##/{/^## Screenshot/d;/^##/!d;}' \
                  | sed '/_Submitted via Sorting History app_/d' \
                  | sed '/^$/N;/^\n$/d' \
                  | head -c 500)
                # Append ellipsis if truncated
                if [ ${#ISSUE_BODY_RAW} -gt 500 ]; then
                  ISSUE_DESC="${ISSUE_DESC}..."
                fi
              fi
              SAFE_ISSUE_DESC=$(html_escape "$ISSUE_DESC")

              # Check PR body format: BA-009.2 (## Bug) or SDK (## SDK Bug Fix)
              PR_BODY_FORMAT="none"
              if echo "$PR_BODY" | grep -q '^## Bug'; then
                PR_BODY_FORMAT="ba009"
              elif echo "$PR_BODY" | grep -q '^## SDK Bug Fix'; then
                PR_BODY_FORMAT="sdk"
              fi

              # Escaped values for HTML
              SAFE_PR_TITLE=$(html_escape "$PR_TITLE")
              SAFE_ISSUE_TITLE=$(html_escape "$ISSUE_TITLE")

              # Build action buttons (shared across all formats)
              if [ -n "$ISSUE_NUM" ]; then
                PR_ACTIONS="<a href=\"https://sortinghistory.com/api/pipeline/merge?pr=${PR_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Merge PR</a> <a href=\"https://sortinghistory.com/api/pipeline/reject?issue=${ISSUE_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#dc2626;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Reject</a> <a href=\"https://sortinghistory.com/api/pipeline/redo?issue=${ISSUE_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#d97706;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Redo Fix</a> <a href=\"https://sortinghistory.com/api/pipeline/comment?pr=${PR_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Ask Question</a>"
              else
                PR_ACTIONS="<a href=\"https://sortinghistory.com/api/pipeline/merge?pr=${PR_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#16a34a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Merge PR</a> <a href=\"https://sortinghistory.com/api/pipeline/comment?pr=${PR_NUM}&amp;token=${AUTH_TOKEN}\" style=\"display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">Ask Question</a> <a href=\"${PR_URL}\" style=\"display:inline-block;background:#6b7280;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;font-size:14px;min-width:44px;min-height:44px;text-align:center;margin:4px;\">View on GitHub</a>"
              fi

              # Build bug reference line (shared)
              BUG_LINE=""
              if [ -n "$ISSUE_NUM" ] && [ -n "$ISSUE_TITLE" ]; then
                BUG_LINE="Fixes: Bug #${ISSUE_NUM} (${SAFE_ISSUE_TITLE})"
              elif [ -n "$ISSUE_NUM" ]; then
                BUG_LINE="Fixes: Bug #${ISSUE_NUM}"
              fi

              # Build bug description HTML block (shared across all formats)
              BUG_DESC_HTML=""
              if [ -n "$SAFE_ISSUE_DESC" ]; then
                BUG_DESC_HTML="<div style=\"margin-bottom:12px;padding:10px 12px;background:#f0f7ff;border-left:3px solid #2563eb;border-radius:4px;\"><strong style=\"font-size:12px;color:#2563eb;text-transform:uppercase;letter-spacing:0.5px;\">WHAT'S THE BUG:</strong><p style=\"margin:4px 0 0 0;font-size:13px;color:#333333;line-height:1.5;white-space:pre-line;\">${SAFE_ISSUE_DESC}</p></div>"
              fi

              if [ "$PR_BODY_FORMAT" = "ba009" ]; then
                # Parse structured PR body sections (BA-009.2 format)
                RISK_SECTION=$(printf '%s' "$PR_BODY" | sed -n '/^## Risk/,/^## /{ /^## Risk/d; /^## /d; p; }')
                RISK_LEVEL=$(printf '%s' "$RISK_SECTION" | grep '^\*\*Level:\*\*' | sed 's/\*\*Level:\*\* *//')

                HOW_TO_TEST=$(printf '%s' "$PR_BODY" | sed -n '/^## How to Test/,/^## /{ /^## How to Test/d; /^## /d; p; }')
                FILES_CHANGED=$(printf '%s' "$PR_BODY" | sed -n '/^## Files Changed/,/^## /{ /^## Files Changed/d; /^## /d; p; }')
                BUILD_TESTS=$(printf '%s' "$PR_BODY" | sed -n '/^## Build /,/^## /{ /^## Build/d; /^## /d; p; }')

                FIX_TYPE=$(printf '%s' "$HOW_TO_TEST" | grep '^\*\*Fix type:\*\*' | sed 's/\*\*Fix type:\*\* *//')

                SAFE_RISK_LEVEL=$(html_escape "${RISK_LEVEL:-Unknown}")
                SAFE_FIX_TYPE=$(html_escape "${FIX_TYPE:-unknown}")
                SAFE_FILES=$(html_escape "$FILES_CHANGED")
                SAFE_HOW_TO_TEST=$(html_escape "$HOW_TO_TEST")
                SAFE_BUILD_TESTS=$(html_escape "${BUILD_TESTS:-See PR for details}")

                PR_CARD="<div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:16px;background:#ffffff;\"><h3 style=\"margin:0 0 8px 0;font-size:16px;color:#111827;white-space:normal;overflow-wrap:break-word;word-wrap:break-word;\">PR #${PR_NUM} &mdash; ${SAFE_PR_TITLE}</h3>"
                if [ -n "$BUG_LINE" ]; then
                  PR_CARD="${PR_CARD}<p style=\"margin:0 0 8px 0;color:#6b7280;font-size:14px;\">${BUG_LINE}</p>"
                fi
                PR_CARD="${PR_CARD}${BUG_DESC_HTML}"
                PR_CARD="${PR_CARD}<p style=\"margin:0 0 12px 0;font-size:14px;color:#374151;\">Type: ${SAFE_FIX_TYPE} | Risk: ${SAFE_RISK_LEVEL}</p>"
                PR_CARD="${PR_CARD}<div style=\"margin-bottom:12px;\"><strong style=\"font-size:13px;color:#374151;\">WHAT CHANGED:</strong><pre style=\"background:#f9fafb;padding:8px;border-radius:4px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:4px 0;\">${SAFE_FILES}</pre></div>"
                PR_CARD="${PR_CARD}<p style=\"margin:0 0 12px 0;font-size:13px;color:#374151;\"><strong>BUILD &amp; TESTS:</strong> ${SAFE_BUILD_TESTS}</p>"
                PR_CARD="${PR_CARD}<div style=\"margin-bottom:12px;\"><strong style=\"font-size:13px;color:#374151;\">HOW TO TEST:</strong><pre style=\"background:#f9fafb;padding:8px;border-radius:4px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:4px 0;\">${SAFE_HOW_TO_TEST}</pre></div>"
                PR_CARD="${PR_CARD}<div style=\"margin-top:12px;\">${PR_ACTIONS}</div></div>"

              elif [ "$PR_BODY_FORMAT" = "sdk" ]; then
                # Parse SDK bug fix PR body format (## SDK Bug Fix)
                SDK_COMPILATION=$(printf '%s' "$PR_BODY" | grep '^\*\*Compilation:\*\*' | head -1 | sed 's/\*\*Compilation:\*\* *//')
                SDK_CONFIDENCE=$(printf '%s' "$PR_BODY" | grep '^\*\*Confidence:\*\*' | head -1 | sed 's/\*\*Confidence:\*\* *//')
                SDK_FILES=$(printf '%s' "$PR_BODY" | sed -n '/^```$/,/^```$/{/^```$/d;p;}' | head -20)
                # Extract QA summary (text between --- markers)
                SDK_QA=$(printf '%s' "$PR_BODY" | sed -n '/^---$/,/^---$/{/^---$/d;p;}' | head -20)

                SAFE_SDK_COMPILATION=$(html_escape "${SDK_COMPILATION:-unknown}")
                SAFE_SDK_CONFIDENCE=$(html_escape "${SDK_CONFIDENCE:-unknown}")
                SAFE_SDK_FILES=$(html_escape "${SDK_FILES:-See PR for details}")
                SAFE_SDK_QA=$(html_escape "${SDK_QA:-See PR for details}")

                PR_CARD="<div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:16px;background:#ffffff;\"><h3 style=\"margin:0 0 8px 0;font-size:16px;color:#111827;white-space:normal;overflow-wrap:break-word;word-wrap:break-word;\">PR #${PR_NUM} &mdash; ${SAFE_PR_TITLE}</h3>"
                if [ -n "$BUG_LINE" ]; then
                  PR_CARD="${PR_CARD}<p style=\"margin:0 0 8px 0;color:#6b7280;font-size:14px;\">${BUG_LINE}</p>"
                fi
                PR_CARD="${PR_CARD}${BUG_DESC_HTML}"
                PR_CARD="${PR_CARD}<p style=\"margin:0 0 12px 0;font-size:14px;color:#374151;\">Compilation: ${SAFE_SDK_COMPILATION} | Confidence: ${SAFE_SDK_CONFIDENCE}</p>"
                PR_CARD="${PR_CARD}<div style=\"margin-bottom:12px;\"><strong style=\"font-size:13px;color:#374151;\">FILES CHANGED:</strong><pre style=\"background:#f9fafb;padding:8px;border-radius:4px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:4px 0;\">${SAFE_SDK_FILES}</pre></div>"
                if [ -n "$SDK_QA" ]; then
                  PR_CARD="${PR_CARD}<div style=\"margin-bottom:12px;\"><strong style=\"font-size:13px;color:#374151;\">QA REVIEW:</strong><pre style=\"background:#f9fafb;padding:8px;border-radius:4px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:4px 0;\">${SAFE_SDK_QA}</pre></div>"
                fi
                PR_CARD="${PR_CARD}<div style=\"margin-top:12px;\">${PR_ACTIONS}</div></div>"

              else
                # Fallback: no structured body — still show bug description if available
                PR_CARD="<div style=\"border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:16px;background:#ffffff;\"><h3 style=\"margin:0 0 8px 0;font-size:16px;color:#111827;white-space:normal;overflow-wrap:break-word;word-wrap:break-word;\">PR #${PR_NUM} &mdash; ${SAFE_PR_TITLE}</h3>"
                if [ -n "$BUG_LINE" ]; then
                  PR_CARD="${PR_CARD}<p style=\"margin:0 0 8px 0;color:#6b7280;font-size:14px;\">${BUG_LINE}</p>"
                fi
                PR_CARD="${PR_CARD}${BUG_DESC_HTML}"
                PR_CARD="${PR_CARD}<p style=\"margin:0 0 12px 0;font-size:14px;color:#6b7280;\">See PR for full details: <a href=\"${PR_URL}\" style=\"color:#2563eb;\">${PR_URL}</a></p><div style=\"margin-top:12px;\">${PR_ACTIONS}</div></div>"
              fi

              PR_CARDS="${PR_CARDS}${PR_CARD}"
              ACTUAL_PR_COUNT=$((ACTUAL_PR_COUNT + 1))
            done
          fi

          # =============================================
          # Build unified email
          # AC3: ALWAYS send — even if zero bugs and zero PRs (heartbeat)
          # =============================================

          # Build pending notice if any
          PENDING_NOTICE=""
          if [ "$PENDING_COUNT" -gt 0 ]; then
            PENDING_NOTICE="<div style=\"margin-bottom:20px;padding:12px 16px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;font-size:13px;color:#6d4c00;\">${PENDING_COUNT} bug(s) still awaiting AI analysis (${PENDING_NUMS} ) &mdash; they will appear here once analyzed.</div>"
          fi

          # BA-011 Story 3.3: Read the Needs Attention section (built in confidence step)
          ATTENTION_SECTION=""
          if [ -f /tmp/attention_section.html ]; then
            ATTENTION_SECTION=$(cat /tmp/attention_section.html)
          fi

          # Subject line — include stuck issues in the count
          TOTAL_ITEMS=$((ANALYZED_COUNT + ACTUAL_PR_COUNT))
          TOTAL_WITH_STUCK=$((TOTAL_ITEMS + ${STUCK_COUNT:-0}))
          if [ "$TOTAL_WITH_STUCK" -eq 0 ]; then
            SUBJECT="SortingHistory: All clear -- pipeline healthy"
          elif [ "${STUCK_COUNT:-0}" -gt 0 ] && [ "$TOTAL_ITEMS" -eq 0 ]; then
            SUBJECT="SortingHistory: ${STUCK_COUNT} stuck issue(s) -- attention needed"
          elif [ "$ANALYZED_COUNT" -gt 0 ] && [ "$ACTUAL_PR_COUNT" -gt 0 ]; then
            SUBJECT="SortingHistory: ${ANALYZED_COUNT} bug(s) + ${ACTUAL_PR_COUNT} PR(s) -- review needed"
          elif [ "$ANALYZED_COUNT" -gt 0 ]; then
            SUBJECT="SortingHistory: ${ANALYZED_COUNT} bug(s) analyzed -- review needed"
          else
            SUBJECT="SortingHistory: ${ACTUAL_PR_COUNT} PR(s) ready -- review needed"
          fi

          # Full email HTML — branded template matching action-needed emails
          EMAIL_HTML="<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head>"
          EMAIL_HTML="${EMAIL_HTML}<body style=\"margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f0e8;\">"
          EMAIL_HTML="${EMAIL_HTML}<div style=\"max-width:600px;margin:0 auto;padding:0;background:#fffdf8;\">"

          # Branded header — green only when truly all clear
          if [ "$TOTAL_WITH_STUCK" -eq 0 ]; then
            HEADER_BG="#22863a"
            HEADER_BADGE="All Clear"
            HEADER_TITLE="Pipeline Healthy"
          elif [ "${STUCK_COUNT:-0}" -gt 0 ] && [ "$TOTAL_ITEMS" -eq 0 ]; then
            HEADER_BG="#b45309"
            HEADER_BADGE="Attention Needed"
            HEADER_TITLE="${STUCK_COUNT} Stuck Issue(s)"
          else
            HEADER_BG="#8B6914"
            HEADER_BADGE="Action Needed"
            HEADER_TITLE="${ANALYZED_COUNT} Bug(s) + ${ACTUAL_PR_COUNT} PR(s) for Review"
          fi
          EMAIL_HTML="${EMAIL_HTML}<div style=\"background:${HEADER_BG};padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;\">"
          EMAIL_HTML="${EMAIL_HTML}<img src=\"https://sortinghistory.com/images/app-icon.png\" alt=\"Sorting History\" style=\"width:80px;height:80px;border-radius:18px;margin-bottom:12px;\">"
          EMAIL_HTML="${EMAIL_HTML}<div style=\"display:inline-block;padding:4px 14px;background:rgba(0,0,0,0.2);border-radius:20px;margin-bottom:8px;\"><span style=\"color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;\">${HEADER_BADGE}</span></div>"
          EMAIL_HTML="${EMAIL_HTML}<h1 style=\"color:#ffffff;margin:0;font-size:22px;font-weight:700;\">${HEADER_TITLE}</h1>"
          EMAIL_HTML="${EMAIL_HTML}</div>"

          # Main content area
          EMAIL_HTML="${EMAIL_HTML}<div style=\"padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;\">"

          if [ "$TOTAL_WITH_STUCK" -eq 0 ]; then
            EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 20px 0;font-size:15px;color:#444;line-height:1.6;\">No bugs awaiting review and no PRs pending. The pipeline is running smoothly.</p>"
            if [ "$PENDING_COUNT" -gt 0 ]; then
              EMAIL_HTML="${EMAIL_HTML}${PENDING_NOTICE}"
            fi
          else
            EMAIL_HTML="${EMAIL_HTML}${ATTENTION_SECTION}"
            EMAIL_HTML="${EMAIL_HTML}${PENDING_NOTICE}"

            if [ "$ANALYZED_COUNT" -gt 0 ]; then
              EMAIL_HTML="${EMAIL_HTML}<h3 style=\"margin:20px 0 12px 0;font-size:17px;color:#8B6914;border-bottom:2px solid #DAA520;padding-bottom:6px;\">Bugs Awaiting Review</h3>"
              EMAIL_HTML="${EMAIL_HTML}${BUG_CARDS}"
            fi

            if [ "$ACTUAL_PR_COUNT" -gt 0 ]; then
              EMAIL_HTML="${EMAIL_HTML}<h3 style=\"margin:20px 0 12px 0;font-size:17px;color:#8B6914;border-bottom:2px solid #DAA520;padding-bottom:6px;\">PRs Ready for Review</h3>"
              EMAIL_HTML="${EMAIL_HTML}${PR_CARDS}"
            fi
          fi

          # BA-012.2 AC7: Reward code pool warning
          if [ "$POOL_LOW" = "true" ] || [ "$POOL_EMPTY" = "true" ]; then
            if [ "$POOL_EMPTY" = "true" ]; then
              EMAIL_HTML="${EMAIL_HTML}<div style=\"margin:20px 0;padding:12px 16px;background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;font-size:13px;color:#991b1b;\"><strong>Offer code pool EMPTY</strong> &mdash; reward emails are being sent without codes. Upload more codes via <code>upload-codes.ts</code>.</div>"
            else
              EMAIL_HTML="${EMAIL_HTML}<div style=\"margin:20px 0;padding:12px 16px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;font-size:13px;color:#6d4c00;\"><strong>Offer code pool running low</strong> &mdash; ${POOL_REMAINING} of ${POOL_TOTAL} codes remaining. Upload more soon.</div>"
            fi
          fi

          # =============================================
          # Story 3.6 AC1: System Health Section (replaces BA-007.6)
          # Uses computeHealthMetrics() output from health-metrics-cli.ts
          # Provides: pipeline success rates, queue depth, pattern alerts
          # =============================================
          HEALTH_HTML=""
          if [ -f /tmp/health_section.html ]; then
            HEALTH_HTML=$(cat /tmp/health_section.html)
          fi
          if [ -n "$HEALTH_HTML" ]; then
            EMAIL_HTML="${EMAIL_HTML}${HEALTH_HTML}"
          else
            # Fallback: minimal health section when CLI produced no output
            EMAIL_HTML="${EMAIL_HTML}<h3 style=\"margin:24px 0 12px 0;font-size:17px;color:#8B6914;border-bottom:2px solid #DAA520;padding-bottom:6px;\">System Health</h3>"
            EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 12px 0;font-size:14px;color:#555;font-style:italic;\">No pipeline data yet &mdash; health metrics will appear after the first workflow completes.</p>"
          fi

          EMAIL_HTML="${EMAIL_HTML}</div>"

          # Branded footer with social links
          EMAIL_HTML="${EMAIL_HTML}<div style=\"padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;\">"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;\">Sorting History</p>"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 12px 0;font-size:13px;color:#777;text-align:center;\">Sort history's greatest moments into the correct order</p>"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0;font-size:13px;color:#888;text-align:center;\">"
          EMAIL_HTML="${EMAIL_HTML}<a href=\"https://sortinghistory.com\" style=\"color:#8B6914;text-decoration:none;\">Website</a>"
          EMAIL_HTML="${EMAIL_HTML} &nbsp;&middot;&nbsp; <a href=\"https://x.com/SortingHistory\" style=\"color:#8B6914;text-decoration:none;\">X/Twitter</a>"
          EMAIL_HTML="${EMAIL_HTML} &nbsp;&middot;&nbsp; <a href=\"https://instagram.com/sortinghistory\" style=\"color:#8B6914;text-decoration:none;\">Instagram</a>"
          EMAIL_HTML="${EMAIL_HTML} &nbsp;&middot;&nbsp; <a href=\"https://youtube.com/@sortinghistory\" style=\"color:#8B6914;text-decoration:none;\">YouTube</a>"
          EMAIL_HTML="${EMAIL_HTML} &nbsp;&middot;&nbsp; <a href=\"https://bsky.app/profile/sortinghistory.bsky.social\" style=\"color:#8B6914;text-decoration:none;\">Bluesky</a>"
          EMAIL_HTML="${EMAIL_HTML}</p></div>"

          # Bottom bar
          EMAIL_HTML="${EMAIL_HTML}<div style=\"padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;\">"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;\">Sorting History &mdash; Learn history by playing it</p>"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0 0 4px 0;font-size:11px;\"><a href=\"https://sortinghistory.com\" style=\"color:#999;text-decoration:none;\">sortinghistory.com</a></p>"
          EMAIL_HTML="${EMAIL_HTML}<p style=\"margin:0;font-size:10px;color:#aaa;\">SortingHistory Pipeline &bull; <a href=\"https://github.com/RaufGlasgow/Sorting-History/issues\" style=\"color:#aaa;text-decoration:none;\">View all issues</a></p>"
          EMAIL_HTML="${EMAIL_HTML}</div></div></body></html>"

          # Write to files for the send step
          echo "$SUBJECT" > /tmp/email_subject.txt
          echo "$EMAIL_HTML" > /tmp/email_body.html
          echo "Email built: ${ANALYZED_COUNT} bugs, ${ACTUAL_PR_COUNT} PRs, ${PENDING_COUNT} pending."

      - name: Send via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          SUBJECT=$(cat /tmp/email_subject.txt)
          BODY=$(cat /tmp/email_body.html)

          # Build JSON payload using jq to handle escaping properly
          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg html "$BODY" \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || { echo "::error::Resend API call failed"; exit 1; }

          echo "Digest email sent successfully."
