name: Deploy Webhook Worker

on:
  push:
    branches: [main]
    paths: ['workers/bug-webhook/**']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/bug-webhook
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://sortinghistory.com/api/pipeline/health" 2>/dev/null || echo "000")
          if [ "$STATUS" = "000" ]; then
            echo "::warning::Health endpoint unreachable — may not exist yet (Story 5.2)"
          elif [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS"
          else
            echo "Health check passed: 200 OK"
          fi
