name: Automated Bug Fix

on:
  repository_dispatch:
    types: [approve]

permissions:
  contents: write

concurrency:
  group: fix-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: true

env:
  ISSUE_NUM: ${{ github.event.client_payload.issue_number }}

jobs:
  # First job: Create branch and apply fix
  create-fix:
    runs-on: macos-14
    outputs:
      fix_type: ${{ steps.analyze.outputs.fix_type }}
      branch_name: ${{ steps.branch.outputs.name }}
      fix_applied: ${{ steps.fix.outputs.applied }}
      fix_summary: ${{ steps.fix.outputs.summary }}
      fix_test_instructions: ${{ steps.fix.outputs.test_instructions }}
      modified_files: ${{ steps.fix.outputs.modified_files }}
      severity: ${{ steps.fix.outputs.severity }}
      validation_failed: ${{ steps.fix.outputs.validation_failed }}
      validation_errors: ${{ steps.fix.outputs.validation_errors }}
      needs_fact_check: ${{ steps.fix.outputs.needs_fact_check }}
      fact_check_confidence: ${{ steps.fix.outputs.fact_check_confidence }}
      fact_check_concern: ${{ steps.fix.outputs.fact_check_concern }}
      build_failed: ${{ steps.fix.outputs.build_failed }}
      build_error: ${{ steps.fix.outputs.build_error }}

    steps:
      - name: Checkout bug automation scripts
        uses: actions/checkout@v4

      - name: Checkout game code
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.Private_repo_Pat }}
          ref: main
          path: game-code
          fetch-depth: 0

      - name: Check Escalation Guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          LABELS=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels --jq '.[].name')
          if echo "$LABELS" | grep -q "needs-manual-fix"; then
            echo "Issue #${{ env.ISSUE_NUM }} has needs-manual-fix label — pipeline will not run."
            echo "Remove the needs-manual-fix label first if you want to retry."
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Escalation Block Notice
        if: steps.guard.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --body "## Pipeline Blocked

          This issue has the \`needs-manual-fix\` label (max automated attempts exhausted).

          To re-enable automated fixes, remove the \`needs-manual-fix\` label first, then approve again.

          ---
          *Posted by automated bug fix pipeline.*"

      - name: Reset Stale Labels (Re-run Resilience)
        if: steps.guard.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          echo "Removing stale pipeline labels from issue #${{ env.ISSUE_NUM }} (if any)..."
          gh issue edit ${{ env.ISSUE_NUM }} --repo RaufGlasgow/Sorting-History \
            --remove-label "fix-generated,pr-created,build-passed,tests-passed,build-failed,tests-need-review,tests-passing,fix-failed" 2>/dev/null || true
          echo "Stale labels cleaned up"

      - name: Analyze Bug Type
        id: analyze
        if: steps.guard.outputs.blocked != 'true'
        run: |
          # Get issue labels via API
          LABELS=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels --jq '.[].name')
          echo "Issue labels: $LABELS"

          # Determine fix type from labels
          if echo "$LABELS" | grep -q "type/content"; then
            echo "fix_type=content" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "type/code"; then
            echo "fix_type=code" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "type/ux"; then
            echo "fix_type=ux" >> $GITHUB_OUTPUT
          else
            echo "fix_type=other" >> $GITHUB_OUTPUT
          fi

          # Determine severity
          if echo "$LABELS" | grep -q "severity/P1"; then
            echo "severity=P1" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "severity/P2"; then
            echo "severity=P2" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q "severity/P3"; then
            echo "severity=P3" >> $GITHUB_OUTPUT
          else
            echo "severity=P4" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}

      - name: Create Branch
        id: branch
        if: steps.guard.outputs.blocked != 'true'
        working-directory: game-code
        run: |
          BRANCH="fix/bug-${{ env.ISSUE_NUM }}"
          git checkout -b $BRANCH
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Select Xcode 16.2
        if: steps.guard.outputs.blocked != 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        if: steps.guard.outputs.blocked != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Fix
        id: fix
        if: steps.guard.outputs.blocked != 'true'
        working-directory: game-code
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.Private_repo_Pat }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_BUGS }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUM }}
          FIX_TYPE: ${{ steps.analyze.outputs.fix_type }}
          PRIVATE_REPO_NAME: RaufGlasgow/Sorting-History
          RETRY: ${{ github.event.client_payload.retry || '' }}
          ATTEMPT: ${{ github.event.client_payload.attempt || '' }}
          PREVIOUS_FIX_SUMMARY: ${{ github.event.client_payload.previous_fix_summary || '' }}
          REJECTION_REASON: ${{ github.event.client_payload.rejection_reason || '' }}
        run: |
          # Run the fix application script (scripts are in the public repo root)
          node ../Scripts/apply-fix.js

      - name: Post Build Failure to Issue
        if: steps.fix.outputs.build_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          cat > /tmp/comment-body.json << 'JSONEOF'
          {
            "body": "## Build Validation Failed (QG-001)\n\nBoth the initial fix and retry (QG-002) failed compilation. No changes were committed.\n\nManual intervention required."
          }
          JSONEOF
          gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/comments --input /tmp/comment-body.json

      - name: Post Apply Failure to Issue
        if: steps.guard.outputs.blocked != 'true' && steps.fix.outputs.applied != 'true' && steps.fix.outputs.build_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          IS_RETRY="${{ github.event.client_payload.retry || '' }}"
          ATTEMPT="${{ github.event.client_payload.attempt || '1' }}"

          if [ "$IS_RETRY" = "true" ]; then
            RETRY_NOTE="This was retry attempt $ATTEMPT."
          else
            RETRY_NOTE=""
          fi

          {
            echo "## Fix Generation Failed"
            echo ""
            echo "The automated fix system could not generate an applicable fix for this issue."
            echo "The AI either produced no changes or proposed changes that could not be applied"
            echo "(e.g., tried to create new files instead of modifying existing ones)."
            if [ -n "$RETRY_NOTE" ]; then
              echo ""
              echo "$RETRY_NOTE"
            fi
            echo ""
            echo "**Fix type:** ${{ steps.analyze.outputs.fix_type }}"
            echo ""
            echo "This issue needs manual developer attention."
            echo ""
            echo "---"
            echo "*Posted by automated bug fix pipeline.*"
          } > /tmp/apply-failure.md

          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" -F /tmp/apply-failure.md

          # Remove approved label and add fix-failed so issue isn't stuck
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "approved" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --add-label "fix-failed"

      - name: Commit Changes
        if: steps.fix.outputs.applied == 'true'
        working-directory: game-code
        run: |
          git config user.name "Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"
          git add -A

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 1
          fi

          git commit -m "fix(#${{ env.ISSUE_NUM }}): ${{ steps.fix.outputs.summary }}

          Closes #${{ env.ISSUE_NUM }}

          Applied by automated bug fix system
          Fix type: ${{ steps.analyze.outputs.fix_type }}
          Severity: ${{ steps.analyze.outputs.severity }}"

      - name: Push Branch
        if: steps.fix.outputs.applied == 'true'
        working-directory: game-code
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          # Check if branch already exists on remote (re-run case)
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists on remote — force-pushing new fix"
            git push origin "$BRANCH" --force
          else
            echo "Branch $BRANCH is new — pushing"
            git push origin "$BRANCH"
          fi

  # Second job: Test the fix (build + test on macOS)
  # Runs on macOS-14 (free on public repo) - tests flag PRs, don't block them
  test-fix:
    needs: [create-fix]
    if: needs.create-fix.outputs.fix_applied == 'true'
    runs-on: macos-14
    outputs:
      build_outcome: ${{ steps.build.outcome }}
      test_outcome: ${{ steps.test.outcome }}
      visual_review: ${{ steps.visual-review.outputs.review_result }}
      visual_summary: ${{ steps.visual-review.outputs.review_summary }}
      screenshot_light_url: ${{ steps.release.outputs.screenshot_light_url }}
      screenshot_dark_url: ${{ steps.release.outputs.screenshot_dark_url }}
      build_url: ${{ steps.release.outputs.build_url }}

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.Private_repo_Pat }}
          ref: ${{ needs.create-fix.outputs.branch_name }}

      - name: Checkout automation scripts
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Project
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SortingHistory \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Run Tests
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SortingHistory \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Capture App Screenshot
        id: screenshot
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          # Find the built .app
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Get bundle ID from built app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          # Find a booted iPhone simulator (tests should have booted one)
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d.get('state') == 'Booted' and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          " 2>/dev/null)

          if [ -z "$DEVICE_ID" ]; then
            # No booted device — try to boot iPhone 16
            DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if '18' in runtime:
                  for d in devices:
                      if 'iPhone 16' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          " 2>/dev/null)
            if [ -n "$DEVICE_ID" ]; then
              xcrun simctl boot "$DEVICE_ID"
              sleep 5
            fi
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "No simulator available for screenshot"
            exit 1
          fi
          echo "Using device: $DEVICE_ID"

          # Install app (do NOT launch yet — we need to determine deep link first)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          # Ensure app is not already running (xcodebuild test may have left it open)
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" 2>/dev/null || true

          # Determine deep link from modified files BEFORE any launch
          MODIFIED_FILES="${{ needs.create-fix.outputs.modified_files }}"
          DEEP_LINK=""

          # Filter to view files only, then exclude SettingsView if other views present
          # SettingsView is changed in EVERY bug fix PR (version bump) so it would
          # always match first, hiding the actual fix screen (BA-007.28)
          VIEW_FILES=$(echo "$MODIFIED_FILES" | grep -i "View" || true)
          if [ "$(echo "$VIEW_FILES" | grep -c .)" -gt 1 ]; then
            TARGET_FILES=$(echo "$VIEW_FILES" | grep -vi "SettingsView")
          else
            TARGET_FILES="$MODIFIED_FILES"
          fi

          if echo "$TARGET_FILES" | grep -qi "SettingsView"; then
            DEEP_LINK="sortinghistory://settings"
          elif echo "$TARGET_FILES" | grep -qi "SetupView\|SetupHelp\|GameSetup"; then
            DEEP_LINK="sortinghistory://setup"
          elif echo "$TARGET_FILES" | grep -qi "StatisticsView"; then
            DEEP_LINK="sortinghistory://stats"
          elif echo "$TARGET_FILES" | grep -qi "TimelineHistory\|HistoryView"; then
            DEEP_LINK="sortinghistory://history"
          fi

          if [ -n "$DEEP_LINK" ]; then
            # Cold-launch via deep link — app opens directly to target screen
            # openurl on a not-yet-running app triggers both launch AND onOpenURL
            echo "Launching app via deep link: $DEEP_LINK"
            xcrun simctl openurl "$DEVICE_ID" "$DEEP_LINK"
          else
            # No deep-link route — launch normally (home screen)
            echo "No deep-link route for: $MODIFIED_FILES. Launching to home screen."
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          fi

          # Wait for app to fully load and render target screen
          sleep 12

          # Light mode screenshot
          xcrun simctl io "$DEVICE_ID" screenshot screenshot-light.png
          echo "Light mode screenshot captured"

          # Switch to dark mode
          xcrun simctl ui "$DEVICE_ID" appearance dark
          sleep 3

          # Dark mode screenshot
          xcrun simctl io "$DEVICE_ID" screenshot screenshot-dark.png
          echo "Dark mode screenshot captured"

          # Reset to light mode (clean up)
          xcrun simctl ui "$DEVICE_ID" appearance light

          echo "screenshot_taken=true" >> $GITHUB_OUTPUT

      - name: AI Visual Review
        id: visual-review
        if: steps.screenshot.outputs.screenshot_taken == 'true'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_BUGS }}
          PRIVATE_REPO_TOKEN: ${{ secrets.Private_repo_Pat }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUM }}
          PRIVATE_REPO_NAME: RaufGlasgow/Sorting-History
          FIX_SUMMARY: ${{ needs.create-fix.outputs.fix_summary }}
          FIX_TYPE: ${{ needs.create-fix.outputs.fix_type }}
        run: node automation/Scripts/visual-review.js screenshot-light.png screenshot-dark.png

      - name: Upload Build Log
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload Test Log
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 14

      - name: Upload Screenshots
        if: steps.screenshot.outputs.screenshot_taken == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            screenshot-light.png
            screenshot-dark.png
          retention-days: 14

      - name: Upload App Bundle
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: "DerivedData/Build/Products/Debug-iphonesimulator/Sorting History.app"
          retention-days: 14

      - name: Create Release with Build and Screenshots
        id: release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fix-${{ env.ISSUE_NUM }}"

          # Package .app as proper zip
          cd DerivedData/Build/Products/Debug-iphonesimulator
          zip -r /tmp/SortingHistory-fix-${{ env.ISSUE_NUM }}.zip "Sorting History.app"
          cd "$GITHUB_WORKSPACE"

          # Clean up any existing release AND git tag (for re-runs)
          gh release delete "$TAG" --repo RaufGlasgow/sortinghistory-bugs --yes --cleanup-tag 2>/dev/null || true

          # Collect assets to upload
          ASSETS=""
          if [ -f screenshot-light.png ]; then
            ASSETS="$ASSETS screenshot-light.png"
          fi
          if [ -f screenshot-dark.png ]; then
            ASSETS="$ASSETS screenshot-dark.png"
          fi
          ASSETS="$ASSETS /tmp/SortingHistory-fix-${{ env.ISSUE_NUM }}.zip"

          # Create release with assets on the PUBLIC repo
          gh release create "$TAG" \
            --repo RaufGlasgow/sortinghistory-bugs \
            --title "Build: Fix #${{ env.ISSUE_NUM }}" \
            --notes "Automated build artifacts for bug fix #${{ env.ISSUE_NUM }}" \
            $ASSETS

          # Output direct download URLs
          BASE_URL="https://github.com/RaufGlasgow/sortinghistory-bugs/releases/download/$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ -f screenshot-light.png ]; then
            echo "screenshot_light_url=$BASE_URL/screenshot-light.png" >> $GITHUB_OUTPUT
          fi
          if [ -f screenshot-dark.png ]; then
            echo "screenshot_dark_url=$BASE_URL/screenshot-dark.png" >> $GITHUB_OUTPUT
          fi
          echo "build_url=$BASE_URL/SortingHistory-fix-${{ env.ISSUE_NUM }}.zip" >> $GITHUB_OUTPUT

  # Third job: Create PR and label with test results
  # Runs after both create-fix and test-fix complete
  # Uses always() so PR is created even if tests fail
  create-pr:
    needs: [create-fix, test-fix]
    if: always() && needs.create-fix.outputs.fix_applied == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Close Existing PR (Re-run Resilience)
        id: close-old-pr
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          BRANCH="fix/bug-${{ env.ISSUE_NUM }}"
          echo "Checking for existing PR on branch $BRANCH..."
          EXISTING_PR=$(gh pr list --head "$BRANCH" --repo RaufGlasgow/Sorting-History --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "Found existing PR #$EXISTING_PR — closing it"
            gh pr close "$EXISTING_PR" --repo RaufGlasgow/Sorting-History 2>/dev/null || true
            echo "old_pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "Closed existing PR #$EXISTING_PR"
          else
            echo "No existing PR found for $BRANCH"
            echo "old_pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          # Fetch issue title via API
          ISSUE_TITLE=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }} --jq '.title')

          # Check if this is a re-run (old PR was closed)
          OLD_PR="${{ steps.close-old-pr.outputs.old_pr_number }}"
          REPLACES_NOTE=""
          if [ -n "$OLD_PR" ]; then
            REPLACES_NOTE="
          > **Re-run:** Replaces PR #$OLD_PR (auto-closed by pipeline re-run)"
          fi

          # Create PR in the private repo
          # Build PR body with test instructions if available
          TEST_INSTRUCTIONS="${{ needs.create-fix.outputs.fix_test_instructions }}"
          BUILD_URL="${{ needs.test-fix.outputs.build_url }}"

          PR_BODY="## Automated Bug Fix
          ${REPLACES_NOTE}
          Fixes #${{ env.ISSUE_NUM }}

          **Type:** ${{ needs.create-fix.outputs.fix_type }}

          ### Changes Made
          ${{ needs.create-fix.outputs.fix_summary }}"

          if [ -n "$BUILD_URL" ]; then
            PR_BODY="$PR_BODY

          ### Download Build
          **[Download Build (.app.zip)]($BUILD_URL)** — install on simulator:
          \`\`\`bash
          unzip SortingHistory-fix-${{ env.ISSUE_NUM }}.zip
          xcrun simctl install booted \"Sorting History.app\"
          xcrun simctl launch booted com.raul.sortinghistory.877348
          \`\`\`"
          fi

          if [ -n "$TEST_INSTRUCTIONS" ]; then
            PR_BODY="$PR_BODY

          ### How to Test
          $TEST_INSTRUCTIONS"
          fi

          PR_BODY="$PR_BODY

          ---
          *This PR was automatically created by the bug fix system.*
          *All fixes require manual review and merge.*"

          gh pr create \
            --repo RaufGlasgow/Sorting-History \
            --head "fix/bug-${{ env.ISSUE_NUM }}" \
            --base main \
            --title "fix: #${{ env.ISSUE_NUM }} - $ISSUE_TITLE" \
            --body "$PR_BODY"

          # Get PR number and URL
          PR_NUMBER=$(gh pr list --repo RaufGlasgow/Sorting-History --head "fix/bug-${{ env.ISSUE_NUM }}" --json number -q '.[0].number')
          PR_URL=$(gh pr view --repo RaufGlasgow/Sorting-History "fix/bug-${{ env.ISSUE_NUM }}" --json url -q .url)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Copy Issue Labels to PR
        if: always() && steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "Could not find PR number, skipping label copy"
            exit 0
          fi

          # Get severity and type labels from the issue
          LABELS=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels --jq '[.[] | select(.name | startswith("severity/") or startswith("type/")) | .name] | join(",")')

          if [ -n "$LABELS" ]; then
            echo "Copying labels to PR #$PR_NUMBER: $LABELS"
            gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "$LABELS"
          else
            echo "No severity/type labels found on issue"
          fi

      - name: Add Code Fix Label
        if: always() && steps.create-pr.outputs.pr_number != '' && needs.create-fix.outputs.fix_type == 'code'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "Code fix PR #$PR_NUMBER - adding code-fix label"
          gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "code-fix"

      - name: Add UX Fix Label
        if: always() && steps.create-pr.outputs.pr_number != '' && needs.create-fix.outputs.fix_type == 'ux'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "UX fix PR #$PR_NUMBER - adding ux-fix label"
          gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "ux-fix"

      - name: Handle Validation Failure
        if: always() && steps.create-pr.outputs.pr_number != '' && needs.create-fix.outputs.validation_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "Content fix failed JSON validation - adding needs-manual-review label"
          gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "needs-manual-review"

          # Post validation failure comment
          gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "## JSON Validation Failed

          The content fix was applied but the modified JSON file failed structural validation.

          **Validation errors:**
          ${{ needs.create-fix.outputs.validation_errors }}

          This PR requires manual review to ensure the JSON content is correct before merging.

          ---
          *This PR requires manual review before merging.*"

      - name: Flag Fact-Check Concern
        if: always() && steps.create-pr.outputs.pr_number != '' && needs.create-fix.outputs.needs_fact_check == 'true'
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "Content fact-check flagged concern - adding needs-fact-check label"
          gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "needs-fact-check"

          gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "## Fact-Check Warning

          The content fix could not be confidently verified.

          **Confidence:** ${{ needs.create-fix.outputs.fact_check_confidence }}
          **Concern:** ${{ needs.create-fix.outputs.fact_check_concern }}

          Please manually verify the historical accuracy before merging.

          ---
          *This is an advisory flag only. The fix has still been applied and the PR is ready for review.*"

      - name: Label Test Results
        if: always() && steps.create-pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          BUILD_OUTCOME="${{ needs.test-fix.outputs.build_outcome }}"
          TEST_OUTCOME="${{ needs.test-fix.outputs.test_outcome }}"

          echo "Build outcome: $BUILD_OUTCOME"
          echo "Test outcome: $TEST_OUTCOME"

          if [ "$TEST_OUTCOME" == "success" ]; then
            echo "Tests passed - adding tests-passing label"
            gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "tests-passing" || echo "Warning: could not add tests-passing label"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            echo "Build failed - adding build-failed label"
            gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "build-failed" || echo "Warning: could not add build-failed label"
          else
            echo "Tests failed but build passed - adding tests-need-review label"
            gh pr edit --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --add-label "tests-need-review" || echo "Warning: could not add label"
          fi

      - name: Post Test Results Comment
        if: always() && steps.create-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          BUILD_OUTCOME="${{ needs.test-fix.outputs.build_outcome }}"
          TEST_OUTCOME="${{ needs.test-fix.outputs.test_outcome }}"

          if [ "$TEST_OUTCOME" == "success" ]; then
            BODY=$(cat <<'COMMENT_EOF'
          ## :white_check_mark: Tests: Passing

          All tests passed.
          COMMENT_EOF
          )
            gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "$BODY"

          elif [ "$BUILD_OUTCOME" != "success" ]; then
            BODY=$(cat <<'COMMENT_EOF'
          ## :x: Tests: Skipped (Build Failed)

          The project failed to compile, so tests could not run.
          Check the build log in the [sortinghistory-bugs workflow artifacts](https://github.com/RaufGlasgow/sortinghistory-bugs/actions) for details.
          COMMENT_EOF
          )
            gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "$BODY"

          else
            BODY=$(cat <<'COMMENT_EOF'
          ## :warning: Tests: Need Review

          Some tests failed. This may indicate a real regression or flaky tests.
          Review the output below and decide whether to merge.

          <details><summary>View test failure details</summary>

          Check the test log artifact in the [sortinghistory-bugs workflow run](https://github.com/RaufGlasgow/sortinghistory-bugs/actions) for full output.

          </details>

          *Full logs available as workflow artifacts in the [sortinghistory-bugs](https://github.com/RaufGlasgow/sortinghistory-bugs) repo.*
          COMMENT_EOF
          )
            gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "$BODY"
          fi

      - name: Post Visual Review Comment
        if: always() && steps.create-pr.outputs.pr_number != '' && needs.create-fix.outputs.fix_type == 'ux'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          VISUAL_REVIEW="${{ needs.test-fix.outputs.visual_review }}"
          VISUAL_SUMMARY="${{ needs.test-fix.outputs.visual_summary }}"
          LIGHT_URL="${{ needs.test-fix.outputs.screenshot_light_url }}"
          DARK_URL="${{ needs.test-fix.outputs.screenshot_dark_url }}"
          BUILD_URL="${{ needs.test-fix.outputs.build_url }}"

          if [ "$VISUAL_REVIEW" == "approve" ]; then
            ICON=":white_check_mark:"
          elif [ "$VISUAL_REVIEW" == "visual_concerns" ]; then
            ICON=":x:"
          else
            ICON=":eyes:"
          fi

          # Build screenshot section
          SCREENSHOT_SECTION=""
          if [ -n "$LIGHT_URL" ] && [ -n "$DARK_URL" ]; then
            SCREENSHOT_SECTION="### Screenshots

          | Light Mode | Dark Mode |
          |:---:|:---:|
          | <img src=\"${LIGHT_URL}\" width=\"300\"> | <img src=\"${DARK_URL}\" width=\"300\"> |"
          elif [ -n "$LIGHT_URL" ]; then
            SCREENSHOT_SECTION="### Screenshot
          <img src=\"${LIGHT_URL}\" width=\"400\">"
          fi

          # Build download section
          DOWNLOAD_SECTION=""
          if [ -n "$BUILD_URL" ]; then
            DOWNLOAD_SECTION="### Download Build
          **[Download Build (.app.zip)]($BUILD_URL)**

          Install on simulator:
          \`\`\`bash
          unzip SortingHistory-fix-${{ env.ISSUE_NUM }}.zip
          xcrun simctl install booted \"Sorting History.app\"
          xcrun simctl launch booted com.raul.sortinghistory.877348
          \`\`\`"
          fi

          BODY=$(cat <<COMMENT_EOF
          ## ${ICON} Visual Review: ${VISUAL_REVIEW:-not run}

          ${VISUAL_SUMMARY:-AI visual review was not available for this run.}

          ${SCREENSHOT_SECTION}

          ${DOWNLOAD_SECTION}

          ---
          *UI fixes require visual verification before merging.*
          COMMENT_EOF
          )
          gh pr comment --repo RaufGlasgow/Sorting-History "$PR_NUMBER" --body "$BODY"

      - name: Update Issue with PR Link
        if: always() && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          gh issue comment --repo RaufGlasgow/Sorting-History ${{ env.ISSUE_NUM }} \
            --body "## Fix PR Created

          A pull request has been created to fix this issue.

          **PR:** ${{ steps.create-pr.outputs.pr_url }}

          Please review and merge when ready."

      - name: Update Issue Labels
        if: always()
        env:
          GH_TOKEN: ${{ secrets.Private_repo_Pat }}
        run: |
          # Remove approved label
          gh issue edit --repo RaufGlasgow/Sorting-History ${{ env.ISSUE_NUM }} --remove-label approved || true

          # Add pr-created label
          gh issue edit --repo RaufGlasgow/Sorting-History ${{ env.ISSUE_NUM }} --add-label pr-created
