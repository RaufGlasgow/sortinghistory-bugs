# BA-010.7: Rebase-and-merge workflow
# Triggered by /merge comment via Cloudflare Worker → repository_dispatch
#
# Flow:
#   1. Checkout private repo with full history
#   2. Rebase fix branch against main
#   3. If clean: force-push + squash merge
#   4. If conflict: abort, email owner with conflicting files, label PR

name: Rebase and Merge

on:
  repository_dispatch:
    types: [merge-fix]

jobs:
  rebase-and-merge:
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO: RaufGlasgow/Sorting-History
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

    steps:
      - name: Extract payload
        id: payload
        run: |
          ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}"
          PR_NUMBER="${{ github.event.client_payload.pr_number }}"
          HEAD_BRANCH="${{ github.event.client_payload.head_branch }}"

          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_branch=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"

          echo "Processing /merge for PR #${PR_NUMBER} (issue #${ISSUE_NUMBER}), branch: ${HEAD_BRANCH}"

      - name: Check PR state
        id: check
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"

          # Fetch PR details
          PR_JSON=$(gh api "repos/${PRIVATE_REPO}/pulls/${PR_NUMBER}" 2>/dev/null || echo '{"state":"error"}')
          PR_STATE=$(echo "$PR_JSON" | jq -r '.state // "error"')
          PR_MERGED=$(echo "$PR_JSON" | jq -r '.merged // false')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // "Unknown"')

          echo "pr_state=${PR_STATE}" >> "$GITHUB_OUTPUT"
          echo "pr_merged=${PR_MERGED}" >> "$GITHUB_OUTPUT"
          echo "pr_title=${PR_TITLE}" >> "$GITHUB_OUTPUT"

          if [ "$PR_MERGED" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=already merged" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is already merged. Skipping."
          elif [ "$PR_STATE" = "closed" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=PR is closed" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is closed. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # BA-008.1 AC3e: Branded skip notification
      - name: Notify skip (already merged or closed)
        if: steps.check.outputs.skip == 'true'
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          SKIP_REASON="${{ steps.check.outputs.skip_reason }}"
          PR_URL="https://github.com/${PRIVATE_REPO}/pull/${PR_NUMBER}"

          cat > /tmp/skip-email.html << 'EMAILEOF'
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#6b7280;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#4b5563;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Skipped</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">Merge Skipped</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#f3f4f6;border-left:4px solid #6b7280;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">No Action Taken</p>
          EMAILEOF

          # Inject dynamic content safely via sed
          echo "      <p style=\"margin:0;font-size:14px;color:#333333;line-height:1.5;\">PR #${PR_NUMBER} ${SKIP_REASON}. The /merge command was ignored.</p>" >> /tmp/skip-email.html

          cat >> /tmp/skip-email.html << EMAILEOF
              </div>
              <div style="text-align:center;">
                <a href="${PR_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View PR</a>
              </div>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Merge notification</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Merge skipped: PR #${PR_NUMBER} — ${SKIP_REASON}" \
            --rawfile html /tmp/skip-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: skip notification email failed"

      - name: Checkout private repo
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          fetch-depth: 0
          ref: ${{ steps.payload.outputs.head_branch }}

      - name: Check branch exists
        if: steps.check.outputs.skip != 'true'
        id: branch_check
        run: |
          HEAD_BRANCH="${{ steps.payload.outputs.head_branch }}"

          if ! git rev-parse --verify "origin/${HEAD_BRANCH}" >/dev/null 2>&1; then
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch ${HEAD_BRANCH} not found on remote."
          else
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          fi

      # BA-008.1 AC3e: Branded branch-not-found email
      - name: Notify branch not found
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'false'
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          HEAD_BRANCH="${{ steps.payload.outputs.head_branch }}"
          PR_URL="https://github.com/${PRIVATE_REPO}/pull/${PR_NUMBER}"

          cat > /tmp/branch-not-found-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#b91c1c;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#7f1d1d;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Error</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">Branch Not Found</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #b91c1c;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#b91c1c;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">What Happened</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">Branch <code style="background:#fef2f2;padding:1px 4px;border-radius:3px;">${HEAD_BRANCH}</code> for PR #${PR_NUMBER} no longer exists on the remote. The branch may have been deleted after the fix was generated.</p>
              </div>
              <div style="padding:14px 16px;background:#f0f7ff;border:2px solid #93c5fd;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#1e40af;font-size:14px;">The PR will need to be re-generated. Re-trigger the fix pipeline from the original issue.</p>
              </div>
              <div style="text-align:center;">
                <a href="${PR_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View PR</a>
              </div>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Merge notification</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Merge failed: PR #${PR_NUMBER} — branch not found" \
            --rawfile html /tmp/branch-not-found-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: branch-not-found email failed"

      - name: Rebase against main
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'true'
        id: rebase
        run: |
          HEAD_BRANCH="${{ steps.payload.outputs.head_branch }}"

          # Configure git for rebase
          git config user.email "pipeline@sortinghistory.com"
          git config user.name "SortingHistory Pipeline"

          # Fetch latest main
          git fetch origin main

          # Check if rebase is needed
          BEHIND_COUNT=$(git rev-list --count "HEAD..origin/main")
          echo "Branch is ${BEHIND_COUNT} commits behind main"

          if [ "$BEHIND_COUNT" -eq 0 ]; then
            echo "rebase_needed=false" >> "$GITHUB_OUTPUT"
            echo "rebase_result=clean" >> "$GITHUB_OUTPUT"
            echo "Already up to date with main — skipping rebase, proceeding to merge."
            exit 0
          fi

          echo "rebase_needed=true" >> "$GITHUB_OUTPUT"

          # Attempt rebase
          if git rebase origin/main; then
            echo "rebase_result=clean" >> "$GITHUB_OUTPUT"
            echo "Rebase successful."
          else
            echo "rebase_result=conflict" >> "$GITHUB_OUTPUT"

            # Extract conflicting files
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICT_FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"

            # Abort the rebase
            git rebase --abort
            echo "Rebase conflict detected. Conflicting files: ${CONFLICT_FILES}"
          fi

      - name: Force-push rebased branch
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'true' && steps.rebase.outputs.rebase_result == 'clean' && steps.rebase.outputs.rebase_needed == 'true'
        run: |
          HEAD_BRANCH="${{ steps.payload.outputs.head_branch }}"
          git push --force-with-lease origin "${HEAD_BRANCH}"
          echo "Force-pushed rebased branch ${HEAD_BRANCH}"

      - name: Wait for GitHub to sync force-push
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'true' && steps.rebase.outputs.rebase_result == 'clean' && steps.rebase.outputs.rebase_needed == 'true'
        run: |
          echo "Waiting 10s for GitHub to update PR head ref after force-push..."
          sleep 10

      - name: Squash merge PR
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'true' && steps.rebase.outputs.rebase_result == 'clean'
        id: merge
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          ISSUE_NUMBER="${{ steps.payload.outputs.issue_number }}"

          # Merge via GitHub API (retry up to 3 times for force-push propagation delay)
          MERGE_OK=false
          for attempt in 1 2 3; do
            if gh pr merge "${PR_NUMBER}" --squash --repo "${PRIVATE_REPO}"; then
              MERGE_OK=true
              break
            fi
            echo "Merge attempt ${attempt} failed, waiting 10s..."
            sleep 10
          done

          if [ "$MERGE_OK" = true ]; then
            echo "merge_result=success" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} merged successfully."

            # Add merged-by-pipeline label to the issue
            if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "" ] && [ "$ISSUE_NUMBER" != "null" ]; then
              gh api "repos/${PRIVATE_REPO}/issues/${ISSUE_NUMBER}/labels" \
                -X POST \
                --field 'labels[]=merged-by-pipeline' 2>/dev/null || echo "Warning: failed to add merged-by-pipeline label"
            fi
          else
            echo "merge_result=failed" >> "$GITHUB_OUTPUT"
            echo "PR merge failed."
          fi

      # BA-008.1 AC3e: Branded merge success email
      - name: Send success email
        if: steps.merge.outputs.merge_result == 'success'
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          ISSUE_NUMBER="${{ steps.payload.outputs.issue_number }}"
          PR_TITLE="${{ steps.check.outputs.pr_title }}"
          PR_URL="https://github.com/${PRIVATE_REPO}/pull/${PR_NUMBER}"

          # Build issue link if available
          ISSUE_ROW=""
          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            ISSUE_URL="https://github.com/${PRIVATE_REPO}/issues/${ISSUE_NUMBER}"
            ISSUE_ROW="<tr><td style=\"padding:8px 12px;font-weight:600;color:#166534;font-size:13px;\">Issue</td><td style=\"padding:8px 12px;font-size:14px;color:#333333;\"><a href=\"${ISSUE_URL}\" style=\"color:#2563eb;\">#${ISSUE_NUMBER}</a></td></tr>"
          fi

          cat > /tmp/success-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#166534;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#15803d;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Merged</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">PR #${PR_NUMBER} Merged</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#f0fdf4;border-left:4px solid #22c55e;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#166534;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">PR #${PR_NUMBER}</p>
                <p style="margin:0;font-size:15px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${PR_TITLE}</p>
              </div>
              <table style="width:100%;border-collapse:collapse;margin:0 0 20px 0;">
                <tr><td style="padding:8px 12px;font-weight:600;width:120px;background:#f0fdf4;color:#166534;font-size:13px;">Status</td><td style="padding:8px 12px;background:#f0fdf4;font-size:14px;color:#333333;">Rebased and merged into main</td></tr>
                ${ISSUE_ROW}
              </table>
              <div style="padding:14px 16px;background:#f0fdf4;border:2px solid #86efac;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#166534;font-size:14px;">The fix is now on main. If a version bump was included, the next build will contain this fix.</p>
              </div>
              <div style="text-align:center;">
                <a href="${PR_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View Merged PR</a>
              </div>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0 0 12px 0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
              <p style="margin:0;font-size:13px;color:#888888;text-align:center;">
                <a href="https://sortinghistory.com" style="color:#8B6914;text-decoration:none;">Website</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://x.com/SortingHistory" style="color:#8B6914;text-decoration:none;">X/Twitter</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://instagram.com/sortinghistory" style="color:#8B6914;text-decoration:none;">Instagram</a>
              </p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Merge notification</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Merged: PR #${PR_NUMBER} — ${PR_TITLE}" \
            --rawfile html /tmp/success-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: success email failed"

      # BA-008.1 AC3c: Branded merge conflict email
      - name: Handle conflict
        if: steps.check.outputs.skip != 'true' && steps.branch_check.outputs.branch_exists == 'true' && steps.rebase.outputs.rebase_result == 'conflict'
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          ISSUE_NUMBER="${{ steps.payload.outputs.issue_number }}"
          CONFLICT_FILES="${{ steps.rebase.outputs.conflict_files }}"
          PR_TITLE="${{ steps.check.outputs.pr_title }}"
          PR_URL="https://github.com/${PRIVATE_REPO}/pull/${PR_NUMBER}"

          # Add rebase-conflict label to the PR
          gh api "repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/labels" \
            -X POST \
            --field 'labels[]=rebase-conflict' 2>/dev/null || echo "Warning: failed to add rebase-conflict label"

          # Build conflict file list HTML
          FILE_LIST_HTML=""
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FILE_LIST_HTML="${FILE_LIST_HTML}<li style=\"margin:4px 0;\"><code style=\"background:#fef2f2;padding:1px 4px;border-radius:3px;\">${file}</code></li>"
            fi
          done <<< "$CONFLICT_FILES"

          cat > /tmp/conflict-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#d97706;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#92400e;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Conflict</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">Merge Conflict on PR #${PR_NUMBER}</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#faf8f4;border-left:4px solid #DAA520;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">PR #${PR_NUMBER}</p>
                <p style="margin:0;font-size:15px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${PR_TITLE}</p>
              </div>
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fffbeb;border-left:4px solid #d97706;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#d97706;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">What Happened</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">The PR could not be automatically rebased against main. Files on the fix branch conflict with recent changes on main.</p>
              </div>
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #dc2626;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#dc2626;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Conflicting Files</p>
                <ul style="margin:4px 0 0 0;padding-left:20px;font-size:14px;color:#333333;line-height:1.8;">${FILE_LIST_HTML}</ul>
              </div>
              <div style="padding:14px 16px;background:#f0f7ff;border:2px solid #93c5fd;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#1e40af;font-size:14px;">The fix may still be valid. Resolve the conflict manually on GitHub, or reject the PR and re-trigger the pipeline.</p>
              </div>
              <div style="text-align:center;">
                <a href="${PR_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View PR</a>
              </div>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0 0 12px 0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
              <p style="margin:0;font-size:13px;color:#888888;text-align:center;">
                <a href="https://sortinghistory.com" style="color:#8B6914;text-decoration:none;">Website</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://x.com/SortingHistory" style="color:#8B6914;text-decoration:none;">X/Twitter</a>
                &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                <a href="https://instagram.com/sortinghistory" style="color:#8B6914;text-decoration:none;">Instagram</a>
              </p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Merge notification</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Merge Conflict: PR #${PR_NUMBER} needs manual resolution" \
            --rawfile html /tmp/conflict-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: conflict email failed"

      # BA-008.1 AC3d: Branded merge API failure email
      - name: Handle merge failure
        if: steps.merge.outputs.merge_result == 'failed'
        run: |
          PR_NUMBER="${{ steps.payload.outputs.pr_number }}"
          PR_TITLE="${{ steps.check.outputs.pr_title }}"
          PR_URL="https://github.com/${PRIVATE_REPO}/pull/${PR_NUMBER}"

          cat > /tmp/merge-failure-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#b91c1c;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#7f1d1d;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Merge Failed</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">GitHub API Merge Error</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#faf8f4;border-left:4px solid #DAA520;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">PR #${PR_NUMBER}</p>
                <p style="margin:0;font-size:15px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${PR_TITLE}</p>
              </div>
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #b91c1c;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#b91c1c;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">What Happened</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">The PR was rebased successfully, but the GitHub merge API call failed. This is usually caused by branch protection rules, required status checks, or a permissions issue.</p>
              </div>
              <div style="padding:14px 16px;background:#f0f7ff;border:2px solid #93c5fd;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#1e40af;font-size:14px;">Try merging manually on GitHub, or check repository settings for branch protection rules that may be blocking the merge.</p>
              </div>
              <div style="text-align:center;">
                <a href="${PR_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View PR</a>
              </div>
            </div>
            <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
              <p style="margin:0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Merge notification</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Merge failed: PR #${PR_NUMBER} — GitHub API error" \
            --rawfile html /tmp/merge-failure-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Warning: merge failure email failed"
