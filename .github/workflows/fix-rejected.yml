name: Fix Rejected

on:
  repository_dispatch:
    types: [reject-fix]

permissions:
  contents: write

concurrency:
  group: reject-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  PR_NUM: ${{ github.event.client_payload.pr_number }}
  REJECTION_REASON: ${{ github.event.client_payload.rejection_reason }}
  PRIVATE_REPO: RaufGlasgow/Sorting-History

jobs:
  reject-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Extract Issue Number from PR Body
        id: extract
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          echo "Fetching PR #$PR_NUM from $PRIVATE_REPO..."

          # Get PR body
          PR_BODY=$(gh pr view "$PR_NUM" --repo "$PRIVATE_REPO" --json body -q .body)

          # Extract issue number from "Fixes #XX" pattern (portable — no grep -P)
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oE 'Fixes (RaufGlasgow/Sorting-History)?#[0-9]+' | head -1 | grep -o '[0-9]*')

          if [ -z "$ISSUE_NUM" ]; then
            echo "WARNING: Could not extract issue number from PR body"
            echo "issue_found=false" >> $GITHUB_OUTPUT
            echo "issue_num=" >> $GITHUB_OUTPUT
          else
            echo "Found linked issue: #$ISSUE_NUM"
            echo "issue_found=true" >> $GITHUB_OUTPUT
            echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          fi

          # Extract fix summary from "### Changes Made" section
          FIX_SUMMARY=$(echo "$PR_BODY" | sed -n '/### Changes Made/,/^###\|^---/p' | sed '1d;$d' | head -20)
          if [ -z "$FIX_SUMMARY" ]; then
            FIX_SUMMARY="(Could not extract fix summary from PR body)"
          fi
          # Write multiline output
          echo "fix_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$FIX_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # BA-008.9: Extract inner_loop_failures from PR body (hidden comment)
          INNER_FAILURES=$(echo "$PR_BODY" | grep -o 'INNER_LOOP_FAILURES: .*' | sed 's/INNER_LOOP_FAILURES: //' | sed 's/ -->//' | head -1)
          if [ -n "$INNER_FAILURES" ]; then
            echo "Found inner loop failures from previous run"
            echo "inner_loop_failures<<ILFEOF" >> $GITHUB_OUTPUT
            echo "$INNER_FAILURES" >> $GITHUB_OUTPUT
            echo "ILFEOF" >> $GITHUB_OUTPUT
          else
            echo "No inner loop failures found in PR body"
            echo "inner_loop_failures=" >> $GITHUB_OUTPUT
          fi

      - name: Close PR with Rejection Comment
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          echo "Closing PR #$PR_NUM..."

          # The attempt count is determined in a later step, but we need
          # to know it now for the dynamic comment. Count rejections inline.
          ISSUE_NUM_FROM_PR=$(gh pr view "$PR_NUM" --repo "$PRIVATE_REPO" --json body -q .body | grep -oE 'Fixes (RaufGlasgow/Sorting-History)?#[0-9]+' | head -1 | grep -o '[0-9]*' || true)

          # Count previous rejections to determine current attempt
          if [ -n "$ISSUE_NUM_FROM_PR" ]; then
            PREV_REJECTIONS=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM_FROM_PR/comments" \
              --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt"))] | length' 2>/dev/null || echo "0")
          else
            PREV_REJECTIONS="0"
          fi
          CURRENT_ATTEMPT=$((PREV_REJECTIONS + 1))
          MAX_ATTEMPTS=$(gh variable get MAX_FIX_ATTEMPTS --repo RaufGlasgow/sortinghistory-bugs 2>/dev/null || echo "2")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$CURRENT_ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            # Retrying — not at max attempts yet
            {
              echo "## Fix Rejected — Retry in Progress"
              echo ""
              printf "**Reason:** %s\n" "$REJECTION_REASON"
              echo "**Attempt ${CURRENT_ATTEMPT} of ${MAX_ATTEMPTS} failed.**"
              echo ""
              echo "A new fix attempt is being generated with a different approach. A new PR will appear on the linked issue in approximately 10 minutes."
              echo ""
              echo "[View retry workflow](${RUN_URL})"
              echo ""
              echo "---"
              echo "*Closed by fix-rejection workflow.*"
            } > /tmp/reject-comment.md
          else
            # At max attempts — escalating
            {
              echo "## Fix Rejected — Escalated for Manual Fix"
              echo ""
              printf "**Reason:** %s\n" "$REJECTION_REASON"
              echo "**All ${MAX_ATTEMPTS} automated attempts have failed.**"
              echo ""
              echo "The issue has been labeled \`needs-manual-fix\`. A developer needs to investigate and fix this bug manually."
              echo ""
              echo "No further automated fix attempts will be made unless the issue is re-approved."
              echo ""
              echo "---"
              echo "*Closed by fix-rejection workflow.*"
            } > /tmp/reject-comment.md
          fi

          gh pr comment "$PR_NUM" --repo "$PRIVATE_REPO" -F /tmp/reject-comment.md
          gh pr close "$PR_NUM" --repo "$PRIVATE_REPO"
          echo "PR #$PR_NUM closed"

      - name: Update Issue Labels
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE_NUM="${{ steps.extract.outputs.issue_num }}"
          echo "Updating labels on issue #$ISSUE_NUM..."

          # Remove pipeline progress labels (fix-failed added later only if NOT retrying)
          gh issue edit "$ISSUE_NUM" --repo "$PRIVATE_REPO" \
            --remove-label "fix-generated,pr-created,build-passed,tests-passed,tests-passing" 2>/dev/null || true

          echo "Pipeline labels removed from issue #$ISSUE_NUM"

      - name: Get Max Fix Attempts
        id: config
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          MAX_ATTEMPTS=$(gh variable get MAX_FIX_ATTEMPTS --repo RaufGlasgow/sortinghistory-bugs 2>/dev/null || echo "2")
          echo "max_attempts=$MAX_ATTEMPTS" >> $GITHUB_OUTPUT
          echo "Max fix attempts configured: $MAX_ATTEMPTS"

      - name: Count Previous Rejections
        id: count
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
        run: |
          ISSUE_NUM="${{ steps.extract.outputs.issue_num }}"

          # Count comments containing "## Fix Rejected (Attempt" pattern
          REJECTION_COUNT=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM/comments" \
            --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt"))] | length')

          # This is the current attempt (previous rejections + 1)
          ATTEMPT=$((REJECTION_COUNT + 1))
          echo "This is rejection attempt $ATTEMPT (found $REJECTION_COUNT previous rejections)"
          echo "attempt=$ATTEMPT" >> $GITHUB_OUTPUT
          echo "rejection_count=$REJECTION_COUNT" >> $GITHUB_OUTPUT

          # Determine retry vs escalate using configurable max
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            echo "should_retry=true" >> $GITHUB_OUTPUT
            echo "Decision: RETRY (attempt $ATTEMPT < max $MAX_ATTEMPTS)"
          else
            echo "should_retry=false" >> $GITHUB_OUTPUT
            echo "Decision: ESCALATE (attempt $ATTEMPT >= max $MAX_ATTEMPTS)"
          fi

      - name: Post Failure Context on Issue
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
          FIX_SUMMARY: ${{ steps.extract.outputs.fix_summary }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine accurate next steps based on whether retry or escalation
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            NEXT_STEPS="A retry is already in progress. A new PR will appear on this issue in ~10 minutes.

          [View retry workflow](${RUN_URL})"
          else
            NEXT_STEPS="All automated attempts failed. This issue needs manual investigation. Label: \`needs-manual-fix\`"
          fi

          # Build comment body via printf to safely handle user-provided content
          {
            echo "## Fix Rejected (Attempt $ATTEMPT/$MAX_ATTEMPTS)"
            echo ""
            echo "**PR:** #$PR_NUM (closed)"
            printf "**Rejection reason:** %s\n" "$REJECTION_REASON"
            echo ""
            echo "### What the fix attempted"
            echo "$FIX_SUMMARY"
            echo ""
            echo "### Next steps"
            echo "$NEXT_STEPS"
            echo ""
            echo "---"
            echo "*Posted by fix-rejection workflow.*"
          } > /tmp/failure-context.md

          gh issue comment "$ISSUE_NUM" --repo "$PRIVATE_REPO" -F /tmp/failure-context.md
          echo "Failure context posted on issue #$ISSUE_NUM"

      - name: Dispatch Retry (if under max attempts)
        if: steps.extract.outputs.issue_found == 'true' && steps.count.outputs.should_retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
          FIX_SUMMARY: ${{ steps.extract.outputs.fix_summary }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
          INNER_LOOP_FAILURES: ${{ steps.extract.outputs.inner_loop_failures }}
        run: |

          NEXT_ATTEMPT=$((ATTEMPT + 1))
          echo "Attempt $ATTEMPT < $MAX_ATTEMPTS — dispatching retry (attempt $NEXT_ATTEMPT)..."

          # BA-008.9: Build JSON safely using jq, now including inner_loop_failures
          jq -n \
            --arg issue_num "$ISSUE_NUM" \
            --arg attempt "$NEXT_ATTEMPT" \
            --arg fix_summary "$FIX_SUMMARY" \
            --arg rejection_reason "$REJECTION_REASON" \
            --arg inner_loop_failures "$INNER_LOOP_FAILURES" \
            '{
              event_type: "sdk-bug-fix",
              client_payload: {
                issue_number: ($issue_num | tonumber),
                retry: true,
                attempt: ($attempt | tonumber),
                previous_fix_summary: $fix_summary,
                rejection_reason: $rejection_reason,
                inner_loop_failures: $inner_loop_failures
              }
            }' > /tmp/retry-payload.json

          gh api "repos/${{ github.repository }}/dispatches" --input /tmp/retry-payload.json

          echo "Retry dispatch sent for issue #$ISSUE_NUM (attempt $NEXT_ATTEMPT)"

      - name: Escalate to Manual Fix (max attempts reached)
        if: steps.extract.outputs.issue_found == 'true' && steps.count.outputs.should_retry == 'false'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
        run: |
          MAX_ATTEMPTS="${{ steps.config.outputs.max_attempts }}"
          echo "Attempt $ATTEMPT >= $MAX_ATTEMPTS — retries exhausted, escalating to manual fix"

          # Add fix-failed + needs-manual-fix labels (only on escalation, not on retry)
          gh issue edit "$ISSUE_NUM" --repo "$PRIVATE_REPO" \
            --add-label "fix-failed,needs-manual-fix"

          # Build escalation comment with attempt history summary
          # Use jq to extract rejection reasons only (not full comment bodies,
          # which would embed the "## Fix Rejected (Attempt" pattern and inflate future counts)
          REASONS=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM/comments" \
            --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt")) | .body | capture("\\*\\*Rejection reason:\\*\\* (?<r>.+)") | .r] | to_entries | map("- Attempt \(.key + 1): \(.value)") | join("\n")' 2>/dev/null || echo "")

          {
            echo "## Automated Fix Attempts Exhausted"
            echo ""
            echo "**$ATTEMPT automated fix attempts have been tried and rejected.** This bug needs manual developer attention."
            echo ""
            echo "### Rejection History"
            echo ""
            if [ -n "$REASONS" ]; then
              echo "$REASONS"
            else
              echo "(Could not retrieve rejection reasons)"
            fi
            echo ""
            echo "---"
            echo "*Escalated by fix-rejection workflow.*"
          } > /tmp/escalation-comment.md

          gh issue comment "$ISSUE_NUM" --repo "$PRIVATE_REPO" -F /tmp/escalation-comment.md

          echo "Issue #$ISSUE_NUM escalated — needs-manual-fix label applied"

      # BA-008.1 AC4: Send rejection confirmation email (retry or escalation variant)
      - name: Send rejection email
        if: always() && steps.extract.outputs.issue_found == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
          SHOULD_RETRY: ${{ steps.count.outputs.should_retry }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$OWNER_EMAIL" ]; then
            echo "WARNING: RESEND_API_KEY or OWNER_EMAIL not configured — cannot send rejection email"
            exit 0
          fi

          ISSUE_URL="https://github.com/${PRIVATE_REPO}/issues/${ISSUE_NUM}"

          # Fetch issue title safely via jq
          ISSUE_TITLE=$(gh api "repos/${PRIVATE_REPO}/issues/${ISSUE_NUM}" --jq '.title // "Unknown"' 2>/dev/null || echo "Unknown")

          # Build action buttons
          VIEW_BUTTON="<a href=\"${ISSUE_URL}\" style=\"display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;\">View Issue</a>"
          COMMENT_BUTTON=""
          if [ -n "$AUTH_TOKEN" ]; then
            ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$AUTH_TOKEN'))")
            COMMENT_URL="https://sortinghistory.com/api/pipeline/comment?issue=${ISSUE_NUM}&amp;token=${ENCODED_TOKEN}"
            COMMENT_BUTTON="<a href=\"${COMMENT_URL}\" style=\"display:inline-block;padding:14px 24px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;\">Provide Guidance</a>"
          fi

          # Escape rejection reason for HTML display
          SAFE_REASON=$(echo "$REJECTION_REASON" | python3 -c "import sys,html; print(html.escape(sys.stdin.read().strip()))")

          if [ "$SHOULD_RETRY" = "true" ]; then
            # ── Retry variant ──
            SUBJECT="Fix Rejected: #${ISSUE_NUM} — retry in progress (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
            HEADER_BG="#d97706"
            BADGE_BG="#92400e"
            BADGE_TEXT="Retry"
            HEADLINE="Fix Rejected — Retry in Progress"

            cat > /tmp/rejection-email.html << EMAILEOF
            <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
              <div style="background:${HEADER_BG};padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
                <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
                <div style="display:inline-block;padding:4px 14px;background:${BADGE_BG};border-radius:20px;margin-bottom:8px;">
                  <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">${BADGE_TEXT}</span>
                </div>
                <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">${HEADLINE}</h1>
              </div>
              <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
                <div style="margin:0 0 20px 0;padding:14px 16px;background:#faf8f4;border-left:4px solid #DAA520;border-radius:4px;">
                  <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Bug #${ISSUE_NUM}</p>
                  <p style="margin:0;font-size:15px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${ISSUE_TITLE}</p>
                </div>
                <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #dc2626;border-radius:4px;">
                  <p style="margin:0 0 4px 0;font-size:12px;color:#dc2626;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Your Rejection Reason</p>
                  <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${SAFE_REASON}</p>
                </div>
                <table style="width:100%;border-collapse:collapse;margin:0 0 20px 0;">
                  <tr><td style="padding:8px 12px;font-weight:600;width:120px;background:#faf8f4;color:#8B6914;font-size:13px;">Attempt</td><td style="padding:8px 12px;background:#faf8f4;font-size:14px;color:#333333;">${ATTEMPT} of ${MAX_ATTEMPTS} failed</td></tr>
                  <tr><td style="padding:8px 12px;font-weight:600;color:#8B6914;font-size:13px;">Status</td><td style="padding:8px 12px;font-size:14px;color:#333333;">Retry dispatched</td></tr>
                </table>
                <div style="padding:14px 16px;background:#f0fdf4;border:2px solid #86efac;border-radius:8px;margin-bottom:24px;">
                  <p style="margin:0;font-weight:700;color:#166534;font-size:14px;">A new fix attempt is running now. You will get another PR email in approximately 10 minutes.</p>
                </div>
                <div style="text-align:center;">
                  ${VIEW_BUTTON}
                  ${COMMENT_BUTTON}
                </div>
              </div>
              <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
                <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
                <p style="margin:0 0 12px 0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
                <p style="margin:0;font-size:13px;color:#888888;text-align:center;">
                  <a href="https://sortinghistory.com" style="color:#8B6914;text-decoration:none;">Website</a>
                  &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                  <a href="https://x.com/SortingHistory" style="color:#8B6914;text-decoration:none;">X/Twitter</a>
                  &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                  <a href="https://instagram.com/sortinghistory" style="color:#8B6914;text-decoration:none;">Instagram</a>
                </p>
              </div>
              <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
                <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Rejection notification</p>
              </div>
            </div>
          EMAILEOF

          else
            # ── Escalation variant ──
            SUBJECT="Fix Rejected: #${ISSUE_NUM} — all ${MAX_ATTEMPTS} attempts exhausted"
            HEADER_BG="#b91c1c"
            BADGE_BG="#7f1d1d"
            BADGE_TEXT="Escalated"
            HEADLINE="All Automated Attempts Exhausted"

            # Fetch rejection history
            REASONS_HTML=$(gh api "repos/${PRIVATE_REPO}/issues/${ISSUE_NUM}/comments" \
              --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt")) | .body | capture("\\*\\*Rejection reason:\\*\\* (?<r>.+)") | .r] | to_entries | map("<li><strong>Attempt \(.key + 1):</strong> \(.value)</li>") | join("")' 2>/dev/null || echo "")
            if [ -z "$REASONS_HTML" ]; then
              REASONS_HTML="<li>Could not retrieve rejection reasons</li>"
            fi

            cat > /tmp/rejection-email.html << EMAILEOF
            <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
              <div style="background:${HEADER_BG};padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
                <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
                <div style="display:inline-block;padding:4px 14px;background:${BADGE_BG};border-radius:20px;margin-bottom:8px;">
                  <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">${BADGE_TEXT}</span>
                </div>
                <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">${HEADLINE}</h1>
              </div>
              <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
                <div style="margin:0 0 20px 0;padding:14px 16px;background:#faf8f4;border-left:4px solid #DAA520;border-radius:4px;">
                  <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Bug #${ISSUE_NUM}</p>
                  <p style="margin:0;font-size:15px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${ISSUE_TITLE}</p>
                </div>
                <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #dc2626;border-radius:4px;">
                  <p style="margin:0 0 4px 0;font-size:12px;color:#dc2626;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Latest Rejection</p>
                  <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;overflow-wrap:break-word;">${SAFE_REASON}</p>
                </div>
                <div style="margin:0 0 20px 0;padding:14px 16px;background:#fefce8;border-left:4px solid #ca8a04;border-radius:4px;">
                  <p style="margin:0 0 4px 0;font-size:12px;color:#ca8a04;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Rejection History</p>
                  <ul style="margin:4px 0 0 0;padding-left:20px;font-size:14px;color:#333333;line-height:1.8;">${REASONS_HTML}</ul>
                </div>
                <div style="padding:14px 16px;background:#fef2f2;border:2px solid #fca5a5;border-radius:8px;margin-bottom:24px;">
                  <p style="margin:0;font-weight:700;color:#991b1b;font-size:14px;">This bug needs manual investigation. The issue has been labeled <code style="background:#fef2f2;padding:1px 4px;border-radius:3px;font-size:13px;">needs-manual-fix</code>. No further automated attempts will be made.</p>
                </div>
                <div style="text-align:center;">
                  ${VIEW_BUTTON}
                  ${COMMENT_BUTTON}
                </div>
              </div>
              <div style="padding:20px 24px;background:#faf8f4;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
                <p style="margin:0 0 4px 0;font-size:14px;color:#8B6914;font-weight:600;text-align:center;">Sorting History</p>
                <p style="margin:0 0 12px 0;font-size:13px;color:#777777;text-align:center;">Sort history's greatest moments into the correct order</p>
                <p style="margin:0;font-size:13px;color:#888888;text-align:center;">
                  <a href="https://sortinghistory.com" style="color:#8B6914;text-decoration:none;">Website</a>
                  &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                  <a href="https://x.com/SortingHistory" style="color:#8B6914;text-decoration:none;">X/Twitter</a>
                  &nbsp;&nbsp;&#183;&nbsp;&nbsp;
                  <a href="https://instagram.com/sortinghistory" style="color:#8B6914;text-decoration:none;">Instagram</a>
                </p>
              </div>
              <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
                <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Escalation notification</p>
              </div>
            </div>
          EMAILEOF
          fi

          # Build JSON safely using jq --rawfile
          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "$SUBJECT" \
            --rawfile html /tmp/rejection-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Rejection email send failed (non-fatal)"

          echo "Rejection email sent for issue #${ISSUE_NUM} (retry=$SHOULD_RETRY)"
