name: Fix Rejected

on:
  repository_dispatch:
    types: [reject-fix]

permissions:
  contents: write

concurrency:
  group: reject-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  PR_NUM: ${{ github.event.client_payload.pr_number }}
  REJECTION_REASON: ${{ github.event.client_payload.rejection_reason }}
  PRIVATE_REPO: RaufGlasgow/Sorting-History

jobs:
  reject-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Issue Number from PR Body
        id: extract
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          echo "Fetching PR #$PR_NUM from $PRIVATE_REPO..."

          # Get PR body
          PR_BODY=$(gh pr view "$PR_NUM" --repo "$PRIVATE_REPO" --json body -q .body)

          # Extract issue number from "Fixes #XX" pattern (portable — no grep -P)
          ISSUE_NUM=$(echo "$PR_BODY" | grep -o 'Fixes #[0-9]*' | head -1 | grep -o '[0-9]*')

          if [ -z "$ISSUE_NUM" ]; then
            echo "WARNING: Could not extract issue number from PR body"
            echo "issue_found=false" >> $GITHUB_OUTPUT
            echo "issue_num=" >> $GITHUB_OUTPUT
          else
            echo "Found linked issue: #$ISSUE_NUM"
            echo "issue_found=true" >> $GITHUB_OUTPUT
            echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT
          fi

          # Extract fix summary from "### Changes Made" section
          FIX_SUMMARY=$(echo "$PR_BODY" | sed -n '/### Changes Made/,/^###\|^---/p' | sed '1d;$d' | head -20)
          if [ -z "$FIX_SUMMARY" ]; then
            FIX_SUMMARY="(Could not extract fix summary from PR body)"
          fi
          # Write multiline output
          echo "fix_summary<<EOF" >> $GITHUB_OUTPUT
          echo "$FIX_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # BA-008.9: Extract inner_loop_failures from PR body (hidden comment)
          INNER_FAILURES=$(echo "$PR_BODY" | grep -o 'INNER_LOOP_FAILURES: .*' | sed 's/INNER_LOOP_FAILURES: //' | sed 's/ -->//' | head -1)
          if [ -n "$INNER_FAILURES" ]; then
            echo "Found inner loop failures from previous run"
            echo "inner_loop_failures<<ILFEOF" >> $GITHUB_OUTPUT
            echo "$INNER_FAILURES" >> $GITHUB_OUTPUT
            echo "ILFEOF" >> $GITHUB_OUTPUT
          else
            echo "No inner loop failures found in PR body"
            echo "inner_loop_failures=" >> $GITHUB_OUTPUT
          fi

      - name: Close PR with Rejection Comment
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          echo "Closing PR #$PR_NUM..."

          # The attempt count is determined in a later step, but we need
          # to know it now for the dynamic comment. Count rejections inline.
          ISSUE_NUM_FROM_PR=$(gh pr view "$PR_NUM" --repo "$PRIVATE_REPO" --json body -q .body | grep -o 'Fixes #[0-9]*' | head -1 | grep -o '[0-9]*' || true)

          # Count previous rejections to determine current attempt
          if [ -n "$ISSUE_NUM_FROM_PR" ]; then
            PREV_REJECTIONS=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM_FROM_PR/comments" \
              --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt"))] | length' 2>/dev/null || echo "0")
          else
            PREV_REJECTIONS="0"
          fi
          CURRENT_ATTEMPT=$((PREV_REJECTIONS + 1))
          MAX_ATTEMPTS=$(gh variable get MAX_FIX_ATTEMPTS --repo RaufGlasgow/sortinghistory-bugs 2>/dev/null || echo "2")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$CURRENT_ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            # Retrying — not at max attempts yet
            {
              echo "## Fix Rejected — Retry in Progress"
              echo ""
              printf "**Reason:** %s\n" "$REJECTION_REASON"
              echo "**Attempt ${CURRENT_ATTEMPT} of ${MAX_ATTEMPTS} failed.**"
              echo ""
              echo "A new fix attempt is being generated with a different approach. A new PR will appear on the linked issue in approximately 10 minutes."
              echo ""
              echo "[View retry workflow](${RUN_URL})"
              echo ""
              echo "---"
              echo "*Closed by fix-rejection workflow.*"
            } > /tmp/reject-comment.md
          else
            # At max attempts — escalating
            {
              echo "## Fix Rejected — Escalated for Manual Fix"
              echo ""
              printf "**Reason:** %s\n" "$REJECTION_REASON"
              echo "**All ${MAX_ATTEMPTS} automated attempts have failed.**"
              echo ""
              echo "The issue has been labeled \`needs-manual-fix\`. A developer needs to investigate and fix this bug manually."
              echo ""
              echo "No further automated fix attempts will be made unless the issue is re-approved."
              echo ""
              echo "---"
              echo "*Closed by fix-rejection workflow.*"
            } > /tmp/reject-comment.md
          fi

          gh pr comment "$PR_NUM" --repo "$PRIVATE_REPO" -F /tmp/reject-comment.md
          gh pr close "$PR_NUM" --repo "$PRIVATE_REPO"
          echo "PR #$PR_NUM closed"

      - name: Update Issue Labels
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE_NUM="${{ steps.extract.outputs.issue_num }}"
          echo "Updating labels on issue #$ISSUE_NUM..."

          # Remove pipeline progress labels (fix-failed added later only if NOT retrying)
          gh issue edit "$ISSUE_NUM" --repo "$PRIVATE_REPO" \
            --remove-label "fix-generated,pr-created,build-passed,tests-passed,tests-passing" 2>/dev/null || true

          echo "Pipeline labels removed from issue #$ISSUE_NUM"

      - name: Get Max Fix Attempts
        id: config
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          MAX_ATTEMPTS=$(gh variable get MAX_FIX_ATTEMPTS --repo RaufGlasgow/sortinghistory-bugs 2>/dev/null || echo "2")
          echo "max_attempts=$MAX_ATTEMPTS" >> $GITHUB_OUTPUT
          echo "Max fix attempts configured: $MAX_ATTEMPTS"

      - name: Count Previous Rejections
        id: count
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
        run: |
          ISSUE_NUM="${{ steps.extract.outputs.issue_num }}"

          # Count comments containing "## Fix Rejected (Attempt" pattern
          REJECTION_COUNT=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM/comments" \
            --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt"))] | length')

          # This is the current attempt (previous rejections + 1)
          ATTEMPT=$((REJECTION_COUNT + 1))
          echo "This is rejection attempt $ATTEMPT (found $REJECTION_COUNT previous rejections)"
          echo "attempt=$ATTEMPT" >> $GITHUB_OUTPUT
          echo "rejection_count=$REJECTION_COUNT" >> $GITHUB_OUTPUT

          # Determine retry vs escalate using configurable max
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            echo "should_retry=true" >> $GITHUB_OUTPUT
            echo "Decision: RETRY (attempt $ATTEMPT < max $MAX_ATTEMPTS)"
          else
            echo "should_retry=false" >> $GITHUB_OUTPUT
            echo "Decision: ESCALATE (attempt $ATTEMPT >= max $MAX_ATTEMPTS)"
          fi

      - name: Post Failure Context on Issue
        if: steps.extract.outputs.issue_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
          FIX_SUMMARY: ${{ steps.extract.outputs.fix_summary }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine accurate next steps based on whether retry or escalation
          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            NEXT_STEPS="A retry is already in progress. A new PR will appear on this issue in ~10 minutes.

          [View retry workflow](${RUN_URL})"
          else
            NEXT_STEPS="All automated attempts failed. This issue needs manual investigation. Label: \`needs-manual-fix\`"
          fi

          # Build comment body via printf to safely handle user-provided content
          {
            echo "## Fix Rejected (Attempt $ATTEMPT/$MAX_ATTEMPTS)"
            echo ""
            echo "**PR:** #$PR_NUM (closed)"
            printf "**Rejection reason:** %s\n" "$REJECTION_REASON"
            echo ""
            echo "### What the fix attempted"
            echo "$FIX_SUMMARY"
            echo ""
            echo "### Next steps"
            echo "$NEXT_STEPS"
            echo ""
            echo "---"
            echo "*Posted by fix-rejection workflow.*"
          } > /tmp/failure-context.md

          gh issue comment "$ISSUE_NUM" --repo "$PRIVATE_REPO" -F /tmp/failure-context.md
          echo "Failure context posted on issue #$ISSUE_NUM"

      - name: Dispatch Retry (if under max attempts)
        if: steps.extract.outputs.issue_found == 'true' && steps.count.outputs.should_retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
          FIX_SUMMARY: ${{ steps.extract.outputs.fix_summary }}
          MAX_ATTEMPTS: ${{ steps.config.outputs.max_attempts }}
          INNER_LOOP_FAILURES: ${{ steps.extract.outputs.inner_loop_failures }}
        run: |

          NEXT_ATTEMPT=$((ATTEMPT + 1))
          echo "Attempt $ATTEMPT < $MAX_ATTEMPTS — dispatching retry (attempt $NEXT_ATTEMPT)..."

          # BA-008.9: Build JSON safely using jq, now including inner_loop_failures
          jq -n \
            --arg issue_num "$ISSUE_NUM" \
            --arg attempt "$NEXT_ATTEMPT" \
            --arg fix_summary "$FIX_SUMMARY" \
            --arg rejection_reason "$REJECTION_REASON" \
            --arg inner_loop_failures "$INNER_LOOP_FAILURES" \
            '{
              event_type: "approve",
              client_payload: {
                issue_number: ($issue_num | tonumber),
                retry: true,
                attempt: ($attempt | tonumber),
                previous_fix_summary: $fix_summary,
                rejection_reason: $rejection_reason,
                inner_loop_failures: $inner_loop_failures
              }
            }' > /tmp/retry-payload.json

          gh api "repos/${{ github.repository }}/dispatches" --input /tmp/retry-payload.json

          echo "Retry dispatch sent for issue #$ISSUE_NUM (attempt $NEXT_ATTEMPT)"

      - name: Escalate to Manual Fix (max attempts reached)
        if: steps.extract.outputs.issue_found == 'true' && steps.count.outputs.should_retry == 'false'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          ISSUE_NUM: ${{ steps.extract.outputs.issue_num }}
          ATTEMPT: ${{ steps.count.outputs.attempt }}
        run: |
          MAX_ATTEMPTS="${{ steps.config.outputs.max_attempts }}"
          echo "Attempt $ATTEMPT >= $MAX_ATTEMPTS — retries exhausted, escalating to manual fix"

          # Add fix-failed + needs-manual-fix labels (only on escalation, not on retry)
          gh issue edit "$ISSUE_NUM" --repo "$PRIVATE_REPO" \
            --add-label "fix-failed,needs-manual-fix"

          # Build escalation comment with attempt history summary
          # Use jq to extract rejection reasons only (not full comment bodies,
          # which would embed the "## Fix Rejected (Attempt" pattern and inflate future counts)
          REASONS=$(gh api "repos/$PRIVATE_REPO/issues/$ISSUE_NUM/comments" \
            --paginate --jq '[.[] | select(.body | contains("## Fix Rejected (Attempt")) | .body | capture("\\*\\*Rejection reason:\\*\\* (?<r>.+)") | .r] | to_entries | map("- Attempt \(.key + 1): \(.value)") | join("\n")' 2>/dev/null || echo "")

          {
            echo "## Automated Fix Attempts Exhausted"
            echo ""
            echo "**$ATTEMPT automated fix attempts have been tried and rejected.** This bug needs manual developer attention."
            echo ""
            echo "### Rejection History"
            echo ""
            if [ -n "$REASONS" ]; then
              echo "$REASONS"
            else
              echo "(Could not retrieve rejection reasons)"
            fi
            echo ""
            echo "---"
            echo "*Escalated by fix-rejection workflow.*"
          } > /tmp/escalation-comment.md

          gh issue comment "$ISSUE_NUM" --repo "$PRIVATE_REPO" -F /tmp/escalation-comment.md

          echo "Issue #$ISSUE_NUM escalated — needs-manual-fix label applied"
