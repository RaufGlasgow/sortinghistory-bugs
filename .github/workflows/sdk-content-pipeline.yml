name: SDK Content Pipeline
run-name: "Content #${{ github.event.client_payload.issue_number || 'scheduled' }} (${{ github.event.action || 'manual' }})"

on:
  repository_dispatch:
    types: [sdk-content-verify, sdk-content-resume]
  # schedule disabled — daily cron was calling Anthropic API with no value
  # re-enable only after pipeline migration (PIPE-R6)
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-content-${{ github.event.client_payload.issue_number || github.run_id }}
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DISPATCH_TYPE: ${{ github.event.action || 'manual' }}
  WORKFLOW_TYPE: ${{ github.event.client_payload.workflow_type || 'content_verification' }}
  WORKFLOW_ID: ${{ github.event.client_payload.workflow_id || '' }}

jobs:
  sdk-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public repo (automation scripts + SDK)
        uses: actions/checkout@v4

      - name: Checkout private repo (game content)
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: game-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Scripts/sdk
        run: npm ci

      - name: TypeScript type-check
        working-directory: Scripts/sdk
        run: npx tsc --noEmit

      - name: Build TypeScript
        working-directory: Scripts/sdk
        run: npm run build

      # === CONTENT VERIFY (sdk-content-verify dispatch) — Story 2.4b AC5 ===
      - name: "Content Verify: Validate payload"
        if: github.event.action == 'sdk-content-verify'
        run: |
          # AC13: Validate issue_number as numeric
          ISSUE="${{ github.event.client_payload.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi

          # AC13: Validate category is non-empty (detailed check done by orchestrator)
          CATEGORY="${{ github.event.client_payload.category }}"
          if [ -z "$CATEGORY" ]; then
            echo "::error::Missing category in payload."
            exit 1
          fi

          echo "VERIFY_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "VERIFY_CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "Validated: issue_number=$ISSUE category='$CATEGORY'"

      - name: "Content Verify: Run verification pipeline"
        if: github.event.action == 'sdk-content-verify'
        working-directory: Scripts/sdk
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          node dist/orchestrator.js content-e2e \
            --category "$VERIFY_CATEGORY" \
            --issue "$VERIFY_ISSUE" \
            --no-dry-run
        timeout-minutes: 15

      # AC10: State files committed WITHIN the verify step group
      - name: "Content Verify: Commit state files"
        if: github.event.action == 'sdk-content-verify'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add Scripts/sdk/state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: verify pause for issue #$VERIFY_ISSUE" && git push)

      # === CONTENT RESUME (sdk-content-resume dispatch) — Story 2.4b AC6 ===
      - name: "Content Resume: Validate payload"
        if: github.event.action == 'sdk-content-resume'
        run: |
          # AC13: Validate issue_number as numeric
          ISSUE="${{ github.event.client_payload.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi

          # AC13: Validate action as approve or reject
          ACTION="${{ github.event.client_payload.action }}"
          if [[ "$ACTION" != "approve" && "$ACTION" != "reject" ]]; then
            echo "::error::Invalid action in payload: '$ACTION'. Must be 'approve' or 'reject'."
            exit 1
          fi

          echo "RESUME_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "RESUME_ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "Validated: issue_number=$ISSUE action=$ACTION"

      - name: "Content Resume: Resume with approval"
        if: github.event.action == 'sdk-content-resume'
        working-directory: Scripts/sdk
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          node dist/orchestrator.js resume \
            --issue "$RESUME_ISSUE" \
            --action "$RESUME_ACTION"
        timeout-minutes: 15

      # AC10: State files committed WITHIN the resume step group
      - name: "Content Resume: Commit state files"
        if: github.event.action == 'sdk-content-resume'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add Scripts/sdk/state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: resume complete for issue #$RESUME_ISSUE" && git push)

      # === FAILURE HANDLING ===
      # When any content step crashes, mark the issue so it's visible in the digest
      - name: "Label issue on failure"
        if: failure() && (github.event.action == 'sdk-content-verify' || github.event.action == 'sdk-content-resume')
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE="${{ github.event.client_payload.issue_number }}"
          PRIVATE_REPO="RaufGlasgow/Sorting-History"

          # Add failure + handoff labels so pipeline health catches it
          gh issue edit "$ISSUE" --repo "$PRIVATE_REPO" \
            --add-label "content-fix-failed" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$PRIVATE_REPO" \
            --add-label "needs-dev-handoff" 2>/dev/null || true

          # Remove approved so digest skip filter does not hide this issue
          gh issue edit "$ISSUE" --repo "$PRIVATE_REPO" \
            --remove-label "approved" 2>/dev/null || true

          echo "Issue #$ISSUE labeled as content-fix-failed + needs-dev-handoff, approved removed"

      - name: "Send failure email"
        if: failure() && (github.event.action == 'sdk-content-verify' || github.event.action == 'sdk-content-resume')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          ISSUE="${{ github.event.client_payload.issue_number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_URL="https://github.com/RaufGlasgow/Sorting-History/issues/${ISSUE}"

          if [ -z "$RESEND_API_KEY" ] || [ -z "$OWNER_EMAIL" ]; then
            echo "WARNING: Email secrets not configured — skipping failure email"
            exit 0
          fi

          cat > /tmp/content-failure-email.html << EMAILEOF
          <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:600px;margin:0 auto;padding:0;background:#fffdf8;">
            <div style="background:#b91c1c;padding:32px 24px;text-align:center;border-radius:12px 12px 0 0;">
              <img src="https://sortinghistory.com/images/app-icon.png" alt="Sorting History" style="width:80px;height:80px;border-radius:18px;margin-bottom:12px;" />
              <div style="display:inline-block;padding:4px 14px;background:#7f1d1d;border-radius:20px;margin-bottom:8px;">
                <span style="color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;">Pipeline Error</span>
              </div>
              <h1 style="color:#ffffff;margin:0;font-size:22px;font-weight:700;">Content Pipeline Failed</h1>
            </div>
            <div style="padding:28px 24px;background:#ffffff;border-left:1px solid #e5e1d8;border-right:1px solid #e5e1d8;">
              <div style="margin:0 0 20px 0;padding:14px 16px;background:#fef2f2;border-left:4px solid #b91c1c;border-radius:4px;">
                <p style="margin:0 0 4px 0;font-size:12px;color:#b91c1c;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">What Happened</p>
                <p style="margin:0;font-size:14px;color:#333333;line-height:1.5;">Content pipeline for <strong>issue #${ISSUE}</strong> crashed. The issue has been labeled <code>content-fix-failed</code> and will appear in your next digest.</p>
              </div>
              <div style="padding:14px 16px;background:#f0f7ff;border:2px solid #93c5fd;border-radius:8px;margin-bottom:24px;">
                <p style="margin:0;font-weight:700;color:#1e40af;font-size:14px;">Check the workflow log to see what went wrong, then fix and re-dispatch.</p>
              </div>
              <div style="text-align:center;">
                <a href="${ISSUE_URL}" style="display:inline-block;padding:14px 24px;background:#8B6914;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;margin:0 6px 8px;">View Issue</a>
              </div>
              <p style="text-align:center;margin-top:12px;"><a href="${RUN_URL}" style="color:#8B6914;font-size:13px;text-decoration:none;">View workflow log &rarr;</a></p>
            </div>
            <div style="padding:16px 24px;background:#f5f0e8;border:1px solid #e5e1d8;border-top:none;border-radius:0 0 12px 12px;text-align:center;">
              <p style="margin:0 0 4px 0;font-size:12px;color:#8B6914;font-weight:600;">Sorting History &mdash; Learn history by playing it</p>
              <p style="margin:0;font-size:10px;color:#aaaaaa;">SortingHistory Pipeline &bull; Content failure alert</p>
            </div>
          </div>
          EMAILEOF

          PAYLOAD=$(jq -n \
            --arg from "SortingHistory Pipeline <bugs@sortinghistory.com>" \
            --arg to "$OWNER_EMAIL" \
            --arg subject "Pipeline Failed: Content pipeline crashed for issue #${ISSUE}" \
            --rawfile html /tmp/content-failure-email.html \
            '{from: $from, to: [$to], subject: $subject, html: $html}')

          curl -sf -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Email send failed (non-fatal)"

      # === TEST SUITE (manual / schedule / push) ===
      - name: "Story 1.3: Read-only proof"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js proof
        timeout-minutes: 2
        continue-on-error: true

      - name: "Story 4.2: Routing logic test"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js routing-test
        timeout-minutes: 1

      - name: "Story 4.3: Resume-by-issue lookup test"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js resume-by-issue-test
        timeout-minutes: 1

      - name: "Story 4.1: Bug triage test suite"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js triage-test
        timeout-minutes: 5

      - name: "Story 1.5: Pause/resume proof"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js pause-resume
        timeout-minutes: 3

      # === FALLBACK STATE COMMIT (for test suite runs only) ===
      - name: Commit state files
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add Scripts/sdk/state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || (git commit -m "state: update workflow state" && git push)

      # ── Story 3.6a: Pipeline Outcome Logging ──
      - name: Log pipeline outcome
        if: always() && (github.event.action == 'sdk-content-verify' || github.event.action == 'sdk-content-resume')
        run: |
          # Resolve issue number from whichever dispatch type ran
          ISSUE="${{ github.event.client_payload.issue_number }}"
          if [ -z "$ISSUE" ] || ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "No valid issue number — skipping outcome log"
            exit 0
          fi

          # Determine outcome from job status
          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" = "success" ]; then
            OUTCOME="success"
            ERROR_DETAIL="null"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            OUTCOME="runner_crash"
            ERROR_DETAIL="\"Job was cancelled\""
          else
            OUTCOME="model_crash"
            ERROR_DETAIL="\"Content pipeline failed — check workflow log\""
          fi

          # Determine stage based on dispatch type
          ACTION="${{ github.event.action }}"
          if [ "$ACTION" = "sdk-content-verify" ]; then
            STAGE="verify"
          else
            STAGE="fix"
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build JSON with jq for safe escaping
          JSON_LINE=$(jq -n -c \
            --argjson issue_number "$ISSUE" \
            --arg timestamp "$TIMESTAMP" \
            --arg stage "$STAGE" \
            --arg classification "content_error" \
            --argjson severity null \
            --argjson confidence null \
            --argjson model null \
            --argjson turns_used null \
            --argjson max_turns null \
            --argjson cost_usd null \
            --arg outcome "$OUTCOME" \
            --argjson attempt_number 1 \
            --argjson error_detail "$ERROR_DETAIL" \
            '{
              issue_number: $issue_number,
              timestamp: $timestamp,
              stage: $stage,
              classification: $classification,
              severity: $severity,
              confidence: $confidence,
              model: $model,
              turns_used: $turns_used,
              max_turns: $max_turns,
              cost_usd: $cost_usd,
              outcome: $outcome,
              attempt_number: $attempt_number,
              error_detail: $error_detail
            }')

          echo "Logging outcome: $JSON_LINE"
          echo "$JSON_LINE" >> pipeline-outcomes.jsonl

          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add pipeline-outcomes.jsonl
          git commit -m "log: content outcome for #$ISSUE"

          # Retry push with rebase for concurrent append handling
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed, retrying with rebase (attempt $i)..."
            git pull --rebase origin main || true
          done
