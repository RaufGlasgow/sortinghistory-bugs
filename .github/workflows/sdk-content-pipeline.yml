name: SDK Content Pipeline

on:
  repository_dispatch:
    types: [sdk-content-verify, sdk-content-resume]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdk-content-pipeline
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DISPATCH_TYPE: ${{ github.event.action || 'manual' }}
  WORKFLOW_TYPE: ${{ github.event.client_payload.workflow_type || 'content_verification' }}
  WORKFLOW_ID: ${{ github.event.client_payload.workflow_id || '' }}

jobs:
  sdk-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout public repo (automation scripts + SDK)
        uses: actions/checkout@v4

      - name: Checkout private repo (game content)
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: game-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: Scripts/sdk
        run: npm ci

      - name: TypeScript type-check
        working-directory: Scripts/sdk
        run: npx tsc --noEmit

      - name: Build TypeScript
        working-directory: Scripts/sdk
        run: npm run build

      # === CONTENT VERIFY (sdk-content-verify dispatch) — Story 2.4b AC5 ===
      - name: "Content Verify: Validate payload"
        if: github.event.action == 'sdk-content-verify'
        run: |
          # AC13: Validate issue_number as numeric
          ISSUE="${{ github.event.client_payload.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi

          # AC13: Validate category is non-empty (detailed check done by orchestrator)
          CATEGORY="${{ github.event.client_payload.category }}"
          if [ -z "$CATEGORY" ]; then
            echo "::error::Missing category in payload."
            exit 1
          fi

          echo "VERIFY_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "VERIFY_CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "Validated: issue_number=$ISSUE category='$CATEGORY'"

      - name: "Content Verify: Run verification pipeline"
        if: github.event.action == 'sdk-content-verify'
        working-directory: Scripts/sdk
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          node dist/orchestrator.js content-e2e \
            --category "$VERIFY_CATEGORY" \
            --issue "$VERIFY_ISSUE" \
            --no-dry-run
        timeout-minutes: 15

      # AC10: State files committed WITHIN the verify step group
      - name: "Content Verify: Commit state files"
        if: github.event.action == 'sdk-content-verify'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: verify pause for issue #$VERIFY_ISSUE" && git push)

      # === CONTENT RESUME (sdk-content-resume dispatch) — Story 2.4b AC6 ===
      - name: "Content Resume: Validate payload"
        if: github.event.action == 'sdk-content-resume'
        run: |
          # AC13: Validate issue_number as numeric
          ISSUE="${{ github.event.client_payload.issue_number }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number in payload: '$ISSUE'. Must be a positive integer."
            exit 1
          fi

          # AC13: Validate action as approve or reject
          ACTION="${{ github.event.client_payload.action }}"
          if [[ "$ACTION" != "approve" && "$ACTION" != "reject" ]]; then
            echo "::error::Invalid action in payload: '$ACTION'. Must be 'approve' or 'reject'."
            exit 1
          fi

          echo "RESUME_ISSUE=$ISSUE" >> "$GITHUB_ENV"
          echo "RESUME_ACTION=$ACTION" >> "$GITHUB_ENV"
          echo "Validated: issue_number=$ISSUE action=$ACTION"

      - name: "Content Resume: Resume with approval"
        if: github.event.action == 'sdk-content-resume'
        working-directory: Scripts/sdk
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          node dist/orchestrator.js resume \
            --issue "$RESUME_ISSUE" \
            --action "$RESUME_ACTION"
        timeout-minutes: 15

      # AC10: State files committed WITHIN the resume step group
      - name: "Content Resume: Commit state files"
        if: github.event.action == 'sdk-content-resume'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: resume complete for issue #$RESUME_ISSUE" && git push)

      # === TEST SUITE (manual / schedule / push) ===
      - name: "Story 1.3: Haiku read-only proof"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js proof
        timeout-minutes: 2

      - name: "Story 4.2: Routing logic test"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js routing-test
        timeout-minutes: 1

      - name: "Story 4.3: Resume-by-issue lookup test"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js resume-by-issue-test
        timeout-minutes: 1

      - name: "Story 4.1: Bug triage test suite"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js triage-test
        timeout-minutes: 5

      - name: "Story 1.5: Pause/resume proof"
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        working-directory: Scripts/sdk
        run: node dist/orchestrator.js pause-resume
        timeout-minutes: 3

      # === FALLBACK STATE COMMIT (for test suite runs only) ===
      - name: Commit state files
        if: github.event.action != 'sdk-content-verify' && github.event.action != 'sdk-content-resume'
        run: |
          git config user.name "sdk-bot"
          git config user.email "sdk-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || (git commit -m "state: update workflow state" && git push)
