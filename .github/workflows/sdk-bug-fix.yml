name: SDK Bug Fix
run-name: "Fix #${{ github.event.client_payload.issue_number || inputs.issue_number }} (${{ github.event.client_payload.mode || inputs.mode || 'full' }})"

on:
  repository_dispatch:
    types: [sdk-bug-fix]

  # PV2-4.4: Browser-friendly trigger for full pipeline or QA-only re-runs
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number on the private repo (e.g. 84)'
        required: true
        type: string
      mode:
        description: 'Pipeline mode: full = fix + QA, qa-only = QA on existing fix branch'
        required: true
        type: choice
        options:
          - full
          - qa-only
        default: full

permissions:
  contents: write

# PV2-4.4 AC6: Concurrency group resolves issue number from either trigger
concurrency:
  group: sdk-fix-${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  # Unified issue number resolution: repository_dispatch or workflow_dispatch
  ISSUE_NUM: ${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
  # PV2-4.4: Mode resolution — repository_dispatch is always "full"
  PIPELINE_MODE: ${{ github.event_name == 'repository_dispatch' && 'full' || github.event.inputs.mode }}

jobs:
  fix-bug:
    runs-on: macos-14
    # PV2-4.4 AC9: 15 minutes for qa-only, 120 for full (3 attempts × 25-45 min each)
    timeout-minutes: ${{ github.event.inputs.mode == 'qa-only' && 15 || 120 }}

    steps:
      - name: Validate payload
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number: '$ISSUE'. Must be a positive integer."
            exit 1
          fi
          echo "ISSUE_NUMBER=$ISSUE" >> "$GITHUB_ENV"
          echo "Validated issue_number: $ISSUE"
          echo "Pipeline mode: ${{ env.PIPELINE_MODE }}"

      - name: Check Idempotency Guard
        id: guard
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          LABELS=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels --jq '.[].name')
          if echo "$LABELS" | grep -qE "^(approved|pr-created)$"; then
            MATCHED=$(echo "$LABELS" | grep -oE "^(approved|pr-created)$" | head -1)
            echo "Issue #${{ env.ISSUE_NUM }} already has '$MATCHED' label — skipping to prevent duplicate work."
            echo "blocked=true" >> $GITHUB_OUTPUT
            echo "label=$MATCHED" >> $GITHUB_OUTPUT
          else
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Idempotency Block Notice
        if: steps.guard.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          BLOCK_LABEL="${{ steps.guard.outputs.label }}"
          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --body "## Pipeline Skipped

          Pipeline skipped — issue already has \`$BLOCK_LABEL\`. Use /reject to retry.

          ---
          *Posted by SDK bug fix pipeline.*"

      - name: Checkout public repo (automation scripts + SDK)
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/checkout@v4

      - name: Checkout private repo (game source)
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: game-repo
          fetch-depth: 0

      - name: Setup Node.js
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode 16.2
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install SDK dependencies
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        working-directory: Scripts/sdk
        run: npm ci

      - name: Build SDK
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        working-directory: Scripts/sdk
        run: npm run build

      # ── Branch setup: different for full vs qa-only ──

      - name: Create fix branch in game repo (full mode)
        id: branch
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        working-directory: game-repo
        run: |
          BRANCH="fix/sdk-bug-${{ env.ISSUE_NUM }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      # PV2-4.4 AC3a: Checkout existing fix branch (qa-only mode)
      - name: Checkout existing fix branch (qa-only mode)
        id: branch-qa
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'qa-only'
        working-directory: game-repo
        run: |
          BRANCH="fix/sdk-bug-${{ env.ISSUE_NUM }}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

          # Check if the branch exists on the remote
          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "::error::No fix branch found for issue #${{ env.ISSUE_NUM }}. Run a full pipeline first, or verify the issue number is correct."
            exit 1
          fi

          git checkout "$BRANCH"
          echo "Checked out existing fix branch: $BRANCH"

      # ── Run SDK orchestrator ──

      - name: Run SDK bug-fix subagent with QA gate
        id: fix
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        working-directory: Scripts/sdk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set +e

          # PV2-4.4 AC7/AC8: Pass --qa-only flag when mode is qa-only
          QA_ONLY_FLAG=""
          if [ "${{ env.PIPELINE_MODE }}" = "qa-only" ]; then
            QA_ONLY_FLAG="--qa-only"
          fi

          OUTPUT=$(node dist/orchestrator.js bug-fix \
            --issue ${{ env.ISSUE_NUM }} \
            --game-repo "${{ github.workspace }}/game-repo" \
            $QA_ONLY_FLAG 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          # Parse key fields from orchestrator stdout for PR body
          FIX_SUMMARY=$(echo "$OUTPUT" | grep '\[orchestrator\] Bug fix result:' | head -1)
          FILES_MODIFIED=$(echo "$OUTPUT" | grep '\[orchestrator\] Files modified:' | sed 's/.*Files modified: //')
          COMPILATION=$(echo "$OUTPUT" | grep '\[orchestrator\] Compilation:' | sed 's/.*Compilation: //')
          CONFIDENCE=$(echo "$OUTPUT" | grep '\[orchestrator\] Confidence:' | sed 's/.*Confidence: //')
          FIX_ATTEMPTS=$(echo "$OUTPUT" | grep '\[orchestrator\] Fix attempts used:' | sed 's/.*Fix attempts used: //')

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "files_modified=${FILES_MODIFIED:-unknown}" >> $GITHUB_OUTPUT
          echo "compilation=${COMPILATION:-unknown}" >> $GITHUB_OUTPUT
          echo "confidence=${CONFIDENCE:-unknown}" >> $GITHUB_OUTPUT
          echo "fix_attempts=${FIX_ATTEMPTS:-0}" >> $GITHUB_OUTPUT

          # Check if QA summary file was written by the orchestrator (PV2-3.3 AC10)
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          if [ -f "$QA_SUMMARY_FILE" ]; then
            echo "has_qa_summary=true" >> $GITHUB_OUTPUT
            echo "QA summary file found at $QA_SUMMARY_FILE"
          else
            echo "has_qa_summary=false" >> $GITHUB_OUTPUT
            echo "No QA summary file found"
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "applied=false" >> $GITHUB_OUTPUT
            # Truncate error output for GitHub Actions (max 1MB)
            ERROR_SUMMARY=$(echo "$OUTPUT" | tail -20)
            {
              echo "error_summary<<EREOF"
              echo "$ERROR_SUMMARY"
              echo "EREOF"
            } >> $GITHUB_OUTPUT
          else
            echo "applied=true" >> $GITHUB_OUTPUT
          fi

          exit $EXIT_CODE
        continue-on-error: true

      # ── Full mode: check for changes, commit, version bump ──

      - name: Check for changes in game repo
        id: changes
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        working-directory: game-repo
        run: |
          CHANGED_FILES=$(git diff --name-only)
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
          ALL_FILES="$CHANGED_FILES"$'\n'"$UNTRACKED_FILES"
          ALL_FILES=$(echo "$ALL_FILES" | sed '/^$/d')

          if [ -z "$ALL_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in game repo"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$ALL_FILES"
            {
              echo "modified_files<<MFEOF"
              echo "$ALL_FILES"
              echo "MFEOF"
            } >> $GITHUB_OUTPUT
          fi

      # PV2-6.3: Independent compilation verification (AC1-AC6, AC8)
      # Runs xcodebuild independently of the subagent's self-report.
      # Scheme name must match SortingHistory.xcodeproj/xcshareddata/xcschemes/
      - name: Independent compilation check
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.fix.outputs.applied == 'true' && steps.changes.outputs.has_changes == 'true' && env.PIPELINE_MODE == 'full'
        id: compile-check
        timeout-minutes: 5
        working-directory: game-repo
        run: |
          echo "=== Independent compilation verification ==="
          echo "Xcode version: $(xcodebuild -version | head -1)"
          echo "Xcode path: $(xcode-select -p)"

          if xcodebuild build \
            -scheme SortingHistory \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1; then
            echo "COMPILE_RESULT=success" >> "$GITHUB_ENV"
            echo "::notice::Independent compilation check PASSED"
          else
            echo "COMPILE_RESULT=failed" >> "$GITHUB_ENV"
            echo "::error::Independent compilation check FAILED"
            echo "Subagent reported: ${{ steps.fix.outputs.compilation }}"
            exit 1
          fi

      # ── Success path (full mode): commit, push, bump version, create PR ──

      - name: Commit changes
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        run: |
          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"

          # Safe git add: only stage files with allowed extensions
          # Replaces dangerous `git add -A` that staged DerivedData (PR #90)
          ALLOWED_EXTS="swift json strings md plist pbxproj xcscheme"
          STAGED_COUNT=0

          # Collect all changed + untracked files
          ALL_FILES=$(git diff --name-only; git ls-files --others --exclude-standard)

          for FILE in $ALL_FILES; do
            # Skip exclusion patterns
            case "$FILE" in
              *DerivedData/*|*.build/*|*xcuserdata/*|*node_modules/*|*.DS_Store|*.o|*.dSYM|*.dSYM/*)
                echo "EXCLUDED: $FILE"
                continue
                ;;
            esac

            # Check file extension against allowlist
            EXT="${FILE##*.}"
            ALLOWED=false
            for AEXT in $ALLOWED_EXTS; do
              if [ "$EXT" = "$AEXT" ]; then
                ALLOWED=true
                break
              fi
            done

            if [ "$ALLOWED" = true ]; then
              git add -- "$FILE"
              echo "STAGED: $FILE"
              STAGED_COUNT=$((STAGED_COUNT + 1))
            else
              echo "EXCLUDED: $FILE (extension .$EXT not in allowlist)"
            fi
          done

          echo "Safe git add complete: $STAGED_COUNT file(s) staged"

          if git diff --staged --quiet; then
            echo "No changes to commit after staging"
            exit 1
          fi

          git commit -m "fix(#${{ env.ISSUE_NUM }}): SDK bug fix for #${{ env.ISSUE_NUM }}

          Applied by SDK bug fix pipeline (Opus 4.6) with QA gate
          Compilation: ${{ steps.fix.outputs.compilation }}
          Confidence: ${{ steps.fix.outputs.confidence }}"

      # PV2-3.3 AC14: Version bump AFTER QA approval (not before commit)
      # PV2-4.4 AC4: Skip version bump entirely in qa-only mode
      - name: Bump version (centralized)
        id: bump-version
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          GAME_REPO_PATH: "."
        run: |
          bash "${{ github.workspace }}/Scripts/bump-version.sh"

      # PV2-4.4 AC10: Fix git add -A bug — use safe git add pattern for version bump amend
      - name: Amend commit with version bump
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.bump-version.outputs.ALPHA_VERSION != ''
        working-directory: game-repo
        run: |
          # Stage only files with allowed extensions (same pattern as Commit step)
          # Replaces dangerous `git add -A` that reintroduces build artifacts
          ALLOWED_EXTS="swift json strings md plist pbxproj xcscheme"
          STAGED_COUNT=0

          ALL_FILES=$(git diff --name-only; git ls-files --others --exclude-standard)

          for FILE in $ALL_FILES; do
            case "$FILE" in
              *DerivedData/*|*.build/*|*xcuserdata/*|*node_modules/*|*.DS_Store|*.o|*.dSYM|*.dSYM/*)
                echo "EXCLUDED: $FILE"
                continue
                ;;
            esac

            EXT="${FILE##*.}"
            ALLOWED=false
            for AEXT in $ALLOWED_EXTS; do
              if [ "$EXT" = "$AEXT" ]; then
                ALLOWED=true
                break
              fi
            done

            if [ "$ALLOWED" = true ]; then
              git add -- "$FILE"
              echo "STAGED: $FILE"
              STAGED_COUNT=$((STAGED_COUNT + 1))
            else
              echo "EXCLUDED: $FILE (extension .$EXT not in allowlist)"
            fi
          done

          if ! git diff --staged --quiet; then
            git commit --amend --no-edit
            echo "Version bump included in commit ($STAGED_COUNT file(s) staged)"
          else
            echo "No version bump changes to amend"
          fi

      - name: Push branch (full mode)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists on remote -- force-pushing new fix"
            git push origin "$BRANCH" --force
          else
            echo "Branch $BRANCH is new -- pushing"
            git push origin "$BRANCH"
          fi

      # ── PR creation: handles both full and qa-only modes ──

      # PV2-4.4 AC3f: Create PR on success (works for both full and qa-only)
      - name: Create PR on private repo
        id: create-pr
        if: >-
          (steps.guard.outputs.blocked || 'false') != 'true' &&
          ((env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true' && steps.compile-check.outcome == 'success')
          || (env.PIPELINE_MODE == 'qa-only' && steps.fix.outputs.applied == 'true'))
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE_NUM="${{ env.ISSUE_NUM }}"
          BRANCH="${{ steps.branch.outputs.name || steps.branch-qa.outputs.name }}"
          COMPILATION="${{ steps.fix.outputs.compilation }}"
          CONFIDENCE="${{ steps.fix.outputs.confidence }}"
          FILES_MODIFIED="${{ steps.fix.outputs.files_modified }}"
          FIX_ATTEMPTS="${{ steps.fix.outputs.fix_attempts }}"
          ALPHA_VERSION="${{ steps.bump-version.outputs.ALPHA_VERSION }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          MODE="${{ env.PIPELINE_MODE }}"

          # Fetch issue title
          ISSUE_TITLE=$(gh api repos/RaufGlasgow/Sorting-History/issues/${ISSUE_NUM} --jq '.title')

          # BA-010.3: Only close existing PR on retry or manual dispatch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --repo RaufGlasgow/Sorting-History --json number -q '.[0].number' 2>/dev/null || true)
          OLD_PR_NUMBER=""
          if [ -n "$EXISTING_PR" ]; then
            RETRY="${{ github.event.client_payload.retry }}"
            IS_MANUAL="${{ github.event_name }}"
            if [ "$RETRY" = "true" ] || [ "$IS_MANUAL" = "workflow_dispatch" ]; then
              echo "Closing existing PR #$EXISTING_PR (retry=$RETRY, trigger=$IS_MANUAL)"
              gh pr comment "$EXISTING_PR" --repo RaufGlasgow/Sorting-History --body "Superseded by new fix attempt. See new PR when created." 2>/dev/null || true
              gh pr close "$EXISTING_PR" --repo RaufGlasgow/Sorting-History 2>/dev/null || true
              OLD_PR_NUMBER="$EXISTING_PR"
            else
              echo "Open PR #$EXISTING_PR exists and this is NOT a retry — skipping PR creation"
              gh issue comment --repo RaufGlasgow/Sorting-History "${ISSUE_NUM}" \
                --body "Pipeline skipped — open PR already exists (#$EXISTING_PR). Use /reject to retry."
              exit 0
            fi
          fi

          # Build PR body file (uses --body-file to avoid shell backtick issues)
          PR_BODY_FILE="/tmp/pr-body-${ISSUE_NUM}.md"

          {
            if [ -n "$OLD_PR_NUMBER" ]; then
              echo "> **Re-run:** Replaces PR #$OLD_PR_NUMBER"
              echo ""
            fi
            if [ "$MODE" = "qa-only" ]; then
              echo "## SDK Bug Fix (QA-Only Re-Run)"
              echo ""
              echo "Fixes RaufGlasgow/Sorting-History#${ISSUE_NUM}"
              echo ""
              echo "> This PR was created by a **QA-only re-run**. The fix was generated in a previous pipeline run."
              echo "> No new fix was generated. Only QA review and quality gate were re-run."
              echo ""
            else
              echo "## SDK Bug Fix"
              echo ""
              echo "Fixes RaufGlasgow/Sorting-History#${ISSUE_NUM}"
              echo ""
              echo "### Changes Made"
              echo "**Compilation:** ${COMPILATION}"
              echo "**Confidence:** ${CONFIDENCE}"
              if [ "$FIX_ATTEMPTS" -gt 1 ] 2>/dev/null; then
                echo "**Fix Attempts:** ${FIX_ATTEMPTS} (retry with model escalation)"
              fi
              echo ""
              echo "**Files modified:**"
              echo '```'
              echo "${{ steps.changes.outputs.modified_files }}"
              echo '```'
              echo ""
            fi

            # Include QA summary if available (PV2-3.3 AC9)
            if [ -f "$QA_SUMMARY_FILE" ]; then
              echo "---"
              echo ""
              cat "$QA_SUMMARY_FILE"
              echo ""
              echo "---"
              echo ""
            fi

            if [ "$MODE" = "full" ] && [ -n "$ALPHA_VERSION" ]; then
              echo "### How to Test"
              echo "1. Install build version **1.1.0-alpha.${ALPHA_VERSION}** on device or simulator"
              echo "2. Navigate to the area affected by issue #${ISSUE_NUM}"
              echo "3. Verify the bug is fixed"
              echo "4. Check for regressions in related functionality"
              echo ""
              echo '```bash'
              echo "# Build and test locally:"
              echo "xcodebuild build \\"
              echo "  -scheme SortingHistory \\"
              echo "  -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \\"
              echo "  -derivedDataPath DerivedData \\"
              echo "  CODE_SIGNING_ALLOWED=NO"
              echo '```'
              echo ""
            fi

            echo "### Rejection Instructions"
            echo "If this fix doesn't work, post a comment **on this PR** with:"
            echo '```'
            echo "/reject Describe what's still broken"
            echo '```'
            echo ""
            echo "---"
            if [ "$MODE" = "qa-only" ]; then
              echo "*Created by [SDK bug fix pipeline -- QA-only re-run](${RUN_URL}).*"
            else
              echo "*Created by [SDK bug fix pipeline](${RUN_URL}) (retry loop + model escalation + QA gate).*"
            fi
            echo "*All fixes require manual review and merge.*"
          } > "$PR_BODY_FILE"

          # PR title
          if [ "$MODE" = "qa-only" ]; then
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE} [QA re-run]"
          elif [ "$FIX_ATTEMPTS" -gt 1 ] 2>/dev/null; then
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE} [attempt ${FIX_ATTEMPTS}]"
          else
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE}"
          fi

          gh pr create \
            --repo RaufGlasgow/Sorting-History \
            --head "$BRANCH" \
            --base main \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE"

          # Get PR URL
          PR_URL=$(gh pr view --repo RaufGlasgow/Sorting-History "$BRANCH" --json url -q .url)
          PR_NUMBER=$(gh pr view --repo RaufGlasgow/Sorting-History "$BRANCH" --json number -q .number)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Cleanup
          rm -f "$PR_BODY_FILE"

      # PV2-3.3 AC11: Post QA review comment on the issue
      - name: Post QA review comment on issue
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.fix.outputs.has_qa_summary == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          if [ -f "$QA_SUMMARY_FILE" ]; then
            gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" --body-file "$QA_SUMMARY_FILE"
            echo "QA review comment posted on issue #${{ env.ISSUE_NUM }}"
          fi

      - name: Post success comment on issue
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          MODE="${{ env.PIPELINE_MODE }}"

          {
            if [ "$MODE" = "qa-only" ]; then
              echo "## SDK Fix PR Ready for Review (QA-Only Re-Run): PR #${PR_NUMBER}"
            else
              echo "## SDK Fix PR Ready for Review: PR #${PR_NUMBER}"
            fi
            echo ""
            echo "**Status:** Awaiting your review"
            echo "**Branch:** \`${{ steps.branch.outputs.name || steps.branch-qa.outputs.name }}\`"
            echo ""
            echo "### Next Steps"
            echo "1. Review the changes in [PR #${PR_NUMBER}](${PR_URL})"
            echo "2. If the fix looks correct, merge the PR"
            echo "3. If the fix is wrong, post a comment **on the PR** with:"
            echo '   ```'
            echo "   /reject Reason why the fix doesn't work"
            echo '   ```'
          } > /tmp/success-comment.md

          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" -F /tmp/success-comment.md

      - name: Label issue with fix-generated
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --add-label "fix-generated,pr-created"

      # PV2-4.4 AC3f: Remove escalation labels on qa-only success
      - name: Remove escalation labels (qa-only success)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'qa-only' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "needs-handoff-review" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "fix-failed" 2>/dev/null || true
          echo "Removed escalation labels from issue #${{ env.ISSUE_NUM }}"

      # ── Failure path: label + comment ──

      - name: Handle failure - no changes
        if: always() && (steps.guard.outputs.blocked || 'false') != 'true' && (steps.fix.outputs.applied != 'true' || (env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes != 'true'))
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Only run if we haven't already created a PR (success path)
          if [ -n "${{ steps.create-pr.outputs.pr_url }}" ]; then
            echo "PR was created, skipping failure handling"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MODE="${{ env.PIPELINE_MODE }}"

          {
            if [ "$MODE" = "qa-only" ]; then
              echo "## QA-Only Re-Run Failed"
            else
              echo "## SDK Bug Fix Failed"
            fi
            echo ""
            if [ "$MODE" = "qa-only" ]; then
              echo "The QA-only re-run could not approve the existing fix for this issue."
            else
              echo "The SDK bug fix subagent could not generate a fix for this issue."
            fi
            echo ""
            if [ "${{ steps.fix.outputs.applied }}" != "true" ]; then
              if [ "$MODE" = "qa-only" ]; then
                echo "**Reason:** QA review did not approve the fix, or an error occurred."
              else
                echo "**Reason:** Subagent returned an error or could not resolve the issue."
              fi
            else
              echo "**Reason:** Subagent ran but produced no file changes."
            fi
            echo ""
            echo "[View workflow run](${RUN_URL})"
            echo ""
            echo "---"
            echo "*Posted by SDK bug fix pipeline.*"
          } > /tmp/failure-comment.md

          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" -F /tmp/failure-comment.md

          # Add fix-failed label, remove approved + pr-created if present
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --add-label "fix-failed" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "approved" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "pr-created" 2>/dev/null || true
