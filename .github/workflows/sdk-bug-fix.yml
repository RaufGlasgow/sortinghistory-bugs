name: SDK Bug Fix
run-name: "Fix #${{ github.event.client_payload.issue_number || inputs.issue_number }} (${{ github.event.client_payload.mode || inputs.mode || 'full' }})"

on:
  repository_dispatch:
    types: [sdk-bug-fix, approve]

  # PV2-4.4: Browser-friendly trigger for full pipeline or QA-only re-runs
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number on the private repo (e.g. 84)'
        required: true
        type: string
      mode:
        description: 'Pipeline mode: full = fix + QA, qa-only = QA on existing fix branch'
        required: true
        type: choice
        options:
          - full
          - qa-only
        default: full

permissions:
  contents: write

# PV2-4.4 AC6: Concurrency group resolves issue number from either trigger
concurrency:
  group: sdk-fix-${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  # Unified issue number resolution: repository_dispatch or workflow_dispatch
  ISSUE_NUM: ${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
  # PV2-4.4: Mode resolution — repository_dispatch is always "full"
  PIPELINE_MODE: ${{ github.event_name == 'repository_dispatch' && 'full' || github.event.inputs.mode }}

jobs:
  fix-bug:
    runs-on: macos-14
    # BA-007.1 AC5: 15 minutes for qa-only, 90 for full (2 full attempts + overhead)
    timeout-minutes: ${{ github.event.inputs.mode == 'qa-only' && 15 || 90 }}

    steps:
      - name: Validate payload
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue_number: '$ISSUE'. Must be a positive integer."
            exit 1
          fi
          echo "ISSUE_NUMBER=$ISSUE" >> "$GITHUB_ENV"
          echo "Validated issue_number: $ISSUE"
          echo "Pipeline mode: ${{ env.PIPELINE_MODE }}"

      - name: Check Idempotency Guard
        id: guard
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          LABELS=$(gh api repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels --jq '.[].name')

          HAS_PR_CREATED=$(echo "$LABELS" | grep -c "^pr-created$" || true)
          HAS_FIX_FAILED=$(echo "$LABELS" | grep -c "^fix-failed$" || true)

          # Block only if a PR is open AND the fix hasn't failed yet
          # fix-failed overrides pr-created: the PR was closed by rejection, allow retry
          if [ "$HAS_PR_CREATED" -gt 0 ] && [ "$HAS_FIX_FAILED" -eq 0 ]; then
            echo "Issue #${{ env.ISSUE_NUM }} has 'pr-created' label and no 'fix-failed' — skipping to prevent duplicate work."
            echo "blocked=true" >> $GITHUB_OUTPUT
            echo "label=pr-created" >> $GITHUB_OUTPUT
          else
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Idempotency Block Notice
        if: steps.guard.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          BLOCK_LABEL="${{ steps.guard.outputs.label }}"
          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --body "## Pipeline Skipped

          Pipeline skipped — issue already has \`$BLOCK_LABEL\`. Use /reject to retry.

          ---
          *Posted by SDK bug fix pipeline.*"

      # Clean stale labels from previous attempts (moved here from auto-retry per architect review)
      - name: Clean stale labels on startup
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          STALE_LABELS=("fix-failed" "needs-claude-code" "needs-handoff-review" "pr-created" "fix-generated" "approved")
          for LABEL in "${STALE_LABELS[@]}"; do
            gh api "repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}/labels/${LABEL}" \
              --method DELETE 2>&1 || true
          done
          echo "Cleaned stale labels for issue #${{ env.ISSUE_NUM }}"

      - name: Checkout public repo (automation scripts + SDK)
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/checkout@v4

      - name: Checkout private repo (game source)
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/checkout@v4
        with:
          repository: RaufGlasgow/Sorting-History
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main
          path: game-repo
          fetch-depth: 0

      - name: Setup Node.js
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode 16.2
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install SDK dependencies
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        working-directory: Scripts/sdk
        run: npm ci

      - name: Build SDK
        if: (steps.guard.outputs.blocked || 'false') != 'true'
        working-directory: Scripts/sdk
        run: npm run build

      # ── Story 3.6c: Auto-bypass check for failing classifications ──
      # Runs BEFORE the fix subagent. Checks always-handoff list and historical failure rate.
      # If bypass triggers: skips fix, posts handoff comment, logs outcome.

      - name: Check auto-bypass (Story 3.6c)
        id: bypass_check
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"

          # Fetch classification from issue labels (hyphen format on GitHub)
          LABELS=$(gh issue view "$ISSUE" --repo RaufGlasgow/Sorting-History --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          CLASSIFICATION=""
          CLASSIFICATION_LABEL=""
          for LABEL in $LABELS; do
            case "$LABEL" in
              content-error)        CLASSIFICATION="content_error"; CLASSIFICATION_LABEL="$LABEL" ;;
              translation-error)    CLASSIFICATION="translation_error"; CLASSIFICATION_LABEL="$LABEL" ;;
              crash-bug)            CLASSIFICATION="crash_bug"; CLASSIFICATION_LABEL="$LABEL" ;;
              ui-bug)               CLASSIFICATION="ui_bug"; CLASSIFICATION_LABEL="$LABEL" ;;
              gameplay-bug)         CLASSIFICATION="gameplay_bug"; CLASSIFICATION_LABEL="$LABEL" ;;
              code-bug)             CLASSIFICATION="code_bug"; CLASSIFICATION_LABEL="$LABEL" ;;
              performance-issue)    CLASSIFICATION="performance_issue"; CLASSIFICATION_LABEL="$LABEL" ;;
              purchase-error)       CLASSIFICATION="purchase_error"; CLASSIFICATION_LABEL="$LABEL" ;;
              data-corruption)      CLASSIFICATION="data_corruption"; CLASSIFICATION_LABEL="$LABEL" ;;
              multiplayer-error)    CLASSIFICATION="multiplayer_error"; CLASSIFICATION_LABEL="$LABEL" ;;
            esac
          done

          echo "classification=$CLASSIFICATION" >> $GITHUB_OUTPUT
          echo "classification_label=$CLASSIFICATION_LABEL" >> $GITHUB_OUTPUT

          if [ -z "$CLASSIFICATION" ]; then
            echo "No recognized classification label found — proceeding with fix"
            echo "bypass=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Classification: $CLASSIFICATION (label: $CLASSIFICATION_LABEL)"

          # ── Always-handoff check (P0 severity — never attempt LLM fix) ──
          # Keep in sync with ALWAYS_HANDOFF_CLASSIFICATIONS in config.ts
          if [[ "$CLASSIFICATION" == "crash_bug" || "$CLASSIFICATION" == "purchase_error" ]]; then
            echo "bypass=true" >> $GITHUB_OUTPUT
            echo "reason=P0 severity — always handoff" >> $GITHUB_OUTPUT
            echo "Auto-bypass triggered: $CLASSIFICATION is in always-handoff list"
            exit 0
          fi

          # ── Historical failure rate check ──
          # Threshold: 5 (keep in sync with AUTO_BYPASS_THRESHOLD in config.ts)
          AUTO_BYPASS_THRESHOLD=5

          if [ -f pipeline-outcomes.jsonl ]; then
            FAIL_COUNT=$(cat pipeline-outcomes.jsonl | jq -s "[.[] | select(.classification == \"$CLASSIFICATION\" and .stage == \"fix\" and .outcome != \"success\")] | length")
            TOTAL_COUNT=$(cat pipeline-outcomes.jsonl | jq -s "[.[] | select(.classification == \"$CLASSIFICATION\" and .stage == \"fix\")] | length")

            echo "Historical fix stats for $CLASSIFICATION: $FAIL_COUNT failures / $TOTAL_COUNT total"

            if [ "$TOTAL_COUNT" -ge "$AUTO_BYPASS_THRESHOLD" ] && [ "$FAIL_COUNT" -eq "$TOTAL_COUNT" ]; then
              echo "bypass=true" >> $GITHUB_OUTPUT
              echo "reason=${CLASSIFICATION} fixes have failed ${TOTAL_COUNT}/${TOTAL_COUNT} times" >> $GITHUB_OUTPUT
              echo "Auto-bypass triggered: 100% failure rate at or above threshold"
              exit 0
            fi
          else
            echo "No pipeline-outcomes.jsonl found — no historical data, proceeding with fix"
          fi

          echo "bypass=false" >> $GITHUB_OUTPUT
          echo "No auto-bypass triggered — proceeding with fix"

      - name: Log auto-bypass outcome (Story 3.6c)
        if: steps.bypass_check.outputs.bypass == 'true'
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"
          CLASSIFICATION="${{ steps.bypass_check.outputs.classification }}"
          REASON="${{ steps.bypass_check.outputs.reason }}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          JSON_LINE=$(jq -n -c \
            --argjson issue_number "$ISSUE" \
            --arg timestamp "$TIMESTAMP" \
            --arg stage "fix" \
            --arg classification "$CLASSIFICATION" \
            --argjson severity null \
            --argjson confidence null \
            --argjson model null \
            --argjson turns_used 0 \
            --argjson max_turns 0 \
            --argjson cost_usd 0 \
            --arg outcome "auto_bypassed" \
            --argjson attempt_number 0 \
            --arg error_detail "$REASON" \
            '{
              issue_number: $issue_number,
              timestamp: $timestamp,
              stage: $stage,
              classification: $classification,
              severity: $severity,
              confidence: $confidence,
              model: $model,
              turns_used: $turns_used,
              max_turns: $max_turns,
              cost_usd: $cost_usd,
              outcome: $outcome,
              attempt_number: $attempt_number,
              error_detail: $error_detail
            }')

          echo "Logging auto-bypass: $JSON_LINE"
          echo "$JSON_LINE" >> pipeline-outcomes.jsonl

          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"
          git add pipeline-outcomes.jsonl
          git commit -m "log: auto-bypass for #$ISSUE ($CLASSIFICATION)"

          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed, retrying with rebase (attempt $i)..."
            git pull --rebase origin main || true
          done

      - name: Post auto-bypass handoff comment (Story 3.6c)
        if: steps.bypass_check.outputs.bypass == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"
          CLASSIFICATION="${{ steps.bypass_check.outputs.classification }}"
          REASON="${{ steps.bypass_check.outputs.reason }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "## Auto-Bypass: Routed to Fix Locally"
            echo ""
            echo "**Classification:** \`$CLASSIFICATION\`"
            echo "**Reason:** $REASON"
            echo ""
            echo "The pipeline has skipped the LLM fix attempt for this issue because:"
            if [[ "$CLASSIFICATION" == "crash_bug" || "$CLASSIFICATION" == "purchase_error" ]]; then
              echo "- This classification is P0 severity and always routes to manual handoff."
            else
              echo "- Historical data shows this classification has a 100% failure rate for automated fixes."
            fi
            echo ""
            echo "**Action required:** Fix this issue manually (Fix Locally)."
            echo ""
            echo "---"
            echo "*Posted by [SDK bug fix pipeline — auto-bypass](${RUN_URL}) (Story 3.6c).*"
          } > /tmp/bypass-comment.md

          gh issue comment --repo RaufGlasgow/Sorting-History "$ISSUE" -F /tmp/bypass-comment.md

          # Add needs-dev-handoff label
          gh issue edit --repo RaufGlasgow/Sorting-History "$ISSUE" \
            --add-label "needs-dev-handoff" 2>/dev/null || true

          # Remove approved label since we're not proceeding with fix
          gh issue edit --repo RaufGlasgow/Sorting-History "$ISSUE" \
            --remove-label "approved" 2>/dev/null || true

          echo "Auto-bypass handoff comment posted and labels updated for issue #$ISSUE"

      # ── Branch setup: different for full vs qa-only ──

      - name: Create fix branch in game repo (full mode)
        id: branch
        if: (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        working-directory: game-repo
        run: |
          BRANCH="fix/sdk-bug-${{ env.ISSUE_NUM }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      # PV2-4.4 AC3a: Checkout existing fix branch (qa-only mode)
      - name: Checkout existing fix branch (qa-only mode)
        id: branch-qa
        if: (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true' && env.PIPELINE_MODE == 'qa-only'
        working-directory: game-repo
        run: |
          BRANCH="fix/sdk-bug-${{ env.ISSUE_NUM }}"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

          # Check if the branch exists on the remote
          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "::error::No fix branch found for issue #${{ env.ISSUE_NUM }}. Run a full pipeline first, or verify the issue number is correct."
            exit 1
          fi

          git checkout "$BRANCH"
          echo "Checked out existing fix branch: $BRANCH"

      # ── Capture version before subagent (defense against version clobbering) ──

      - name: Capture version string before subagent
        id: pre-version
        if: (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true'
        working-directory: game-repo
        run: |
          VERSION_LINE=$(grep -n '1\.1\.0-\(alpha\|beta\)\.[0-9]' Views/SettingsView.swift | head -1)
          if [ -n "$VERSION_LINE" ]; then
            LINE_NUM=$(echo "$VERSION_LINE" | cut -d: -f1)
            LINE_CONTENT=$(echo "$VERSION_LINE" | cut -d: -f2-)
            echo "line_num=$LINE_NUM" >> $GITHUB_OUTPUT
            echo "line_content<<EOF" >> $GITHUB_OUTPUT
            echo "$LINE_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Captured version line $LINE_NUM: $LINE_CONTENT"
          else
            echo "WARNING: Could not find version string in SettingsView.swift"
            echo "line_num=" >> $GITHUB_OUTPUT
          fi

      # ── Run SDK orchestrator ──

      - name: Run SDK bug-fix subagent with QA gate
        id: fix
        if: (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true'
        working-directory: Scripts/sdk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set +e

          # PV2-4.4 AC7/AC8: Pass --qa-only flag when mode is qa-only
          QA_ONLY_FLAG=""
          if [ "${{ env.PIPELINE_MODE }}" = "qa-only" ]; then
            QA_ONLY_FLAG="--qa-only"
          fi

          OUTPUT=$(node dist/orchestrator.js bug-fix \
            --issue ${{ env.ISSUE_NUM }} \
            --game-repo "${{ github.workspace }}/game-repo" \
            $QA_ONLY_FLAG 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          # Parse key fields from orchestrator stdout for PR body
          FIX_SUMMARY=$(echo "$OUTPUT" | grep '\[orchestrator\] Bug fix result:' | head -1)
          FILES_MODIFIED=$(echo "$OUTPUT" | grep '\[orchestrator\] Files modified:' | sed 's/.*Files modified: //')
          COMPILATION=$(echo "$OUTPUT" | grep '\[orchestrator\] Compilation:' | sed 's/.*Compilation: //')
          CONFIDENCE=$(echo "$OUTPUT" | grep '\[orchestrator\] Confidence:' | sed 's/.*Confidence: //')
          FIX_ATTEMPTS=$(echo "$OUTPUT" | grep '\[orchestrator\] Fix attempts used:' | sed 's/.*Fix attempts used: //')

          # PIPE-011: Capture fix summary for email
          FIX_SUMMARY_TEXT=$(echo "$OUTPUT" | grep '\[orchestrator\] Fix summary:' | sed 's/.*\[orchestrator\] Fix summary: //' | head -1)
          if [ -z "$FIX_SUMMARY_TEXT" ]; then
            # Fallback: try the "Bug fix result:" line
            FIX_SUMMARY_TEXT=$(echo "$OUTPUT" | grep '\[orchestrator\] Bug fix result:' | sed 's/.*\[orchestrator\] Bug fix result: //' | head -1)
          fi
          FIX_SUMMARY_FILE="${{ github.workspace }}/fix-summary.txt"
          if [ -n "$FIX_SUMMARY_TEXT" ]; then
            printf '%s' "$FIX_SUMMARY_TEXT" > "$FIX_SUMMARY_FILE"
            echo "fix_summary_file=$FIX_SUMMARY_FILE" >> $GITHUB_OUTPUT
            echo "Fix summary captured: $FIX_SUMMARY_TEXT"
          else
            echo "" > "$FIX_SUMMARY_FILE"
            echo "fix_summary_file=$FIX_SUMMARY_FILE" >> $GITHUB_OUTPUT
            echo "No fix summary found in orchestrator output"
          fi

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "files_modified=${FILES_MODIFIED:-unknown}" >> $GITHUB_OUTPUT
          echo "compilation=${COMPILATION:-unknown}" >> $GITHUB_OUTPUT
          echo "confidence=${CONFIDENCE:-unknown}" >> $GITHUB_OUTPUT
          echo "fix_attempts=${FIX_ATTEMPTS:-0}" >> $GITHUB_OUTPUT

          # Check if QA summary file was written by the orchestrator (PV2-3.3 AC10)
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          if [ -f "$QA_SUMMARY_FILE" ]; then
            echo "has_qa_summary=true" >> $GITHUB_OUTPUT
            echo "QA summary file found at $QA_SUMMARY_FILE"
          else
            echo "has_qa_summary=false" >> $GITHUB_OUTPUT
            echo "No QA summary file found"
          fi

          if [ $EXIT_CODE -ne 0 ]; then
            echo "applied=false" >> $GITHUB_OUTPUT
            # Truncate error output for GitHub Actions (max 1MB)
            ERROR_SUMMARY=$(echo "$OUTPUT" | tail -20)
            {
              echo "error_summary<<EREOF"
              echo "$ERROR_SUMMARY"
              echo "EREOF"
            } >> $GITHUB_OUTPUT
          else
            echo "applied=true" >> $GITHUB_OUTPUT
          fi

          exit $EXIT_CODE
        continue-on-error: true

      # ── Defense: revert version string if subagent clobbered it ──

      - name: Revert version string if subagent clobbered it
        if: (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true' && steps.pre-version.outputs.line_num != ''
        working-directory: game-repo
        run: |
          PRE_LINE="${{ steps.pre-version.outputs.line_content }}"
          LINE_NUM="${{ steps.pre-version.outputs.line_num }}"
          SETTINGS_FILE="Views/SettingsView.swift"

          CURRENT_LINE=$(sed -n "${LINE_NUM}p" "$SETTINGS_FILE")

          if [ "$CURRENT_LINE" != "$PRE_LINE" ]; then
            echo "WARNING: Subagent modified version string!"
            echo "  Before: $PRE_LINE"
            echo "  After:  $CURRENT_LINE"
            echo "Reverting to pre-subagent version..."
            # Use awk for safe line replacement (sed breaks on |, &, \ in content)
            awk -v ln="$LINE_NUM" -v content="$PRE_LINE" 'NR==ln{print content; next}1' "$SETTINGS_FILE" > "${SETTINGS_FILE}.tmp" && mv "${SETTINGS_FILE}.tmp" "$SETTINGS_FILE"
            REVERTED=$(sed -n "${LINE_NUM}p" "$SETTINGS_FILE")
            echo "Reverted to: $REVERTED"
          else
            echo "Version string unchanged by subagent (good)"
          fi

      # ── Full mode: check for changes, commit, version bump ──

      - name: Clean build artifacts before change check
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        working-directory: game-repo
        run: |
          # Remove DerivedData created by subagent's xcodebuild during fix attempts
          rm -rf DerivedData/ .build/ 2>/dev/null || true
          git checkout -- DerivedData/ .build/ 2>/dev/null || true
          echo "Build artifacts cleaned before change check"

      - name: Check for changes in game repo
        id: changes
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full'
        working-directory: game-repo
        run: |
          CHANGED_FILES=$(git diff --name-only)
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
          ALL_FILES="$CHANGED_FILES"$'\n'"$UNTRACKED_FILES"
          # Filter out build artifacts that may have survived cleanup
          ALL_FILES=$(echo "$ALL_FILES" | grep -v '^DerivedData/' | grep -v '^\.build/' | grep -v '^xcuserdata/' | sed '/^$/d')

          if [ -z "$ALL_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in game repo"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$ALL_FILES"
            {
              echo "modified_files<<MFEOF"
              echo "$ALL_FILES"
              echo "MFEOF"
            } >> $GITHUB_OUTPUT
          fi

      # PV2-6.3: Independent compilation verification (AC1-AC6, AC8)
      # Runs xcodebuild independently of the subagent's self-report.
      # Scheme name must match SortingHistory.xcodeproj/xcshareddata/xcschemes/
      - name: Independent compilation check
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.fix.outputs.applied == 'true' && steps.changes.outputs.has_changes == 'true' && env.PIPELINE_MODE == 'full'
        id: compile-check
        timeout-minutes: 5
        working-directory: game-repo
        run: |
          echo "=== Independent compilation verification ==="
          echo "Xcode version: $(xcodebuild -version | head -1)"
          echo "Xcode path: $(xcode-select -p)"

          if xcodebuild build \
            -scheme SortingHistory \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet 2>&1; then
            echo "COMPILE_RESULT=success" >> "$GITHUB_ENV"
            echo "::notice::Independent compilation check PASSED"
          else
            echo "COMPILE_RESULT=failed" >> "$GITHUB_ENV"
            echo "::error::Independent compilation check FAILED"
            echo "Subagent reported: ${{ steps.fix.outputs.compilation }}"
            exit 1
          fi

      # ── Success path (full mode): commit, push, bump version, create PR ──

      - name: Commit changes
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        run: |
          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"

          # Safe git add: only stage files with allowed extensions
          # Replaces dangerous `git add -A` that staged DerivedData (PR #90)
          # Uses `while read` instead of `for` to handle paths with spaces
          ALLOWED_EXTS="swift json strings md plist pbxproj xcscheme"
          STAGED_COUNT=0

          # Collect all changed + untracked files (one per line, handles spaces)
          # Uses process substitution so STAGED_COUNT is visible after the loop
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            # Skip exclusion patterns (includes SourcePackages — SPM artifacts)
            case "$FILE" in
              *DerivedData/*|*.build/*|*xcuserdata/*|*node_modules/*|*SourcePackages/*|*.DS_Store|*.o|*.dSYM|*.dSYM/*)
                echo "EXCLUDED: $FILE"
                continue
                ;;
            esac

            # Check file extension against allowlist
            EXT="${FILE##*.}"
            ALLOWED=false
            for AEXT in $ALLOWED_EXTS; do
              if [ "$EXT" = "$AEXT" ]; then
                ALLOWED=true
                break
              fi
            done

            if [ "$ALLOWED" = true ]; then
              git add -- "$FILE"
              echo "STAGED: $FILE"
              STAGED_COUNT=$((STAGED_COUNT + 1))
            else
              echo "EXCLUDED: $FILE (extension .$EXT not in allowlist)"
            fi
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)

          echo "Safe git add complete: $STAGED_COUNT file(s) staged"

          if git diff --staged --quiet; then
            echo "No changes to commit after staging"
            exit 1
          fi

          git commit -m "fix(#${{ env.ISSUE_NUM }}): SDK bug fix for #${{ env.ISSUE_NUM }}

          Applied by SDK bug fix pipeline with QA gate
          Compilation: ${{ steps.fix.outputs.compilation }}
          Confidence: ${{ steps.fix.outputs.confidence }}"

      # PV2-3.3 AC14: Version bump AFTER QA approval (not before commit)
      # PV2-4.4 AC4: Skip version bump entirely in qa-only mode
      - name: Bump version (centralized)
        id: bump-version
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          GAME_REPO_PATH: "."
        run: |
          bash "${{ github.workspace }}/Scripts/bump-version.sh"

      # PV2-4.4 AC10: Fix git add -A bug — use safe git add pattern for version bump amend
      - name: Amend commit with version bump
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.bump-version.outputs.BUILD_NUMBER != ''
        working-directory: game-repo
        run: |
          # Stage only files with allowed extensions (same pattern as Commit step)
          # Replaces dangerous `git add -A` that reintroduces build artifacts
          # Uses `while read` with process substitution to handle paths with spaces
          ALLOWED_EXTS="swift json strings md plist pbxproj xcscheme"
          STAGED_COUNT=0

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            case "$FILE" in
              *DerivedData/*|*.build/*|*xcuserdata/*|*node_modules/*|*SourcePackages/*|*.DS_Store|*.o|*.dSYM|*.dSYM/*)
                echo "EXCLUDED: $FILE"
                continue
                ;;
            esac

            EXT="${FILE##*.}"
            ALLOWED=false
            for AEXT in $ALLOWED_EXTS; do
              if [ "$EXT" = "$AEXT" ]; then
                ALLOWED=true
                break
              fi
            done

            if [ "$ALLOWED" = true ]; then
              git add -- "$FILE"
              echo "STAGED: $FILE"
              STAGED_COUNT=$((STAGED_COUNT + 1))
            else
              echo "EXCLUDED: $FILE (extension .$EXT not in allowlist)"
            fi
          done < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)

          if ! git diff --staged --quiet; then
            git commit --amend --no-edit
            echo "Version bump included in commit ($STAGED_COUNT file(s) staged)"
          else
            echo "No version bump changes to amend"
          fi

      - name: Push branch (full mode)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true'
        working-directory: game-repo
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists on remote -- force-pushing new fix"
            git push origin "$BRANCH" --force
          else
            echo "Branch $BRANCH is new -- pushing"
            git push origin "$BRANCH"
          fi

      # ── PR creation: handles both full and qa-only modes ──

      # PV2-4.4 AC3f: Create PR on success (works for both full and qa-only)
      - name: Create PR on private repo
        id: create-pr
        if: >-
          (steps.guard.outputs.blocked || 'false') != 'true' &&
          ((env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes == 'true' && steps.fix.outputs.applied == 'true' && steps.compile-check.outcome == 'success')
          || (env.PIPELINE_MODE == 'qa-only' && steps.fix.outputs.applied == 'true'))
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE_NUM="${{ env.ISSUE_NUM }}"
          BRANCH="${{ steps.branch.outputs.name || steps.branch-qa.outputs.name }}"
          COMPILATION="${{ steps.fix.outputs.compilation }}"
          CONFIDENCE="${{ steps.fix.outputs.confidence }}"
          FILES_MODIFIED="${{ steps.fix.outputs.files_modified }}"
          FIX_ATTEMPTS="${{ steps.fix.outputs.fix_attempts }}"
          BUILD_NUMBER="${{ steps.bump-version.outputs.BUILD_NUMBER }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          MODE="${{ env.PIPELINE_MODE }}"

          # Fetch issue title
          ISSUE_TITLE=$(gh api repos/RaufGlasgow/Sorting-History/issues/${ISSUE_NUM} --jq '.title')
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT

          # BA-010.3: Only close existing PR on retry or manual dispatch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --repo RaufGlasgow/Sorting-History --json number -q '.[0].number' 2>/dev/null || true)
          OLD_PR_NUMBER=""
          if [ -n "$EXISTING_PR" ]; then
            RETRY="${{ github.event.client_payload.retry }}"
            IS_MANUAL="${{ github.event_name }}"
            if [ "$RETRY" = "true" ] || [ "$IS_MANUAL" = "workflow_dispatch" ]; then
              echo "Closing existing PR #$EXISTING_PR (retry=$RETRY, trigger=$IS_MANUAL)"
              gh pr comment "$EXISTING_PR" --repo RaufGlasgow/Sorting-History --body "Superseded by new fix attempt. See new PR when created." 2>/dev/null || true
              gh pr close "$EXISTING_PR" --repo RaufGlasgow/Sorting-History 2>/dev/null || true
              OLD_PR_NUMBER="$EXISTING_PR"
            else
              echo "Open PR #$EXISTING_PR exists and this is NOT a retry — skipping PR creation"
              gh issue comment --repo RaufGlasgow/Sorting-History "${ISSUE_NUM}" \
                --body "Pipeline skipped — open PR already exists (#$EXISTING_PR). Use /reject to retry."
              exit 0
            fi
          fi

          # Build PR body file (uses --body-file to avoid shell backtick issues)
          PR_BODY_FILE="/tmp/pr-body-${ISSUE_NUM}.md"

          {
            if [ -n "$OLD_PR_NUMBER" ]; then
              echo "> **Re-run:** Replaces PR #$OLD_PR_NUMBER"
              echo ""
            fi
            if [ "$MODE" = "qa-only" ]; then
              echo "## SDK Bug Fix (QA-Only Re-Run)"
              echo ""
              echo "Fixes RaufGlasgow/Sorting-History#${ISSUE_NUM}"
              echo ""
              echo "> This PR was created by a **QA-only re-run**. The fix was generated in a previous pipeline run."
              echo "> No new fix was generated. Only QA review and quality gate were re-run."
              echo ""
            else
              echo "## SDK Bug Fix"
              echo ""
              echo "Fixes RaufGlasgow/Sorting-History#${ISSUE_NUM}"
              echo ""
              echo "### Changes Made"
              echo "**Compilation:** ${COMPILATION}"
              echo "**Confidence:** ${CONFIDENCE}"
              if [ "$FIX_ATTEMPTS" -gt 1 ] 2>/dev/null; then
                echo "**Fix Attempts:** ${FIX_ATTEMPTS} (retry with model escalation)"
              fi
              echo ""
              echo "**Files modified:**"
              echo '```'
              echo "${{ steps.changes.outputs.modified_files }}"
              echo '```'
              echo ""
            fi

            # Include QA summary if available (PV2-3.3 AC9)
            if [ -f "$QA_SUMMARY_FILE" ]; then
              echo "---"
              echo ""
              cat "$QA_SUMMARY_FILE"
              echo ""
              echo "---"
              echo ""
            fi

            if [ "$MODE" = "full" ] && [ -n "$BUILD_NUMBER" ]; then
              echo "### How to Test"
              echo "1. Install the build with the fix and verify issue #${ISSUE_NUM} is resolved"
              echo "2. Navigate to the area affected by issue #${ISSUE_NUM}"
              echo "3. Verify the bug is fixed"
              echo "4. Check for regressions in related functionality"
              echo ""
              echo '```bash'
              echo "# Build and test locally:"
              echo "xcodebuild build \\"
              echo "  -scheme SortingHistory \\"
              echo "  -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2' \\"
              echo "  -derivedDataPath DerivedData \\"
              echo "  CODE_SIGNING_ALLOWED=NO"
              echo '```'
              echo ""
            fi

            echo "### Rejection Instructions"
            echo "If this fix doesn't work, post a comment **on this PR** with:"
            echo '```'
            echo "/reject Describe what's still broken"
            echo '```'
            echo ""
            echo "---"
            if [ "$MODE" = "qa-only" ]; then
              echo "*Created by [SDK bug fix pipeline -- QA-only re-run](${RUN_URL}).*"
            else
              echo "*Created by [SDK bug fix pipeline](${RUN_URL}) (retry loop + model escalation + QA gate).*"
            fi
            echo "*All fixes require manual review and merge.*"
          } > "$PR_BODY_FILE"

          # PR title
          if [ "$MODE" = "qa-only" ]; then
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE} [QA re-run]"
          elif [ "$FIX_ATTEMPTS" -gt 1 ] 2>/dev/null; then
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE} [attempt ${FIX_ATTEMPTS}]"
          else
            PR_TITLE="fix(issue ${ISSUE_NUM}): ${ISSUE_TITLE}"
          fi

          gh pr create \
            --repo RaufGlasgow/Sorting-History \
            --head "$BRANCH" \
            --base main \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_FILE"

          # Get PR URL
          PR_URL=$(gh pr view --repo RaufGlasgow/Sorting-History "$BRANCH" --json url -q .url)
          PR_NUMBER=$(gh pr view --repo RaufGlasgow/Sorting-History "$BRANCH" --json number -q .number)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Cleanup
          rm -f "$PR_BODY_FILE"

      # PV2-3.3 AC11: Post QA review comment on the issue
      - name: Post QA review comment on issue
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.fix.outputs.has_qa_summary == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          if [ -f "$QA_SUMMARY_FILE" ]; then
            gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" --body-file "$QA_SUMMARY_FILE"
            echo "QA review comment posted on issue #${{ env.ISSUE_NUM }}"
          fi

      - name: Post success comment on issue
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          MODE="${{ env.PIPELINE_MODE }}"

          {
            if [ "$MODE" = "qa-only" ]; then
              echo "## SDK Fix PR Ready for Review (QA-Only Re-Run): PR #${PR_NUMBER}"
            else
              echo "## SDK Fix PR Ready for Review: PR #${PR_NUMBER}"
            fi
            echo ""
            echo "**Status:** Awaiting your review"
            echo "**Branch:** \`${{ steps.branch.outputs.name || steps.branch-qa.outputs.name }}\`"
            echo ""
            echo "### Next Steps"
            echo "1. Review the changes in [PR #${PR_NUMBER}](${PR_URL})"
            echo "2. If the fix looks correct, merge the PR"
            echo "3. If the fix is wrong, post a comment **on the PR** with:"
            echo '   ```'
            echo "   /reject Reason why the fix doesn't work"
            echo '   ```'
          } > /tmp/success-comment.md

          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" -F /tmp/success-comment.md

      - name: Label issue with fix-generated
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --add-label "fix-generated,pr-created"

      # Story 3.15 AC1: Commit bug-fix state files on success path
      - name: Commit state files (success)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        continue-on-error: true
        run: |
          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"
          git add Scripts/sdk/state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: bug-fix complete for issue #$ISSUE_NUM" && \
             git pull --rebase origin main && \
             git push)

      - name: Clean up stale failure labels (full mode success)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'full' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "fix-failed" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "needs-handoff-review" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "needs-manual-fix" 2>/dev/null || true
          echo "Cleaned up stale failure labels from issue #${{ env.ISSUE_NUM }}"

      - name: Fetch issue body for email context
        id: issue-body
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Fetch full issue body for email context (stripIssueBody in TypeScript handles size limits)
          BODY=$(gh api "repos/RaufGlasgow/Sorting-History/issues/${{ env.ISSUE_NUM }}" --jq '.body // ""' 2>/dev/null || echo "")
          # Write to file to avoid shell quoting issues
          printf '%s' "$BODY" > /tmp/issue-body.txt
          echo "has_body=true" >> $GITHUB_OUTPUT

      - name: Read QA summary for email context
        id: qa-for-email
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        run: |
          QA_SUMMARY_FILE="${{ github.workspace }}/qa-summary.md"
          if [ -f "$QA_SUMMARY_FILE" ]; then
            # Pass full QA summary — TypeScript handles size limits for email
            cp "$QA_SUMMARY_FILE" /tmp/qa-summary-email.txt
            echo "has_qa=true" >> $GITHUB_OUTPUT
          else
            echo "has_qa=false" >> $GITHUB_OUTPUT
          fi

      # PIPE-011 AC-4: Fetch PR diff for email
      - name: Fetch PR diff for email
        id: fetch-diff
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          echo "Fetching diff for PR #${PR_NUMBER}..."
          gh api "repos/RaufGlasgow/Sorting-History/pulls/${PR_NUMBER}" \
            -H "Accept: application/vnd.github.v3.diff" \
            > /tmp/pr-diff.txt 2>/dev/null || echo "" > /tmp/pr-diff.txt

          DIFF_SIZE=$(wc -c < /tmp/pr-diff.txt | tr -d ' ')
          DIFF_LINES=$(wc -l < /tmp/pr-diff.txt | tr -d ' ')
          echo "Diff fetched: ${DIFF_SIZE} bytes, ${DIFF_LINES} lines"
          echo "diff_file=/tmp/pr-diff.txt" >> $GITHUB_OUTPUT

      - name: Send PR created email
        if: (steps.guard.outputs.blocked || 'false') != 'true' && steps.create-pr.outputs.pr_url != ''
        working-directory: Scripts/sdk
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUM }}
          ISSUE_TITLE: ${{ steps.create-pr.outputs.issue_title }}
          FILES_MODIFIED: ${{ steps.fix.outputs.files_modified }}
          COMPILATION: ${{ steps.fix.outputs.compilation }}
          CONFIDENCE: ${{ steps.fix.outputs.confidence }}
          FIX_ATTEMPTS: ${{ steps.fix.outputs.fix_attempts }}
          BUILD_NUMBER: ${{ steps.bump-version.outputs.BUILD_NUMBER }}
          PIPELINE_MODE: ${{ env.PIPELINE_MODE }}
          ISSUE_BODY_FILE: /tmp/issue-body.txt
          QA_SUMMARY_FILE: /tmp/qa-summary-email.txt
          DIFF_FILE: ${{ steps.fetch-diff.outputs.diff_file }}
          FIX_SUMMARY_FILE: ${{ steps.fix.outputs.fix_summary_file }}
        run: node dist/send-pr-email.js
        continue-on-error: true

      # PV2-4.4 AC3f: Remove escalation labels on qa-only success
      - name: Remove escalation labels (qa-only success)
        if: (steps.guard.outputs.blocked || 'false') != 'true' && env.PIPELINE_MODE == 'qa-only' && steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "needs-handoff-review" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "fix-failed" 2>/dev/null || true
          echo "Removed escalation labels from issue #${{ env.ISSUE_NUM }}"

      # ── Failure path: label + comment ──

      - name: Handle failure - no changes
        if: always() && (steps.guard.outputs.blocked || 'false') != 'true' && (steps.fix.outputs.applied != 'true' || (env.PIPELINE_MODE == 'full' && steps.changes.outputs.has_changes != 'true'))
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          # Only run if we haven't already created a PR (success path)
          if [ -n "${{ steps.create-pr.outputs.pr_url }}" ]; then
            echo "PR was created, skipping failure handling"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MODE="${{ env.PIPELINE_MODE }}"

          {
            if [ "$MODE" = "qa-only" ]; then
              echo "## QA-Only Re-Run Failed"
            else
              echo "## SDK Bug Fix Failed"
            fi
            echo ""
            if [ "$MODE" = "qa-only" ]; then
              echo "The QA-only re-run could not approve the existing fix for this issue."
            else
              echo "The SDK bug fix subagent could not generate a fix for this issue."
            fi
            echo ""
            if [ "${{ steps.fix.outputs.applied }}" != "true" ]; then
              if [ "$MODE" = "qa-only" ]; then
                echo "**Reason:** QA review did not approve the fix, or an error occurred."
              else
                echo "**Reason:** Subagent returned an error or could not resolve the issue."
              fi
            else
              echo "**Reason:** Subagent ran but produced no file changes."
            fi
            echo ""
            echo "[View workflow run](${RUN_URL})"
            echo ""
            echo "---"
            echo "*Posted by SDK bug fix pipeline.*"
          } > /tmp/failure-comment.md

          gh issue comment --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" -F /tmp/failure-comment.md

          # Add fix-failed label, remove approved + pr-created if present
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --add-label "fix-failed" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "approved" 2>/dev/null || true
          gh issue edit --repo RaufGlasgow/Sorting-History "${{ env.ISSUE_NUM }}" \
            --remove-label "pr-created" 2>/dev/null || true

      # Story 3.15 AC2: Commit bug-fix state files on failure path
      - name: Commit state files (failure)
        if: always() && (steps.guard.outputs.blocked || 'false') != 'true'
        continue-on-error: true
        run: |
          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"
          git add Scripts/sdk/state/ || true
          git diff --cached --quiet && echo "No state changes to commit" || \
            (git commit -m "state: bug-fix failed for issue #$ISSUE_NUM" && \
             git pull --rebase origin main && \
             git push)

      # PIPE-007.3: Removed duplicate YAML failure email.
      # The retry-loop.ts Handoff email (amber, with per-attempt detail) is now
      # the single failure notification. The "Handle failure" step above still
      # posts a comment and adds the fix-failed label.

      # ── Story 3.6a: Pipeline Outcome Logging ──
      # Story 3.6c: Skip if auto-bypass already logged its own entry
      - name: Log pipeline outcome
        if: always() && (steps.guard.outputs.blocked || 'false') != 'true' && (steps.bypass_check.outputs.bypass || 'false') != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          ISSUE="${{ env.ISSUE_NUM }}"
          if [ -z "$ISSUE" ] || ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "No valid issue number — skipping outcome log"
            exit 0
          fi

          # Determine outcome from fix step results
          FIX_APPLIED="${{ steps.fix.outputs.applied }}"
          FIX_EXIT_CODE="${{ steps.fix.outputs.exit_code }}"
          HAS_CHANGES="${{ steps.changes.outputs.has_changes }}"
          COMPILE_RESULT="${{ steps.compile-check.outcome }}"
          PR_CREATED="${{ steps.create-pr.outputs.pr_url }}"

          if [ -n "$PR_CREATED" ]; then
            OUTCOME="success"
            ERROR_DETAIL="null"
          elif [ "$COMPILE_RESULT" = "failure" ]; then
            OUTCOME="validation_failed"
            ERROR_DETAIL="\"Independent compilation check failed\""
          elif [ "$FIX_APPLIED" != "true" ]; then
            # Parse error from orchestrator output
            ERROR_SUMMARY="${{ steps.fix.outputs.error_summary }}"
            if echo "$ERROR_SUMMARY" | grep -qi "max.*turn\|turn.*limit\|exceeded.*turn"; then
              OUTCOME="error_max_turns"
              ERROR_DETAIL="\"Exceeded turn budget\""
            elif echo "$ERROR_SUMMARY" | grep -qi "cost\|budget\|spending"; then
              OUTCOME="cost_cap"
              ERROR_DETAIL="\"Cost cap exceeded\""
            elif echo "$ERROR_SUMMARY" | grep -qi "diff.*too.*large\|too.*many.*changes"; then
              OUTCOME="diff_too_large"
              ERROR_DETAIL="\"Diff too large for review\""
            elif echo "$ERROR_SUMMARY" | grep -qi "handoff"; then
              OUTCOME="handoff_generated"
              ERROR_DETAIL="\"Escalated to handoff\""
            else
              OUTCOME="model_crash"
              ERROR_DETAIL="\"Fix subagent failed — exit code $FIX_EXIT_CODE\""
            fi
          elif [ "$HAS_CHANGES" != "true" ]; then
            OUTCOME="model_crash"
            ERROR_DETAIL="\"Subagent ran but produced no file changes\""
          else
            OUTCOME="model_crash"
            ERROR_DETAIL="\"Unknown failure — fix applied but no PR created\""
          fi

          # Fetch classification and severity from issue labels
          LABELS=$(gh issue view "$ISSUE" --repo RaufGlasgow/Sorting-History --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          CLASSIFICATION="null"
          SEVERITY="null"
          for LABEL in $LABELS; do
            case "$LABEL" in
              content_error|translation_error|crash_bug|ui_bug|logic_bug|gameplay_bug|performance_bug|feature_request|duplicate|not_a_bug)
                CLASSIFICATION="\"$LABEL\""
                ;;
              P0|P1|P2|P3)
                SEVERITY="\"$LABEL\""
                ;;
            esac
          done

          # Extract available metrics from fix step outputs
          CONFIDENCE="${{ steps.fix.outputs.confidence }}"
          FIX_ATTEMPTS="${{ steps.fix.outputs.fix_attempts }}"
          ATTEMPT_NUM="${FIX_ATTEMPTS:-1}"
          if [ "$ATTEMPT_NUM" = "0" ] || [ "$ATTEMPT_NUM" = "unknown" ] || [ -z "$ATTEMPT_NUM" ]; then
            ATTEMPT_NUM=1
          fi

          # Confidence as number or null
          if [ -n "$CONFIDENCE" ] && [ "$CONFIDENCE" != "unknown" ] && [ "$CONFIDENCE" != "null" ]; then
            # Strip percentage sign if present, convert to decimal
            CONFIDENCE_NUM=$(echo "$CONFIDENCE" | sed 's/%//' | awk '{if ($1 > 1) print $1/100; else print $1}')
            if ! echo "$CONFIDENCE_NUM" | grep -qE '^[0-9]*\.?[0-9]+$'; then
              CONFIDENCE_NUM="null"
            fi
          else
            CONFIDENCE_NUM="null"
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build JSON with jq for safe escaping
          JSON_LINE=$(jq -n -c \
            --argjson issue_number "$ISSUE" \
            --arg timestamp "$TIMESTAMP" \
            --arg stage "fix" \
            --argjson classification "$CLASSIFICATION" \
            --argjson severity "$SEVERITY" \
            --argjson confidence "$CONFIDENCE_NUM" \
            --argjson model null \
            --argjson turns_used null \
            --argjson max_turns null \
            --argjson cost_usd null \
            --arg outcome "$OUTCOME" \
            --argjson attempt_number "$ATTEMPT_NUM" \
            --argjson error_detail "$ERROR_DETAIL" \
            '{
              issue_number: $issue_number,
              timestamp: $timestamp,
              stage: $stage,
              classification: $classification,
              severity: $severity,
              confidence: $confidence,
              model: $model,
              turns_used: $turns_used,
              max_turns: $max_turns,
              cost_usd: $cost_usd,
              outcome: $outcome,
              attempt_number: $attempt_number,
              error_detail: $error_detail
            }')

          echo "Logging outcome: $JSON_LINE"

          # Append to log file in the public repo (current checkout)
          echo "$JSON_LINE" >> pipeline-outcomes.jsonl

          git config user.name "SDK Bug Fix Bot"
          git config user.email "bot@sortinghistory.com"
          git add pipeline-outcomes.jsonl
          git commit -m "log: fix outcome for #$ISSUE"

          # Retry push with rebase for concurrent append handling
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed, retrying with rebase (attempt $i)..."
            git pull --rebase origin main || true
          done
