name = "bug-webhook"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

# Routes for custom domain
routes = [
  { pattern = "sortinghistory.com/api/bug", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/api/bug/*", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/api/commands", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/api/pipeline/*", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/api/bbe/*", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/api/reward-code/*", zone_name = "sortinghistory.com" },
  { pattern = "sortinghistory.com/screenshots/*", zone_name = "sortinghistory.com" }
]

[vars]
GITHUB_REPO = "RaufGlasgow/Sorting-History"
BUGS_REPO = "RaufGlasgow/sortinghistory-bugs"
AUTHORIZED_USERS = "RaufGlasgow"  # Comma-separated GitHub usernames allowed to /approve and /reject

# BBE-002 vars (non-secret config). These do NOT contain code values -
# the codes themselves live only in the BBE_CSV secret and the D1 database.
BBE_BATCH_ID = "bug-bounty-batch-496572"
BBE_BATCH_EXPIRATION = "2026-10-24"
BBE_REDEEM_BASE = "https://apps.apple.com/redeem?ctx=offercodes&id=6760428599&code="
BBE_LOW_INVENTORY_THRESHOLD = "100"
BBE_EXPIRATION_WARN_DAYS = "30"
BBE_ALERT_EMAIL = "raufglasgow@gmail.com"

# R2 bucket for screenshot storage (worker serves images via /screenshots/ route)
[[r2_buckets]]
binding = "SCREENSHOTS_BUCKET"
bucket_name = "sorting-history-bugs"

# For local development, the worker will be available at:
# http://localhost:8787

[[kv_namespaces]]
binding = "PIPELINE_KV"
id = "a542f150d87f46259a4ff31de7d8dc94"

# BBE-002: Cloudflare D1 database for bug-bounty reward-code inventory
# and audit log. Migrations live in ./migrations.
#
# IMPORTANT: `database_id` below is a placeholder. Before the first
# `wrangler deploy` Ra'uf MUST run `wrangler d1 create bbe-rewards`
# and paste the returned UUID into the `database_id` field below.
# Full step-by-step lives in the private repo at
# docs/runbooks/BBE-002-Ra-uf-deploy-runbook.md
[[d1_databases]]
binding = "BBE_DB"
database_name = "bbe-rewards"
database_id = "729eb80d-cff0-4a1a-bd02-8e44ae62663f"
migrations_dir = "migrations"

# Cron triggers - replaces unreliable GitHub Actions cron scheduler
# Times are UTC (Lisbon winter = UTC+0)
[triggers]
crons = [
  "0 9 * * 1",    # BBE-002: Mon 09:00 Lisbon - weekly BBE digest (no PAT dispatch; BBE runner only)
  # The three daily pipeline-digest crons (10/14/18 UTC) were REMOVED 2026-06-06.
  # They dispatched the Pipeline Digest workflow via repository_dispatch using
  # BUGS_REPO_PAT, which expired silently and triggered "Digest dispatch HTTP 401"
  # failure emails to Ra'uf every cron tick. Failure mode hit twice in 8 days.
  # Digest scheduling moved to native GitHub Actions cron in
  # .github/workflows/daily-analysis-digest.yml. Pipeline digest no longer
  # depends on this Worker or on BUGS_REPO_PAT. BBE inventory alert was a
  # best-effort piggy-back on the 10:00 cron; paused until/unless re-added.
]

# Secrets (set via `wrangler secret put <NAME>`):
# - GITHUB_TOKEN: Fine-grained PAT with issues:write on private repo
# - BUGS_REPO_PAT: Fine-grained PAT with contents:write on public bugs repo (for repository_dispatch)
# - WEBHOOK_SECRET: HMAC secret for GitHub webhook signature validation (BA-007.14)
# - AUTH_TOKEN: Token for pipeline action endpoints (approve/reject/comment/rework)
# - RESEND_API_KEY: Resend API key for outbound email (intake thank-you AND BBE reward emails)
# BBE-002 secrets:
# - BBE_CSV: Raw CSV of the bug-bounty offer-code batch (one CODE,URL per line).
#   Source: .private/offer-codes/bug-bounty-batch-<id>.csv (NEVER committed).
#   Imported on first run only; safe to leave set.
# - BBE_ADMIN_TOKEN: Bearer token for /api/bbe/* admin endpoints
#   (manual-send, invalidate-batch, import-csv, run-alerts, run-digest, status).
